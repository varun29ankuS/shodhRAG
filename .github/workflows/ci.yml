name: CI

on:
  pull_request:
    branches: [master]
    # ready_for_review: release PRs are opened as drafts by the Prepare
    # release workflow, whose token cannot start workflows; marking one ready
    # starts CI as the person who did.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  # nightly.yml: every job, unfiltered, on master once a day.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Runs on master
# are never cancelled (group per commit): pull requests download the footprint
# build a master run uploads, and master is the only ref that saves caches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=-crt-static"
  # llama.cpp (llama-cpp-sys-2) builds its HTTP client with HTTPS when CMake
  # finds OpenSSL. Shodh only loads local GGUF files and never uses llama.cpp's
  # downloader, so it is built without it: the result no longer depends on
  # which OpenSSL a runner has (OpenSSL 4 on macos-26 images from 20261012 does
  # not compile with the vendored cpp-httplib). llama-cpp-sys-2 passes CMAKE_*
  # variables to CMake, and llama.cpp's find_package(OpenSSL) is optional.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "TRUE"

# Every job has a timeout of about 1.5x its slowest successful run in the
# last 60 runs (noted per job), so a hung step fails in minutes, not after
# GitHub's 6-hour limit.
#
# Every job that builds ort-sys (check, clippy, test, build) first runs
# .github/actions/onnxruntime: the ONNX Runtime archive ort-sys links comes
# from the Actions cache (saved by master), checked against ort-sys's SHA-256,
# so builds no longer download it from cdn.pyke.io (where it stalled for 30
# minutes at a time).
#
# Heavy jobs run on a pull request only when it changes a file they read:
# Retrieval eval, Retrieval eval (int8, Apple silicon), Footprint budget, the
# release builds (release.yml: the Windows and macOS installers, built and
# verified as a release would be, without publishing) and the Android phone
# app (its debug APK, launched on an emulator) are skipped when every
# changed file is in their known-irrelevant set (the Changes job; an unknown
# or new path always runs them). Every other job runs on every pull request.
# Pushes to master, release pull requests (release/*) and the nightly run
# (nightly.yml) run every job: master's push run is what a release is gated on
# (scripts/release/ci-gate.mjs requires every job to have passed), uploads the
# footprint build that pull requests compare against, and saves the caches
# pull requests restore. CI gate is the one check that stands for all of
# them: it fails when any job failed, was cancelled or was skipped without
# the Changes job saying it was not needed.

jobs:
  # Which heavy jobs this change needs: each output is 'true' or 'false' and
  # is named after the job it decides (CI gate reads it under that name).
  # Each heavy job reads (or builds) more than its own directory, so the sets
  # are of files it can skip, never of files it needs: shodh-rag's modules
  # reach each other (rag_engine uses harness, research and workspaces, which
  # use embeddings, processing and rag_engine), so any change under
  # crates/shodh-rag runs every heavy job. scripts/release/test/ci-gate.test.mjs
  # resolves every include_*! and CARGO_MANIFEST_DIR path in the crates
  # against these sets, so a file a build or test reads is never skippable.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eval-retrieval: ${{ steps.filter.outputs.eval-retrieval }}
      eval-retrieval-int8: ${{ steps.filter.outputs.eval-retrieval-int8 }}
      eval-recall: ${{ steps.filter.outputs.eval-recall }}
      footprint: ${{ steps.filter.outputs.footprint }}
      release-builds: ${{ steps.filter.outputs.release-builds }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the merge commit's first parent is the base commit
          persist-credentials: false

      - name: Which heavy jobs this change needs
        id: filter
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          heavy=(eval-retrieval eval-retrieval-int8 eval-recall footprint release-builds android)
          run_all() {
            for job in "${heavy[@]}"; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run_all "Full run ($GITHUB_EVENT_NAME): every job runs."
            exit 0
          fi
          if [[ "$HEAD_REF" == release/* ]]; then
            run_all "Release pull request ($HEAD_REF): every job runs."
            exit 0
          fi
          # The diff is right only against GitHub's test merge: two parents,
          # the base commit and this pull request's head. Anything else (a
          # checkout of another ref, a merge queue, one parent) runs everything.
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ "${#parents[@]}" -ne 3 ] || [ "${parents[2]}" != "$PR_HEAD_SHA" ]; then
            run_all "HEAD is not the test merge of this pull request's head ${PR_HEAD_SHA} (parents: ${parents[*]:1}): every job runs."
            exit 0
          fi
          base=${parents[1]}
          # --no-renames: a renamed file counts at its old path and its new one.
          diff=$(git diff --name-only --no-renames "$base" HEAD)
          if [ -z "$diff" ]; then
            run_all "No changed files against the base commit $base: every job runs."
            exit 0
          fi
          mapfile -t files <<< "$diff"
          echo "### Heavy jobs for this change" >> "$GITHUB_STEP_SUMMARY"
          # File names are the pull request's own text: no line of them is
          # read as a workflow command while they are printed.
          token=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::${token}"
          echo "${#files[@]} files changed against the base commit $base:"
          printf '  %s\n' "${files[@]}"

          # Documentation and lint configuration (Workflow lint always runs):
          # no heavy job reads them. Markdown is skipped only at the root and
          # under docs/: the eval corpora hold Markdown documents.
          docs='^(docs/|marketing/|[^/]+\.md$|LICENSE$|NOTICE$|\.gitignore$|\.github/zizmor\.yml$)'
          # The release workflows and their scripts: the release builds read
          # them, the evals and the footprint build do not.
          release_files='^(scripts/release/|\.github/release-notes\.md$|\.github/workflows/(release|tag-release|prepare-release)\.yml$)'
          # The evals build shodh-eval and shodh-rag only, never the app or
          # the sandbox probe. shodh-rag's tests read a few app files
          # (harness/events.rs includes app/src/features/agent/events.ts, and
          # harness/session.rs compares its recorded sessions with
          # app/tests/fixtures/transcripts/recorded-*.json), and the E5 model
          # tests build those tests. None of them builds the phone app
          # (mobile/, its own Cargo workspace).
          eval_skip="$docs|$release_files|^(app/|mobile/|crates/sandbox-probe/|scripts/measure-footprint\.ps1$)"
          eval_keep='^(app/src/features/agent/events\.ts|app/tests/fixtures/transcripts(/recorded-[^/]+\.json)?)$'
          # The footprint build is the app (app/, shodh-rag, shodh-ontology);
          # it never builds shodh-eval, the sandbox probe or the phone app.
          footprint_skip="$docs|$release_files|^(mobile/|crates/shodh-eval/|crates/sandbox-probe/)"
          # The installers are the app too, bundled with release.yml and its
          # scripts, so only documentation and the crates the app never
          # builds are skippable.
          release_skip="$docs|^(mobile/|crates/shodh-eval/|crates/sandbox-probe/|scripts/measure-footprint\.ps1$)"
          # The phone app (android job) is mobile/, its own Cargo workspace
          # and lockfile, with the crates it uses (shodh-link), the toolchain
          # and this workflow. From the desktop it reads only its colour
          # tokens (app/src/index.css, parsed by app/src/lib/contrast.ts), its
          # sections' names and order (app/src/lib/viewTabs.ts, the phone's
          # menu) and the shared components (app/src/shared/). The rest of
          # the desktop, its crates, its Cargo workspace files and its CI
          # helpers are skippable.
          android_skip="$docs|$release_files|^(app/|crates/shodh-rag/|crates/shodh-eval/|crates/shodh-ontology/|crates/sandbox-probe/|Cargo\.toml$|Cargo\.lock$|scripts/ci/|scripts/measure-footprint\.ps1$|\.github/actions/onnxruntime/)"
          android_keep='^(app/src/shared/|app/src/index\.css$|app/src/lib/contrast\.ts$|app/src/lib/viewTabs\.ts$)'

          decide() {
            local job=$1 skip=$2 keep=$3 f
            for f in "${files[@]}"; do
              if { [ -n "$keep" ] && [[ $f =~ $keep ]]; } || ! [[ $f =~ $skip ]]; then
                echo "$job=true" >> "$GITHUB_OUTPUT"
                echo "- $job runs: $f can change what it checks" | tee -a "$GITHUB_STEP_SUMMARY"
                return
              fi
            done
            echo "$job=false" >> "$GITHUB_OUTPUT"
            echo "- $job is skipped: none of the ${#files[@]} changed files can change what it checks" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          decide eval-retrieval "$eval_skip" "$eval_keep"
          # The same retrieval pipeline on the same three corpora, so the same
          # files.
          decide eval-retrieval-int8 "$eval_skip" "$eval_keep"
          # Recall's scorecard builds shodh-eval and shodh-rag only, like the evals.
          decide eval-recall "$eval_skip" "$eval_keep"
          decide footprint "$footprint_skip" ''
          decide release-builds "$release_skip" ''
          decide android "$android_skip" "$android_keep"
          echo "::${token}::"

  # actionlint (workflow syntax, expressions, shellcheck on run scripts) and
  # zizmor (workflow security: injection, credentials, permissions, pinning).
  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # The release and CI scripts' own tests, and the version check every
  # release relies on: every file that carries the app version agrees.
  scripts:
    name: Release and CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Release script tests
        run: node --test scripts/release/test/*.test.mjs

      - name: ONNX Runtime script tests
        working-directory: scripts/ci
        run: python -m unittest -v test_ort_archive

      - name: The app version agrees in every file
        run: node scripts/release/versions.mjs check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check + Clippy
    runs-on: windows-latest
    timeout-minutes: 30  # slowest 16 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # --locked: a Cargo.lock that does not match the manifests fails here.
      - name: Cargo check
        run: cargo check --workspace --locked

      # Blocking at the strongest level the workspace passes today. The harness and
      # audit modules additionally deny every warning via #![cfg_attr(clippy, deny(warnings))].
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      # ort-sys found the archive the step above provided and downloaded
      # nothing itself (else scripts/ci/ort_archive.py resolved another one).
      - name: ONNX Runtime came from the cache
        shell: bash
        run: python -I scripts/ci/ort_archive.py verify

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 60  # slowest 31 minutes with library tests only
    env:
      # Line tables only (file:line in backtraces): smaller debug builds and
      # caches. Dev and test profiles only; the release profile is untouched.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # The command runner's tests (harness/run_command) launch this probe
      # through Code mode's process limits; they fail when it is not built.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      # Every test target of every workspace crate: library and binary unit
      # tests, each tests/*.rs integration test (log_privacy.rs runs in its
      # own binary, so its capturing subscriber is global before anything
      # logs), and the examples are built. A crate or test file added later
      # is included without editing this job.
      # Model-backed tests stay ignored here: SHODH_TEST_MODELS is not set in CI.
      - name: Tests (workspace, all targets)
        run: cargo test --workspace --all-targets

      - name: Doc tests (workspace)
        run: cargo test --workspace --doc

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # macOS reads scans with PP-OCRv6 only (Windows OCR is not built there), so
  # the parser and the OCR engine have macOS-only paths. This builds shodh-rag
  # on macOS and runs its OCR unit tests: one crate, debug, cached; the app and
  # the other crates are built on Windows only.
  macos:
    name: macOS build + OCR tests (shodh-rag)
    runs-on: macos-latest
    timeout-minutes: 35  # slowest 21 minutes
    env:
      # The workflow's -crt-static is for the Windows MSVC builds.
      RUSTFLAGS: ""
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # LanceDB's protobuf definitions are compiled at build time.
      - name: Install Protobuf compiler
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: OCR tests (shodh-rag)
        run: cargo test --package shodh-rag --lib ocr

      # What runs the models on a Mac: the performance-core count (sysctl),
      # the provider selection and the Core ML provider in the linked ONNX
      # Runtime; the same test binary as the OCR tests.
      - name: Compute tests (shodh-rag)
        run: cargo test --package shodh-rag --lib 'compute::'

      # Code mode's command runner on macOS (process group, CPU limit, memory
      # watchdog, the sweep of every process a command started), through the
      # probe; the same test binary as the OCR tests.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      - name: Command runner tests (shodh-rag)
        run: cargo test --package shodh-rag --lib run_command

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # Retrieval quality on the committed synthetic corpus (no LLM): a fresh
  # index, every question searched, gated against the committed baseline.
  # Retrieval is deterministic, so any drop fails; latency is reported only.
  # The default search model (fp16) is gated on every runner against
  # baseline.json. The opt-in faster model (int8) is gated against
  # baseline-int8.json too, but only on runners whose int8 kernels are exact
  # (VNNI); elsewhere that step warns on the run and in its summary that it
  # was skipped and why. Apple silicon has its own job (eval-retrieval-int8).
  # The scanned corpus (image-only pages) is gated the same way, read with the
  # PP-OCRv6 model installed with the search models; it fails when the OCR
  # model is missing rather than measuring another engine.
  eval-retrieval:
    name: Retrieval eval
    needs: changes
    if: needs.changes.outputs.eval-retrieval == 'true'
    runs-on: windows-latest
    # Slowest 48 minutes for the fp16 evals (three corpora, AMD Zen 3 runners,
    # PR #125). The int8 evals on VNNI runners measured 40 minutes on their own
    # (run 41818552734), so a VNNI runner runs both in about 88 minutes; the
    # limit leaves a quarter on top of that.
    timeout-minutes: 110
    env:
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # Same cache as the footprint job: the pinned search and OCR models,
      # keyed by the file that pins them.
      # Only master saves the models (a pull request would add a copy that no
      # other ref can read).
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      # The tests that need the real E5 model: the cutoff at which an answer counts as
      # using a memory, measured on the labelled fixture
      # (crates/shodh-rag/src/user_memory/fixtures/memory_use.json), the embedder
      # itself (batching, int8's batch independence, the CPU path and its calibration,
      # GPU agreement where a GPU runs), and a small library switched fp16 -> int8 ->
      # fp16 with searches checked throughout. SHODH_TEST_MODELS turns the
      # model-backed tests on at compile time; the name filters run these only.
      # One at a time: each loads the model (a gigabyte or more in memory).
      - name: Model tests (E5)
        env:
          SHODH_TEST_MODELS: ${{ runner.temp }}/shodh-models
        run: >
          cargo test --package shodh-rag --lib --
          the_use_cutoff_separates_used_from_unused_memories_with_e5
          embeddings::e5::
          the_real_model_switches_fp16_to_int8_and_back_and_search_stays_right
          --nocapture
          --test-threads=1

      - name: Retrieval eval
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/synthetic/corpus
          --dataset crates/shodh-eval/data/synthetic/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out

      - name: Compare with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/synthetic/baseline.json
          --report eval-out/retrieval-report.json

      - name: Scanned retrieval eval (PP-OCRv6)
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/scanned/corpus
          --dataset crates/shodh-eval/data/scanned/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --ocr ppocr
          --out eval-out-scanned

      - name: Compare scanned with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/scanned/baseline.json
          --report eval-out-scanned/retrieval-report.json

      - name: Paper retrieval eval
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/papers/corpus
          --dataset crates/shodh-eval/data/papers/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out-papers

      - name: Compare papers with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/papers/baseline.json
          --report eval-out-papers/retrieval-report.json

      # The opt-in faster model, gated against its own baselines, on runners
      # where it runs exactly (the app offers it nowhere else).
      - name: Opt-in int8 retrieval evals (exact int8 kernels only)
        shell: pwsh
        run: |
          $kernels = cargo run -q --package shodh-eval -- int8-kernels
          if ($LASTEXITCODE -ne 0) { throw 'shodh-eval int8-kernels failed' }
          if ($kernels -ne 'exact') {
            # Loud: a skipped gate is shown on the run, not only in the log.
            $why = "The x86 int8 gate (baseline-int8.json) was skipped: this runner's int8 kernels are '$kernels', not VNNI; the app does not offer the faster model on such processors."
            Write-Host "::warning title=int8 gate skipped::$why"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### int8 gate skipped`n`n$why"
            exit 0
          }
          foreach ($corpus in 'synthetic', 'scanned', 'papers') {
            $ocr = if ($corpus -eq 'scanned') { @('--ocr', 'ppocr') } else { @() }
            cargo run --package shodh-eval -- retrieval `
              --corpus "crates/shodh-eval/data/$corpus/corpus" `
              --dataset "crates/shodh-eval/data/$corpus/dataset.json" `
              --models "${{ runner.temp }}/shodh-models" `
              @ocr --search search_model=int8 --out "eval-out-int8-$corpus"
            if ($LASTEXITCODE -ne 0) { throw "The int8 $corpus eval failed" }
            cargo run --package shodh-eval -- compare `
              --baseline "crates/shodh-eval/data/$corpus/baseline-int8.json" `
              --report "eval-out-int8-$corpus/retrieval-report.json"
            if ($LASTEXITCODE -ne 0) { throw "int8 $corpus regressed against baseline-int8.json" }
          }

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-retrieval
          path: |
            eval-out/retrieval-report.json
            eval-out/retrieval-summary.md
            eval-out-scanned/retrieval-report.json
            eval-out-scanned/retrieval-summary.md
            eval-out-papers/retrieval-report.json
            eval-out-papers/retrieval-summary.md
            eval-out-int8-*/retrieval-report.json
            eval-out-int8-*/retrieval-summary.md
          if-no-files-found: ignore

  # Recall's scorecard: synthetic coding sessions in the formats Claude Code and
  # Codex write (crates/shodh-eval/src/recall.rs), indexed with the real models and
  # asked the frozen questions in crates/shodh-eval/data/recall/questions.json. It
  # fails below the target: the right session in the top 5 for at least 90% of the
  # questions, and the 95th percentile of search time under 2 s. Its own job: the
  # retrieval eval's runners already use most of their time limit. The same files
  # decide whether it runs as the retrieval eval's (eval_skip).
  eval-recall:
    name: Recall scorecard
    needs: changes
    if: needs.changes.outputs.eval-recall == 'true'
    runs-on: windows-latest
    # Slowest 23 minutes (PR #161: the build, indexing 29 transcripts, 56 searches and
    # the reranker-off diagnosis); the limit leaves room for a cold cache.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Recall scorecard
        run: >
          cargo run --package shodh-eval -- recall
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out-recall

      - name: Recall scorecard in the job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path eval-out-recall/recall-summary.md) {
            Get-Content eval-out-recall/recall-summary.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-recall
          path: |
            eval-out-recall/recall-report.json
            eval-out-recall/recall-summary.md
          if-no-files-found: ignore

  # The opt-in faster model (int8) on Apple silicon, the one ARM class the app
  # offers it on: Apple's dot-product int8 kernels are exact by design, and
  # this job is what measures them. It gates the three corpora against
  # baseline-int8-arm64.json (Apple-silicon int8 rounds differently from x86
  # VNNI, so each class has its own numbers). It fails, never skips, when the
  # runner's int8 kernels are not exact: a gate that cannot run is a failure.
  # macos-26 (arm64, Apple M1 virtual), the image macos-latest names and the
  # macOS job and the release dmg build run on. GitHub retired macos-14, which
  # cancelled this job before it started on every run.
  # When GitHub retires macos-26 this job is cancelled again, and CI gate
  # fails on every pull request that needs it, every master push and every
  # release until the label moves to the next arm64 image (re-measure there
  # and compare with baseline-int8-arm64.json, as this move did). The
  # retirement is announced in actions/runner-images.
  eval-retrieval-int8:
    name: Retrieval eval (int8, Apple silicon)
    needs: changes
    if: needs.changes.outputs.eval-retrieval-int8 == 'true'
    runs-on: macos-26
    # Slowest 71 minutes on a cold cache (run 41984775872: build and probe 15,
    # model tests 8, the three int8 evals 47; run 41966083623 took 63); the
    # limit leaves a quarter on top.
    timeout-minutes: 90
    env:
      # The workflow's -crt-static is for the Windows MSVC builds.
      RUSTFLAGS: ""
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # LanceDB's protobuf definitions are compiled at build time.
      - name: Install Protobuf compiler
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: The int8 kernels here are exact
        run: |
          kernels="$(cargo run -q --package shodh-eval -- int8-kernels)"
          echo "int8 kernels: $kernels ($(uname -m), $(sysctl -n machdep.cpu.brand_string))"
          if [ "$kernels" != "exact" ]; then
            echo "::error::This runner's int8 kernels are '$kernels', so the Apple-silicon int8 gate cannot run."
            exit 1
          fi

      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-macos-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-macos-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      # The embedder on Apple silicon (int8's batch independence, the CPU path)
      # and a small library switched fp16 -> int8 -> fp16 with searches checked.
      - name: Model tests (E5)
        env:
          SHODH_TEST_MODELS: ${{ runner.temp }}/shodh-models
        run: >
          cargo test --package shodh-rag --lib --
          embeddings::e5::
          the_real_model_switches_fp16_to_int8_and_back_and_search_stays_right
          --nocapture
          --test-threads=1

      - name: int8 retrieval evals against the Apple-silicon baselines
        run: |
          for corpus in synthetic scanned papers; do
            ocr=()
            if [ "$corpus" = scanned ]; then ocr=(--ocr ppocr); fi
            cargo run --package shodh-eval -- retrieval \
              --corpus "crates/shodh-eval/data/$corpus/corpus" \
              --dataset "crates/shodh-eval/data/$corpus/dataset.json" \
              --models "${{ runner.temp }}/shodh-models" \
              "${ocr[@]}" --search search_model=int8 --out "eval-out-int8-$corpus"
            cat "eval-out-int8-$corpus/retrieval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
          failed=0
          for corpus in synthetic scanned papers; do
            if ! cargo run --package shodh-eval -- compare \
              --baseline "crates/shodh-eval/data/$corpus/baseline-int8-arm64.json" \
              --report "eval-out-int8-$corpus/retrieval-report.json"; then
              echo "::error::int8 $corpus regressed against baseline-int8-arm64.json"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-retrieval-int8-arm64
          path: |
            eval-out-int8-*/retrieval-report.json
            eval-out-int8-*/retrieval-summary.md
          if-no-files-found: ignore

  frontend:
    name: Frontend Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # npm's download cache is restored here and saved by master only (as the
      # Rust caches are): setup-node's own cache would save a copy from every
      # pull request into the 10 GB cache pool, which no other ref can read.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate the npm cache
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Save the npm cache
        if: github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test

  # Memory and startup budget of the release build, on a fresh profile with
  # the search models installed (they load only when used).
  # scripts/measure-footprint.ps1 documents what is measured. Budgets are the
  # measured release build plus at most 10%, and never above the targets
  # (350 MB, 1.5 s). The idle figure assumes WebView2 runs with --disable-gpu
  # (profile.rs); with GPU compositing it would be about 115 MB more.
  #
  # Idle memory: five runs of 60 s, the median is gated at 163 MB. 148.6 MB
  # (median of 3 runs on a developer machine; 143-149 MB on this runner).
  #
  # Time to a usable window depends on the runner: the same build measured
  # 0.52-0.64 s on one windows-latest machine and 0.87-1.07 s on another, so a
  # raw number is not gated. The build is launched interleaved with other
  # builds on the same runner (each on its own profile, order rotating every
  # pair, one warm-up pair discarded, PAIRS measured pairs). Each build's time
  # is the mean of its fastest 20% of launches: runner noise only adds time,
  # and on the noisier runners it moves the median of 9 launches by more than
  # a 10% regression (measured on this PR's runs; medians are still logged).
  # PAIRS is 45, not 15: across 64 earlier runs of this job, 15 pairs put the
  # fastest-20% estimate within about 10% of its run's true ratio only 99% of
  # the time, while the anchor ceiling sits 8.5% above the typical 0.866 s, so
  # about one run in 64 failed on noise alone (0.950 s on fcfbd33, 0.876 s on
  # its unchanged re-run). The estimate's spread falls about as pairs^-0.46,
  # so 45 pairs cuts it to about 6%, inside the margin, for about 2.5 more
  # minutes (4.4 s a pair).
  # Gated on ratios of those times:
  #   - Against the base commit's build (the merge commit's first parent), at
  #     most MAX_WINDOW_RATIO, set from master-against-itself runs.
  #   - Against a fixed anchor build (FOOTPRINT_ANCHOR_SHA, the code the 0.94 s
  #     budget was set from: 0.857 s, median of 5 runs on windows-latest):
  #     this build / anchor x 0.857 s must stay within 0.94 s. The anchor does
  #     not move with master, so a series of small regressions that each pass
  #     the ratio still reaches this ceiling.
  # The base commit's build comes from master's push run (artifact
  # footprint-exe-<sha>, uploaded right after its build), else it is built
  # here (about 35 more minutes; a pull request saves no cache). The anchor is a
  # 90-day artifact of a master run (footprint-anchor-<sha>), else the cache,
  # else built. Push runs on master upload their build, seed the anchor
  # artifact, and record their time against the anchor.
  #
  # The release build's Rust cache is shared with release.yml's Windows
  # installer build (same shared-key, flags and profile): master saves it
  # here, and installer builds on pull requests and tags restore it instead
  # of compiling every dependency from scratch.
  footprint:
    name: Footprint budget
    needs: changes
    if: needs.changes.outputs.footprint == 'true'
    runs-on: windows-latest
    # Slowest 94 minutes (the base commit's build missing). With both the base
    # commit's build and the anchor missing, three release builds of about
    # 35-40 minutes each plus 10 minutes of measuring.
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read  # find and download the base commit's build
    env:
      FOOTPRINT_ANCHOR_SHA: 76bf22ff6df23370b58b6af5d0684f0529efd2ab
      FOOTPRINT_ANCHOR_SECONDS: "0.857"
      PAIRS: "45"
      MAX_WINDOW_RATIO: "1.06"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the merge commit's first parent is the base commit
          persist-credentials: false

      - name: Resolve the builds to compare
        id: builds
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $reference = git rev-parse HEAD^1
            if ($LASTEXITCODE -ne 0) { throw 'The merge commit has no first parent' }
            Write-Host "Reference: base commit $reference"
            "reference=$reference" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Anchor: $env:FOOTPRINT_ANCHOR_SHA ($env:FOOTPRINT_ANCHOR_SECONDS s when the budget was set)"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release-x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # npm's download cache, saved by master only (as in the frontend job).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate the npm cache
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Save the npm cache
        if: github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Build release app
        run: cargo build --release -p shodh-rag-app --features tauri/custom-protocol

      # Before the base commit's or the anchor's build below, which may use
      # another ort-sys and so another archive.
      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      # Copied out of target/: building the base commit or the anchor below
      # writes the same path.
      - name: Stage this build
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/footprint-bin/pr"
          Copy-Item -LiteralPath target/release/shodh-rag-app.exe -Destination $dir

      - name: Upload this build for PRs based on it
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-exe-${{ github.sha }}
          path: ${{ runner.temp }}/footprint-bin/pr/shodh-rag-app.exe
          retention-days: 30
          if-no-files-found: error

      - name: Download the base commit's build
        id: reference-artifact
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.builds.outputs.reference }}
        run: |
          $name = "footprint-exe-$env:REFERENCE"
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $runId) {
            Write-Host "No artifact $name (master's push run has not uploaded it yet, or it expired): building it here (a pull request saves no cache: master saves caches only)."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir "$env:RUNNER_TEMP/footprint-bin/reference"
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          Write-Host "Base commit's build: artifact $name from run $runId"
          "found=true" >> $env:GITHUB_OUTPUT

      # The anchor never changes, so it is kept as a 90-day artifact of a
      # master run (the repository's maximum), found the same way as the base
      # commit's build. A cache entry is evicted with the rest of the 10 GB
      # pool. Only runs of this repository's master branch are trusted (a fork's
      # branch can be named master too), as above.
      - name: Download the anchor build
        id: anchor-artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "footprint-anchor-$env:FOOTPRINT_ANCHOR_SHA"
          $found = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0] | if . then "\(.workflow_run.id) \(.created_at)" else empty end'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $found) {
            Write-Host "No artifact $name (not uploaded yet, or it expired): trying the cache, else building it here."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $runId, $createdAt = $found -split ' '
          $dir = "$env:RUNNER_TEMP/footprint-bin/anchor"
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          $exe = Join-Path $dir 'shodh-rag-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "$name has no shodh-rag-app.exe" }
          $ageDays = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($createdAt, [cultureinfo]::InvariantCulture)).TotalDays
          Write-Host ("Anchor build: artifact $name from run $runId, {0:N0} days old, SHA-256 {1}" -f $ageDays, (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)
          "found=true" >> $env:GITHUB_OUTPUT
          # A master run uploads the same file again before the artifact expires.
          $stale = if ($ageDays -gt 45) { 'true' } else { 'false' }
          "stale=$stale" >> $env:GITHUB_OUTPUT

      - name: Restore the anchor build
        id: anchor-cache
        if: steps.anchor-artifact.outputs.found != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Same toolchain, flags and target directory as this build (registry
      # dependencies are reused), with each commit's own lockfile and frontend.
      - name: Build what was not stored
        id: build-missing
        shell: pwsh
        env:
          REFERENCE: ${{ steps.builds.outputs.reference }}
          REFERENCE_ARTIFACT: ${{ steps.reference-artifact.outputs.found }}
          ANCHOR_ARTIFACT: ${{ steps.anchor-artifact.outputs.found }}
          ANCHOR_CACHE: ${{ steps.anchor-cache.outputs.cache-hit }}
        run: |
          $missing = New-Object System.Collections.ArrayList
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:REFERENCE_ARTIFACT -ne 'true') {
            [void]$missing.Add(@{ Label = 'reference'; Sha = $env:REFERENCE })
          }
          if ($env:ANCHOR_ARTIFACT -ne 'true' -and $env:ANCHOR_CACHE -ne 'true') {
            [void]$missing.Add(@{ Label = 'anchor'; Sha = $env:FOOTPRINT_ANCHOR_SHA })
          }
          if ($missing.Count -eq 0) { Write-Host 'Every build to compare was downloaded or restored.'; exit 0 }
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          foreach ($build in $missing) {
            Write-Host "No stored $($build.Label) build of $($build.Sha): building it here."
            $src = Join-Path $env:RUNNER_TEMP "footprint-src-$($build.Label)"
            git fetch --no-tags --depth=1 origin $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Fetching $($build.Sha) failed" }
            git worktree add --detach $src $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Checking out $($build.Sha) failed" }
            Push-Location (Join-Path $src 'app')
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $($build.Sha)" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend build failed for $($build.Sha)" }
            Set-Location $src
            cargo build --release -p shodh-rag-app --features tauri/custom-protocol --target-dir $target
            if ($LASTEXITCODE -ne 0) { throw "Release build failed for $($build.Sha)" }
            Pop-Location
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "footprint-bin/$($build.Label)")
            Copy-Item -LiteralPath (Join-Path $target 'release/shodh-rag-app.exe') -Destination $dir
            git worktree remove --force $src
            "$($build.Label)=true" >> $env:GITHUB_OUTPUT
          }

      # Master only (the artifact is the durable copy; a PR's copy would only
      # fill the pool).
      - name: Cache the anchor build
        if: steps.build-missing.outputs.anchor == 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Master seeds the artifact (from the build or the cache) when it is
      # missing, and renews it before it expires.
      - name: Upload the anchor build
        if: github.event_name == 'push' && (steps.anchor-artifact.outputs.found != 'true' || steps.anchor-artifact.outputs.stale == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}
          path: ${{ runner.temp }}/footprint-bin/anchor/shodh-rag-app.exe
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      # The pinned search and OCR models (installed by the app itself, SHA-256
      # checked), cached by the file that pins them.
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Measure footprint
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP/footprint-bin"
          $opts = @{
            Exe                 = "$bin/pr/shodh-rag-app.exe"
            ModelPath           = "$env:RUNNER_TEMP/shodh-models"
            InstallModels       = $true
            Scenario            = 'idle'
            Runs                = 5
            IdleSeconds         = 60
            BudgetIdleMB        = 163
            AnchorExe           = "$bin/anchor/shodh-rag-app.exe"
            AnchorWindowSeconds = [double]$env:FOOTPRINT_ANCHOR_SECONDS
            BudgetWindowSeconds = 0.94
            Pairs               = [int]$env:PAIRS
            WarmupPairs         = 1
            Output              = 'footprint.json'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $opts.ReferenceExe = "$bin/reference/shodh-rag-app.exe"
            $opts.MaxWindowRatio = [double]$env:MAX_WINDOW_RATIO
          }
          ./scripts/measure-footprint.ps1 @opts

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Upload footprint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint
          path: footprint.json
          if-no-files-found: ignore

  # Shodh for Android (mobile/): its frontend tests, a debug APK for phones
  # (arm64) and the emulator (x86_64), then the APK launched on an Android
  # emulator as a tester opens it (the_app_reaches_its_pair_screen): installed,
  # started, its pair screen reached, and still running 15 s later with no
  # crash. Ready is the app's own logcat line (link.rs), written once the
  # window has shown its first screen, the link's key was read from the
  # Android Keystore-backed storage (made on this first start) and the link's
  # iroh endpoint is bound. The Android project (gen/android) is generated
  # here by the pinned Tauri CLI from mobile/src-tauri; it is not committed.
  android:
    name: Android build + launch
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # This job has no run history yet. 90 minutes bounds a cold run: no Rust
    # or Gradle cache, two Android targets, the Gradle build and an emulator
    # boot of up to 10 minutes.
    timeout-minutes: 90
    env:
      # The workflow's -crt-static is for the desktop's builds; Android links
      # its C library dynamically whatever the flag says.
      RUSTFLAGS: ""
      # r27c, the NDK's long-term-support release.
      NDK_VERSION: 27.2.12479018
      # Test and dev builds are their own app (com.shodhrag.mobile.dev,
      # mobile/src-tauri/tauri.dev.conf.json), so they never replace the
      # real one (com.shodhrag.mobile) on a phone.
      ANDROID_PACKAGE: com.shodhrag.mobile.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the phone app's dependencies
        working-directory: mobile
        run: npm ci

      # The invoke shim (invoke_shim_forwards_and_routes_events), asking and
      # the streamed answer, every screen's loading, empty, connected and
      # asleep states, the theme following the phone, the menu, the colour
      # tokens and their contrast, and the UI rules (12px text, 44px
      # controls, only transform and opacity animated).
      - name: Phone app tests
        working-directory: mobile
        run: npm test

      - name: Type check (phone app)
        working-directory: mobile
        run: npx tsc --noEmit

      # The scripted computer of the screenshots (src/lib/demo.ts) is in a
      # debug build only: vite.config.ts sets __SHODH_DEMO__ from the Tauri
      # CLI's TAURI_ENV_DEBUG. Both builds are checked, so the release check
      # is not vacuous.
      - name: The screenshots' scripted computer is not in a release build
        working-directory: mobile
        run: |
          set -euo pipefail
          marker='The sample computer has no'
          TAURI_ENV_DEBUG=true npx vite build --outDir "$RUNNER_TEMP/js-debug" --logLevel warn
          grep -rqF "$marker" "$RUNNER_TEMP/js-debug" || { echo "::error::The debug build lacks the scripted computer"; exit 1; }
          TAURI_ENV_DEBUG=false npx vite build --outDir "$RUNNER_TEMP/js-release" --logLevel warn
          if grep -rlF "$marker" "$RUNNER_TEMP/js-release"; then
            echo "::error::A release build contains the scripted computer"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}
          log-accepted-android-sdk-licenses: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: mobile/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format (phone app)
        run: cargo fmt --manifest-path mobile/src-tauri/Cargo.toml --check

      - name: Generate the Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ndk" || { echo "::error::NDK $NDK_VERSION is not at $ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # Test builds are com.shodhrag.mobile.dev (tauri.dev.conf.json),
          # never the real app's identifier.
          NDK_HOME="$ndk" npx tauri android init --ci --config src-tauri/tauri.dev.conf.json
          # The elephant launcher icons (tauri icon, from the desktop's
          # logo) replace the template's.
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # Every warning fails, Clippy's included: the phone app's own code is
      # new. --locked: a Cargo.lock that does not match the manifests fails.
      - name: Clippy (phone app, Android)
        run: |
          set -euo pipefail
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android24-clang"
          cargo clippy --manifest-path mobile/src-tauri/Cargo.toml --target x86_64-linux-android --locked -- -D warnings

      - name: Build the debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          start=$(date +%s)
          npx tauri android build --debug --apk --target aarch64 --target x86_64 --config src-tauri/tauri.dev.conf.json
          seconds=$(( $(date +%s) - start ))
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          apk="$PWD/${apks[0]}"
          # Both libraries are in it: arm64 for phones, x86_64 for the emulator.
          abis=$(unzip -l "$apk" | grep -o 'lib/[^/]*/libshodh_mobile_lib\.so' | sort -u | tr '\n' ' ' || true)
          for abi in arm64-v8a x86_64; do
            if ! grep -q "lib/$abi/" <<< "$abis"; then
              echo "::error::The APK has no $abi library (it has: $abis)"
              exit 1
            fi
          done
          echo "APK=$apk" >> "$GITHUB_ENV"
          {
            echo '### Android'
            echo
            echo "- debug APK \`$(basename "$apk")\`: $(du -h "$apk" | cut -f1), built in ${seconds} s; libraries: ${abis}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shodh-android-debug-apk
          path: ${{ env.APK }}
          retention-days: 14
          if-no-files-found: error

      # The emulator runs with KVM: without it an x86_64 image boots in tens
      # of minutes, if at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The launch test runs inside the emulator action (the emulator stops
      # when the action ends), which runs each line of `script` on its own,
      # so the test is one bash program, in LAUNCH_TEST.
      - name: Launch it on an emulator (the_app_reaches_its_pair_screen)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          LAUNCH_TEST: |
            now_ms() { date +%s%3N; }
            evidence="$RUNNER_TEMP/android-launch"
            mkdir -p "$evidence"
            # Whatever happens, the whole log and the crash buffer are kept.
            trap 'adb logcat -d -v threadtime > "$evidence/logcat.txt" 2>&1 || true; adb logcat -d -b crash -v threadtime > "$evidence/crash.txt" 2>&1 || true' EXIT
            # Room for the whole launch, and nothing from before it: the
            # ready line read below is this launch's.
            adb logcat -G 16M
            adb logcat -b main,system,crash -c

            start=$(now_ms)
            adb install -r "$APK" | tr -d '\r' | tee "$evidence/install.txt"
            installed_ms=$(( $(now_ms) - start ))
            component=$(adb shell cmd package resolve-activity --brief "$ANDROID_PACKAGE" | tr -d '\r' | tail -n 1)
            case "$component" in
              "$ANDROID_PACKAGE"/*) ;;
              *) echo "::error::$ANDROID_PACKAGE has no launcher activity: $component"; exit 1 ;;
            esac

            # What the screen shows, for people to look at (not a gate): a
            # recording of the launch and screenshots in both themes.
            screens="$RUNNER_TEMP/android-screens"
            mkdir -p "$screens"
            adb shell screenrecord --time-limit 30 /sdcard/shodh-launch.mp4 &
            recorder=$!

            start=$(now_ms)
            adb shell am start -W -n "$component" | tr -d '\r' | tee "$evidence/am-start.txt"
            # 120 s: the slowest first start a tester would wait through
            # without calling the app hung. On this emulator the first start
            # includes the WebView's first start with software rendering, the
            # Keystore generating the link's key and the app's first run.
            # logcat ends at the first ready (or not-ready) line.
            status=0
            timeout 120 adb logcat -v brief -s Shodh:I -e 'Shodh (not )?ready' -m 1 > "$evidence/ready.txt" || status=$?
            ready_ms=$(( $(now_ms) - start ))
            if [ "$status" -eq 124 ]; then
              echo "::error::Shodh did not report ready within 120 s of its launch"
              exit 1
            elif [ "$status" -ne 0 ]; then
              echo "::error::Reading logcat failed (status $status) while waiting for ready"
              exit 1
            fi
            # logcat writes a "beginning of main" header first: the line is the app's.
            ready_line=$(tr -d '\r' < "$evidence/ready.txt" | grep -m 1 'Shodh' || true)
            echo "$ready_line"
            if ! grep -q 'Shodh ready: the pair screen is shown' <<< "$ready_line"; then
              echo "::error::Shodh did not reach its pair screen: $ready_line"
              exit 1
            fi
            pid=$(adb shell pidof "$ANDROID_PACKAGE" | tr -d '\r')
            if [ -z "$pid" ]; then
              echo "::error::Shodh reported ready but is not running"
              exit 1
            fi

            # 15 s after ready covers the start's background work: the link's
            # first relay connection and address lookup, which run after the
            # endpoint is bound. A crash of the app ends the wait at once.
            status=0
            timeout 15 adb logcat -b crash -v threadtime -e "$ANDROID_PACKAGE" -m 1 > "$evidence/crash-wait.txt" || status=$?
            if [ "$status" -ne 124 ]; then
              if [ -s "$evidence/crash-wait.txt" ]; then
                echo "::error::Shodh crashed within 15 s of being ready"
                cat "$evidence/crash-wait.txt"
              else
                echo "::error::Reading the crash log ended (status $status) before the 15 s were up"
              fi
              exit 1
            fi
            now_pid=$(adb shell pidof "$ANDROID_PACKAGE" | tr -d '\r')
            if [ "$now_pid" != "$pid" ]; then
              echo "::error::Shodh is not the process it was at ready (pid $pid, now ${now_pid:-none})"
              exit 1
            fi
            errors=$(adb logcat -d -s Shodh:E | tr -d '\r')
            if grep -q 'Shodh panicked' <<< "$errors"; then
              echo "::error::Shodh panicked"
              echo "$errors"
              exit 1
            fi
            echo "Still running 15 s after ready, no crash"

            wait "$recorder" || true
            adb pull /sdcard/shodh-launch.mp4 "$screens/launch.mp4" || true

            # Every main screen in light and dark, for review, on a phone-sized
            # screen. A debug build opens at the screen named by the system
            # property debug.shodh.screen (start_screen in link.rs; a release
            # build never reads it). With no computer paired, the plain names
            # show each screen as it is while not connected; demo-* screens
            # show a scripted computer (src/lib/demo.ts, debug builds only) so
            # the connected screens can be seen. Each launch waits for the
            # app's own ready line, which names the theme shown: it must be
            # the phone's (cmd uimode night), or the job fails after taking
            # every picture. The 3 s pause only lets the data and the springs
            # settle for the picture, and decides no result.
            adb shell wm size 1080x2400
            adb shell wm density 420
            themes_wrong=()
            shoot() {
              local name=$1 property=$2 screen=$3 theme=$4 status=0 line
              adb shell am force-stop "$ANDROID_PACKAGE"
              if [ "$theme" = dark ]; then adb shell cmd uimode night yes; else adb shell cmd uimode night no; fi
              # Quoted for the phone's shell, so an empty value (the app's own start) is one.
              adb shell setprop debug.shodh.screen "'$property'"
              adb logcat -b main -c
              adb shell am start -W -n "$component" > /dev/null
              # 60 s: a warm start of this app on this emulator is a few seconds.
              line=$(timeout 60 adb logcat -v brief -s Shodh:I -e 'Shodh (not )?ready' -m 1 | tr -d '\r' | grep -m 1 'Shodh') || status=$?
              if [ "$status" -ne 0 ] || ! grep -q "Shodh ready: the $screen screen is shown" <<< "$line"; then
                echo "::error::$name ($theme) did not report ready: ${line:-nothing within 60 s}"
                adb exec-out screencap -p > "$screens/$name-$theme-not-ready.png" || true
                return 1
              fi
              if ! grep -q "in the $theme theme" <<< "$line"; then
                themes_wrong+=("$name with the phone $theme: $line")
              fi
              sleep 3
              adb exec-out screencap -p > "$screens/$name-$theme.png"
            }
            # name, property, the screen the ready line names
            shots=(
              "pair::pair"
              "home:home:home"
              "conversations:conversations:conversations"
              "library:library:library"
              "approvals:approvals:approvals"
              "menu:menu:menu"
              "settings:settings:settings"
              "tasks:tasks:tasks"
              "connected-home:demo-home:demo-home"
              "connected-answer:demo-answer:demo-answer"
              "connected-conversations:demo-conversations:demo-conversations"
              "connected-library:demo-library:demo-library"
              "connected-reader:demo-reader:demo-reader"
              "connected-approvals:demo-approvals:demo-approvals"
              "connected-approval-sheet:demo-sheet:demo-sheet"
              "connected-workspaces:demo-workspaces:demo-workspaces"
              "connected-menu:demo-menu:demo-menu"
            )
            for theme in light dark; do
              for shot in "${shots[@]}"; do
                IFS=: read -r name property screen <<< "$shot"
                shoot "$name" "$property" "$screen" "$theme"
              done
            done
            adb shell setprop debug.shodh.screen "''"
            adb shell cmd uimode night no
            echo "- ${#shots[@]} screens, each in light and dark, are in the \`android-screens\` artifact" >> "$GITHUB_STEP_SUMMARY"
            if [ "${#themes_wrong[@]}" -gt 0 ]; then
              printf '::error::The app did not follow the phone'"'"'s theme: %s\n' "${themes_wrong[@]}"
              exit 1
            fi
            {
              echo
              echo "Launch on the emulator (API 34, x86_64, first run):"
              echo
              echo "- installed in ${installed_ms} ms"
              echo "- pair screen ready ${ready_ms} ms after launch: \`${ready_line}\`"
              echo "- still running 15 s after ready (pid ${pid}), no crash in logcat"
            } >> "$GITHUB_STEP_SUMMARY"
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # The action's default, kept explicit: a cold boot of this image
          # without a snapshot takes a few minutes on these runners, and a
          # boot not done in 10 minutes is a broken image or runner.
          emulator-boot-timeout: 600
          script: bash -euo pipefail -c "$LAUNCH_TEST"

      - name: Upload the screenshots and launch recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-screens
          path: ${{ runner.temp }}/android-screens
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the emulator's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-launch-evidence
          path: ${{ runner.temp }}/android-launch
          retention-days: 14
          if-no-files-found: warn

  # The installers (release.yml, build-only: no tag, so nothing is published
  # and the update bundles are signed with a throwaway key): the Windows NSIS
  # installer and the Apple Silicon dmg are built and checked as a release
  # checks them, and the latest published release is verified read-only.
  # release.yml declares the permissions its publishing jobs need (contents:
  # write, checks: read) and a caller must grant at least those for the call
  # to load; in this build-only call those jobs are skipped and the jobs that
  # run ask for contents: read.
  release-builds:
    name: Release builds
    needs: changes
    if: needs.changes.outputs.release-builds == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      checks: read

  # The one check that stands for every job above: branch protection requires
  # it (with the fast checks). It is named CI gate, a name no workflow here
  # has used before, so no older check run on a commit can stand in for it.
  # It always runs, so it is never skipped (a skipped required check would
  # count as passed). A job counts when it passed, or when it was skipped and
  # the Changes job's output of the same name is 'false' (not needed by this
  # change). Anything else fails it: a failure, a cancellation (how a retired
  # runner label once went unnoticed), a timeout, or a skip the Changes job
  # did not ask for (Changes itself failed). The release builds count as one
  # job (a reusable workflow's result is a failure when any of its jobs
  # failed). scripts/release/test/ci-gate.test.mjs checks that needs lists
  # every other job.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, lint, scripts, fmt, check, test, macos, eval-retrieval, eval-retrieval-int8, eval-recall, frontend, footprint, release-builds, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          rows=$(jq -r '. as $n | to_entries[] | [.key, .value.result, ($n.changes.outputs[.key] // "none")] | @tsv' <<< "$NEEDS")
          count=$(jq 'length' <<< "$NEEDS")
          if [ "$count" -lt 2 ] || [ -z "$rows" ]; then
            echo "::error::No job results to check ($count)"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r job result needed; do
            if [ "$result" = success ]; then
              echo "$job: passed"
            elif [ "$result" = skipped ] && [ "$needed" = false ]; then
              echo "$job: skipped, not needed by this change"
            else
              echo "::error::$job: $result (needed by this change: $needed)"
              failed=1
            fi
          done <<< "$rows"
          exit "$failed"
