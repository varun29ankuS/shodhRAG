name: CI

on:
  pull_request:
    branches: [master]
    # ready_for_review: release PRs are opened as drafts by the Prepare
    # release workflow, whose token cannot start workflows; marking one ready
    # starts CI as the person who did.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Runs on master
# are never cancelled (group per commit): pull requests download the footprint
# build a master run uploads, and master is the only ref that saves caches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=-crt-static"
  # llama.cpp (llama-cpp-sys-2) builds its HTTP client with HTTPS when CMake
  # finds OpenSSL. Shodh only loads local GGUF files and never uses llama.cpp's
  # downloader, so it is built without it: the result no longer depends on
  # which OpenSSL a runner has (OpenSSL 4 on macos-26 images from 20261012 does
  # not compile with the vendored cpp-httplib). llama-cpp-sys-2 passes CMAKE_*
  # variables to CMake, and llama.cpp's find_package(OpenSSL) is optional.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "TRUE"

# Every job has a timeout of about 1.5x its slowest successful run in the
# last 60 runs (noted per job), so a hung step fails in minutes, not after
# GitHub's 6-hour limit.
#
# Every job that builds ort-sys (check, clippy, test, build) first runs
# .github/actions/onnxruntime: the ONNX Runtime archive ort-sys links comes
# from the Actions cache (saved by master), checked against ort-sys's SHA-256,
# so builds no longer download it from cdn.pyke.io (where it stalled for 30
# minutes at a time).

jobs:
  # actionlint (workflow syntax, expressions, shellcheck on run scripts) and
  # zizmor (workflow security: injection, credentials, permissions, pinning).
  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # The release and CI scripts' own tests, and the version check every
  # release relies on: all six files that carry the app version agree.
  scripts:
    name: Release and CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Release script tests
        run: node --test scripts/release/test/*.test.mjs

      - name: ONNX Runtime script tests
        working-directory: scripts/ci
        run: python -m unittest -v test_ort_archive

      - name: The app version agrees in every file
        run: node scripts/release/versions.mjs check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check + Clippy
    runs-on: windows-latest
    timeout-minutes: 30  # slowest 16 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # --locked: a Cargo.lock that does not match the manifests fails here.
      - name: Cargo check
        run: cargo check --workspace --locked

      # Blocking at the strongest level the workspace passes today. The harness and
      # audit modules additionally deny every warning via #![cfg_attr(clippy, deny(warnings))].
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      # ort-sys found the archive the step above provided and downloaded
      # nothing itself (else scripts/ci/ort_archive.py resolved another one).
      - name: ONNX Runtime came from the cache
        shell: bash
        run: python -I scripts/ci/ort_archive.py verify

  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 60  # slowest 31 minutes with library tests only
    env:
      # Line tables only (file:line in backtraces): smaller debug builds and
      # caches. Dev and test profiles only; the release profile is untouched.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # The command runner's tests (harness/run_command) launch this probe
      # through Code mode's process limits; they fail when it is not built.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      # Every test target of every workspace crate: library and binary unit
      # tests, each tests/*.rs integration test (log_privacy.rs runs in its
      # own binary, so its capturing subscriber is global before anything
      # logs), and the examples are built. A crate or test file added later
      # is included without editing this job.
      # Model-backed tests stay ignored here: SHODH_TEST_MODELS is not set in CI.
      - name: Tests (workspace, all targets)
        run: cargo test --workspace --all-targets

      - name: Doc tests (workspace)
        run: cargo test --workspace --doc

  # macOS reads scans with PP-OCRv6 only (Windows OCR is not built there), so
  # the parser and the OCR engine have macOS-only paths. This builds shodh-rag
  # on macOS and runs its OCR unit tests: one crate, debug, cached; the app and
  # the other crates are built on Windows only.
  macos:
    name: macOS build + OCR tests (shodh-rag)
    runs-on: macos-latest
    timeout-minutes: 35  # slowest 21 minutes
    env:
      # The workflow's -crt-static is for the Windows MSVC builds.
      RUSTFLAGS: ""
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # LanceDB's protobuf definitions are compiled at build time.
      - name: Install Protobuf compiler
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: OCR tests (shodh-rag)
        run: cargo test --package shodh-rag --lib ocr

      # Code mode's command runner on macOS (process group, CPU limit, memory
      # watchdog, the sweep of every process a command started), through the
      # probe; the same test binary as the OCR tests.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      - name: Command runner tests (shodh-rag)
        run: cargo test --package shodh-rag --lib run_command

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # Retrieval quality on the committed synthetic corpus (no LLM): a fresh
  # index, every question searched, gated against the committed baseline.
  # Retrieval is deterministic, so any drop fails; latency is reported only.
  # The scanned corpus (image-only pages) is gated the same way, read with the
  # PP-OCRv6 model installed with the search models; it fails when the OCR
  # model is missing rather than measuring another engine.
  eval-retrieval:
    name: Retrieval eval
    runs-on: windows-latest
    timeout-minutes: 35  # slowest 21 minutes
    env:
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # Same cache as the footprint job: the pinned search and OCR models,
      # keyed by the file that pins them.
      # Only master saves the models (a pull request would add a copy that no
      # other ref can read).
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      # The cutoff at which an answer counts as using a memory, measured on the labelled
      # fixture (crates/shodh-rag/src/user_memory/fixtures/memory_use.json) with the real
      # E5 model. SHODH_TEST_MODELS turns the model-backed tests on at compile time; the
      # name filter runs this one only.
      - name: Memory use cutoff (E5)
        env:
          SHODH_TEST_MODELS: ${{ runner.temp }}/shodh-models
        run: cargo test --package shodh-rag --lib the_use_cutoff_separates_used_from_unused_memories_with_e5 -- --nocapture

      - name: Retrieval eval
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/synthetic/corpus
          --dataset crates/shodh-eval/data/synthetic/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out

      - name: Compare with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/synthetic/baseline.json
          --report eval-out/retrieval-report.json

      - name: Scanned retrieval eval (PP-OCRv6)
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/scanned/corpus
          --dataset crates/shodh-eval/data/scanned/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --ocr ppocr
          --out eval-out-scanned

      - name: Compare scanned with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/scanned/baseline.json
          --report eval-out-scanned/retrieval-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-retrieval
          path: |
            eval-out/retrieval-report.json
            eval-out/retrieval-summary.md
            eval-out-scanned/retrieval-report.json
            eval-out-scanned/retrieval-summary.md
          if-no-files-found: ignore

  frontend:
    name: Frontend Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test

  # Memory and startup budget of the release build, on a fresh profile with
  # the search models installed (they load only when used).
  # scripts/measure-footprint.ps1 documents what is measured. Budgets are the
  # measured release build plus at most 10%, and never above the targets
  # (350 MB, 1.5 s). The idle figure assumes WebView2 runs with --disable-gpu
  # (profile.rs); with GPU compositing it would be about 115 MB more.
  #
  # Idle memory: five runs of 60 s, the median is gated at 163 MB. 148.6 MB
  # (median of 3 runs on a developer machine; 143-149 MB on this runner).
  #
  # Time to a usable window depends on the runner: the same build measured
  # 0.52-0.64 s on one windows-latest machine and 0.87-1.07 s on another, so a
  # raw number is not gated. The build is launched interleaved with other
  # builds on the same runner (each on its own profile, order rotating every
  # pair, one warm-up pair discarded, PAIRS measured pairs). Each build's time
  # is the mean of its fastest 20% of launches: runner noise only adds time,
  # and on the noisier runners it moves the median of 9 launches by more than
  # a 10% regression (measured on this PR's runs; medians are still logged).
  # PAIRS is 45, not 15: across 64 earlier runs of this job, 15 pairs put the
  # fastest-20% estimate within about 10% of its run's true ratio only 99% of
  # the time, while the anchor ceiling sits 8.5% above the typical 0.866 s, so
  # about one run in 64 failed on noise alone (0.950 s on fcfbd33, 0.876 s on
  # its unchanged re-run). The estimate's spread falls about as pairs^-0.46,
  # so 45 pairs cuts it to about 6%, inside the margin, for about 2.5 more
  # minutes (4.4 s a pair).
  # Gated on ratios of those times:
  #   - Against the base commit's build (the merge commit's first parent), at
  #     most MAX_WINDOW_RATIO, set from master-against-itself runs.
  #   - Against a fixed anchor build (FOOTPRINT_ANCHOR_SHA, the code the 0.94 s
  #     budget was set from: 0.857 s, median of 5 runs on windows-latest):
  #     this build / anchor x 0.857 s must stay within 0.94 s. The anchor does
  #     not move with master, so a series of small regressions that each pass
  #     the ratio still reaches this ceiling.
  # The base commit's build comes from master's push run (artifact
  # footprint-exe-<sha>, uploaded right after its build), else from this PR's
  # cache, else it is built here (about 35 more minutes). The anchor is a
  # 90-day artifact of a master run (footprint-anchor-<sha>), else the cache,
  # else built. Push runs on master upload their build, seed the anchor
  # artifact, and record their time against the anchor.
  #
  # The release build's Rust cache is shared with release.yml's Windows
  # installer build (same shared-key, flags and profile): master saves it
  # here, and installer builds on pull requests and tags restore it instead
  # of compiling every dependency from scratch.
  footprint:
    name: Footprint budget
    runs-on: windows-latest
    # Slowest 94 minutes (the base commit's build missing). With both the base
    # commit's build and the anchor missing, three release builds of about
    # 35-40 minutes each plus 10 minutes of measuring.
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read  # find and download the base commit's build
    env:
      FOOTPRINT_ANCHOR_SHA: 76bf22ff6df23370b58b6af5d0684f0529efd2ab
      FOOTPRINT_ANCHOR_SECONDS: "0.857"
      PAIRS: "45"
      MAX_WINDOW_RATIO: "1.06"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the merge commit's first parent is the base commit
          persist-credentials: false

      - name: Resolve the builds to compare
        id: builds
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $reference = git rev-parse HEAD^1
            if ($LASTEXITCODE -ne 0) { throw 'The merge commit has no first parent' }
            Write-Host "Reference: base commit $reference"
            "reference=$reference" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Anchor: $env:FOOTPRINT_ANCHOR_SHA ($env:FOOTPRINT_ANCHOR_SECONDS s when the budget was set)"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release-x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build release app
        run: cargo build --release -p shodh-rag-app --features tauri/custom-protocol

      # Copied out of target/: building the base commit or the anchor below
      # writes the same path.
      - name: Stage this build
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/footprint-bin/pr"
          Copy-Item -LiteralPath target/release/shodh-rag-app.exe -Destination $dir

      - name: Upload this build for PRs based on it
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-exe-${{ github.sha }}
          path: ${{ runner.temp }}/footprint-bin/pr/shodh-rag-app.exe
          retention-days: 30
          if-no-files-found: error

      - name: Download the base commit's build
        id: reference-artifact
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.builds.outputs.reference }}
        run: |
          $name = "footprint-exe-$env:REFERENCE"
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $runId) {
            Write-Host "No artifact $name (master's push run has not uploaded it yet, or it expired): trying this PR's cache, else building it here."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir "$env:RUNNER_TEMP/footprint-bin/reference"
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          Write-Host "Base commit's build: artifact $name from run $runId"
          "found=true" >> $env:GITHUB_OUTPUT

      - name: Restore the base commit's build
        id: reference-cache
        if: github.event_name == 'pull_request' && steps.reference-artifact.outputs.found != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/reference
          key: footprint-reference-${{ steps.builds.outputs.reference }}

      # The anchor never changes, so it is kept as a 90-day artifact of a
      # master run (the repository's maximum), found the same way as the base
      # commit's build. A cache entry is evicted with the rest of the 10 GB
      # pool. Only runs of this repository's master branch are trusted (a fork's
      # branch can be named master too), as above.
      - name: Download the anchor build
        id: anchor-artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "footprint-anchor-$env:FOOTPRINT_ANCHOR_SHA"
          $found = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0] | if . then "\(.workflow_run.id) \(.created_at)" else empty end'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $found) {
            Write-Host "No artifact $name (not uploaded yet, or it expired): trying the cache, else building it here."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $runId, $createdAt = $found -split ' '
          $dir = "$env:RUNNER_TEMP/footprint-bin/anchor"
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          $exe = Join-Path $dir 'shodh-rag-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "$name has no shodh-rag-app.exe" }
          $ageDays = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($createdAt, [cultureinfo]::InvariantCulture)).TotalDays
          Write-Host ("Anchor build: artifact $name from run $runId, {0:N0} days old, SHA-256 {1}" -f $ageDays, (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)
          "found=true" >> $env:GITHUB_OUTPUT
          # A master run uploads the same file again before the artifact expires.
          $stale = if ($ageDays -gt 45) { 'true' } else { 'false' }
          "stale=$stale" >> $env:GITHUB_OUTPUT

      - name: Restore the anchor build
        id: anchor-cache
        if: steps.anchor-artifact.outputs.found != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Same toolchain, flags and target directory as this build (registry
      # dependencies are reused), with each commit's own lockfile and frontend.
      - name: Build what was not stored
        id: build-missing
        shell: pwsh
        env:
          REFERENCE: ${{ steps.builds.outputs.reference }}
          REFERENCE_ARTIFACT: ${{ steps.reference-artifact.outputs.found }}
          REFERENCE_CACHE: ${{ steps.reference-cache.outputs.cache-hit }}
          ANCHOR_ARTIFACT: ${{ steps.anchor-artifact.outputs.found }}
          ANCHOR_CACHE: ${{ steps.anchor-cache.outputs.cache-hit }}
        run: |
          $missing = New-Object System.Collections.ArrayList
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:REFERENCE_ARTIFACT -ne 'true' -and $env:REFERENCE_CACHE -ne 'true') {
            [void]$missing.Add(@{ Label = 'reference'; Sha = $env:REFERENCE })
          }
          if ($env:ANCHOR_ARTIFACT -ne 'true' -and $env:ANCHOR_CACHE -ne 'true') {
            [void]$missing.Add(@{ Label = 'anchor'; Sha = $env:FOOTPRINT_ANCHOR_SHA })
          }
          if ($missing.Count -eq 0) { Write-Host 'Every build to compare was downloaded or restored.'; exit 0 }
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          foreach ($build in $missing) {
            Write-Host "No stored $($build.Label) build of $($build.Sha): building it here."
            $src = Join-Path $env:RUNNER_TEMP "footprint-src-$($build.Label)"
            git fetch --no-tags --depth=1 origin $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Fetching $($build.Sha) failed" }
            git worktree add --detach $src $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Checking out $($build.Sha) failed" }
            Push-Location (Join-Path $src 'app')
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $($build.Sha)" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend build failed for $($build.Sha)" }
            Set-Location $src
            cargo build --release -p shodh-rag-app --features tauri/custom-protocol --target-dir $target
            if ($LASTEXITCODE -ne 0) { throw "Release build failed for $($build.Sha)" }
            Pop-Location
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "footprint-bin/$($build.Label)")
            Copy-Item -LiteralPath (Join-Path $target 'release/shodh-rag-app.exe') -Destination $dir
            git worktree remove --force $src
            "$($build.Label)=true" >> $env:GITHUB_OUTPUT
          }

      - name: Cache the base commit's build
        if: steps.build-missing.outputs.reference == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/reference
          key: footprint-reference-${{ steps.builds.outputs.reference }}

      # Master only (the artifact is the durable copy; a PR's copy would only
      # fill the pool).
      - name: Cache the anchor build
        if: steps.build-missing.outputs.anchor == 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Master seeds the artifact (from the build or the cache) when it is
      # missing, and renews it before it expires.
      - name: Upload the anchor build
        if: github.event_name == 'push' && (steps.anchor-artifact.outputs.found != 'true' || steps.anchor-artifact.outputs.stale == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}
          path: ${{ runner.temp }}/footprint-bin/anchor/shodh-rag-app.exe
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      # The pinned search and OCR models (installed by the app itself, SHA-256
      # checked), cached by the file that pins them.
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Measure footprint
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP/footprint-bin"
          $opts = @{
            Exe                 = "$bin/pr/shodh-rag-app.exe"
            ModelPath           = "$env:RUNNER_TEMP/shodh-models"
            InstallModels       = $true
            Scenario            = 'idle'
            Runs                = 5
            IdleSeconds         = 60
            BudgetIdleMB        = 163
            AnchorExe           = "$bin/anchor/shodh-rag-app.exe"
            AnchorWindowSeconds = [double]$env:FOOTPRINT_ANCHOR_SECONDS
            BudgetWindowSeconds = 0.94
            Pairs               = [int]$env:PAIRS
            WarmupPairs         = 1
            Output              = 'footprint.json'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $opts.ReferenceExe = "$bin/reference/shodh-rag-app.exe"
            $opts.MaxWindowRatio = [double]$env:MAX_WINDOW_RATIO
          }
          ./scripts/measure-footprint.ps1 @opts

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Upload footprint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint
          path: footprint.json
          if-no-files-found: ignore
