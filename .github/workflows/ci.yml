name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=-crt-static"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check + Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Protobuf compiler
        run: choco install protoc -y

      - name: Cargo check
        run: cargo check --workspace

      # Blocking at the strongest level the workspace passes today. The harness and
      # audit modules additionally deny every warning via #![cfg_attr(clippy, deny(warnings))].
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

  test:
    name: Tests
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2

      - name: Install Protobuf compiler
        run: choco install protoc -y

      # Model-backed tests stay ignored here: SHODH_TEST_MODELS is not set in CI.
      - name: Library tests (shodh-rag)
        run: cargo test --package shodh-rag --lib

      - name: Library tests (shodh-rag-app)
        run: cargo test --package shodh-rag-app --lib

  frontend:
    name: Frontend Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test
