name: CI

on:
  pull_request:
    branches: [master]
    # ready_for_review: release PRs are opened as drafts by the Prepare
    # release workflow, whose token cannot start workflows; marking one ready
    # starts CI as the person who did.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  # nightly.yml: every job, unfiltered, on master once a day.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Runs on master
# are never cancelled (group per commit): pull requests download the footprint
# build a master run uploads, and master is the only ref that saves caches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=-crt-static"
  # llama.cpp (llama-cpp-sys-2) builds its HTTP client with HTTPS when CMake
  # finds OpenSSL. Shodh only loads local GGUF files and never uses llama.cpp's
  # downloader, so it is built without it: the result no longer depends on
  # which OpenSSL a runner has (OpenSSL 4 on macos-26 images from 20261012 does
  # not compile with the vendored cpp-httplib). llama-cpp-sys-2 passes CMAKE_*
  # variables to CMake, and llama.cpp's find_package(OpenSSL) is optional.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "TRUE"

# Every job has a timeout of about 1.5x its slowest successful run in the
# last 60 runs (noted per job), so a hung step fails in minutes, not after
# GitHub's 6-hour limit.
#
# Every job that builds ort-sys (check, clippy, test, build) first runs
# .github/actions/onnxruntime: the ONNX Runtime archive ort-sys links comes
# from the Actions cache (saved by master), checked against ort-sys's SHA-256,
# so builds no longer download it from cdn.pyke.io (where it stalled for 30
# minutes at a time).
#
# Heavy jobs run on a pull request only when it changes a file they read:
# Library store (0.0.10 upgrade, ANN recall), Retrieval eval, Retrieval eval
# (int8, Apple silicon), Footprint budget, the release builds (release.yml:
# the Windows and macOS installers, built and verified as a release would
# be, without publishing) and the Android phone
# app (its debug APK, launched on an emulator) are skipped when every
# changed file is in their known-irrelevant set (the Changes job; an unknown
# or new path always runs them). Every other job runs on every pull request.
# Pushes to master, release pull requests (release/*) and the nightly run
# (nightly.yml) run every job: master's push run is what a release is gated on
# (scripts/release/ci-gate.mjs requires every job to have passed), uploads the
# footprint build that pull requests compare against, and saves the caches
# pull requests restore. CI gate is the one check that stands for all of
# them: it fails when any job failed, was cancelled or was skipped without
# the Changes job saying it was not needed. One job is not required, by CI
# gate or by a release: the Android screenshot tour (android-tour, where the
# reason is).

jobs:
  # Which heavy jobs this change needs: each output is 'true' or 'false' and
  # is named after the job it decides (CI gate reads it under that name).
  # Each heavy job reads (or builds) more than its own directory, so the sets
  # are of files it can skip, never of files it needs: shodh-rag's modules
  # reach each other (rag_engine uses harness, research and workspaces, which
  # use embeddings, processing and rag_engine), so any change under
  # crates/shodh-rag runs every heavy job. scripts/release/test/ci-gate.test.mjs
  # resolves every include_*! and CARGO_MANIFEST_DIR path in the crates
  # against these sets, so a file a build or test reads is never skippable.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eval-retrieval: ${{ steps.filter.outputs.eval-retrieval }}
      eval-retrieval-int8: ${{ steps.filter.outputs.eval-retrieval-int8 }}
      eval-recall: ${{ steps.filter.outputs.eval-recall }}
      footprint: ${{ steps.filter.outputs.footprint }}
      release-builds: ${{ steps.filter.outputs.release-builds }}
      android: ${{ steps.filter.outputs.android }}
      upgrade: ${{ steps.filter.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the merge commit's first parent is the base commit
          persist-credentials: false

      - name: Which heavy jobs this change needs
        id: filter
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          heavy=(eval-retrieval eval-retrieval-int8 eval-recall footprint release-builds android upgrade)
          run_all() {
            for job in "${heavy[@]}"; do echo "$job=true" >> "$GITHUB_OUTPUT"; done
            echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run_all "Full run ($GITHUB_EVENT_NAME): every job runs."
            exit 0
          fi
          if [[ "$HEAD_REF" == release/* ]]; then
            run_all "Release pull request ($HEAD_REF): every job runs."
            exit 0
          fi
          # The diff is right only against GitHub's test merge: two parents,
          # the base commit and this pull request's head. Anything else (a
          # checkout of another ref, a merge queue, one parent) runs everything.
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if [ "${#parents[@]}" -ne 3 ] || [ "${parents[2]}" != "$PR_HEAD_SHA" ]; then
            run_all "HEAD is not the test merge of this pull request's head ${PR_HEAD_SHA} (parents: ${parents[*]:1}): every job runs."
            exit 0
          fi
          base=${parents[1]}
          # --no-renames: a renamed file counts at its old path and its new one.
          diff=$(git diff --name-only --no-renames "$base" HEAD)
          if [ -z "$diff" ]; then
            run_all "No changed files against the base commit $base: every job runs."
            exit 0
          fi
          mapfile -t files <<< "$diff"
          echo "### Heavy jobs for this change" >> "$GITHUB_STEP_SUMMARY"
          # File names are the pull request's own text: no line of them is
          # read as a workflow command while they are printed.
          token=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::${token}"
          echo "${#files[@]} files changed against the base commit $base:"
          printf '  %s\n' "${files[@]}"

          # Documentation and lint configuration (Workflow lint always runs):
          # no heavy job reads them. Markdown is skipped only at the root and
          # under docs/: the eval corpora hold Markdown documents.
          docs='^(docs/|marketing/|[^/]+\.md$|LICENSE$|NOTICE$|\.gitignore$|\.github/zizmor\.yml$)'
          # The release workflows and their scripts: the release builds read
          # them, the evals and the footprint build do not.
          release_files='^(scripts/release/|\.github/release-notes\.md$|\.github/workflows/(release|tag-release|prepare-release)\.yml$)'
          # The evals build shodh-eval and shodh-rag only, never the app or
          # the sandbox probe. shodh-rag's tests read a few app files
          # (harness/events.rs includes app/src/features/agent/events.ts, and
          # harness/session.rs compares its recorded sessions with
          # app/tests/fixtures/transcripts/recorded-*.json), and the E5 model
          # tests build those tests. None of them builds the phone app
          # (mobile/, its own Cargo workspace).
          eval_skip="$docs|$release_files|^(app/|mobile/|crates/sandbox-probe/|scripts/measure-footprint\.ps1$)"
          eval_keep='^(app/src/features/agent/events\.ts|app/tests/fixtures/transcripts(/recorded-[^/]+\.json)?)$'
          # The footprint build is the app (app/, shodh-rag, shodh-ontology);
          # it never builds shodh-eval, the sandbox probe or the phone app.
          footprint_skip="$docs|$release_files|^(mobile/|crates/shodh-eval/|crates/sandbox-probe/)"
          # The installers are the app too, bundled with release.yml and its
          # scripts, and so is the phone app's release APK (release.yml's
          # android job builds mobile/ as a release, which the android job
          # below never does), so only documentation and the crates neither
          # app builds are skippable.
          release_skip="$docs|^(crates/shodh-eval/|crates/sandbox-probe/|scripts/measure-footprint\.ps1$)"
          # The phone app (android job) is mobile/, its own Cargo workspace
          # and lockfile, with the crates it uses (shodh-link), the toolchain
          # and this workflow. From the desktop it reads only its colour
          # tokens (app/src/index.css, parsed by app/src/lib/contrast.ts), its
          # sections' names and order (app/src/lib/viewTabs.ts, the phone's
          # menu) and the shared components (app/src/shared/). The rest of
          # the desktop, its crates, its Cargo workspace files and its CI
          # helpers are skippable. Of the release scripts it runs one, the
          # debug-only code check (scripts/release/android.mjs).
          android_skip="$docs|$release_files|^(app/|crates/shodh-rag/|crates/shodh-eval/|crates/shodh-ontology/|crates/sandbox-probe/|Cargo\.toml$|Cargo\.lock$|scripts/ci/|scripts/measure-footprint\.ps1$|\.github/actions/onnxruntime/)"
          android_keep='^(app/src/shared/|app/src/index\.css$|app/src/lib/contrast\.ts$|app/src/lib/viewTabs\.ts$|scripts/release/android\.mjs$)'

          decide() {
            local job=$1 skip=$2 keep=$3 f
            for f in "${files[@]}"; do
              if { [ -n "$keep" ] && [[ $f =~ $keep ]]; } || ! [[ $f =~ $skip ]]; then
                echo "$job=true" >> "$GITHUB_OUTPUT"
                echo "- $job runs: $f can change what it checks" | tee -a "$GITHUB_STEP_SUMMARY"
                return
              fi
            done
            echo "$job=false" >> "$GITHUB_OUTPUT"
            echo "- $job is skipped: none of the ${#files[@]} changed files can change what it checks" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          decide eval-retrieval "$eval_skip" "$eval_keep"
          # The same retrieval pipeline on the same three corpora, so the same
          # files.
          decide eval-retrieval-int8 "$eval_skip" "$eval_keep"
          # Recall's scorecard builds shodh-eval and shodh-rag only, like the evals.
          decide eval-recall "$eval_skip" "$eval_keep"
          decide footprint "$footprint_skip" ''
          decide release-builds "$release_skip" ''
          decide android "$android_skip" "$android_keep"
          # The upgrade test builds shodh-rag only (0.0.10's from its tag, which
          # no change here alters, and this tree's library tests), like the evals.
          decide upgrade "$eval_skip" "$eval_keep"
          echo "::${token}::"

  # actionlint (workflow syntax, expressions, shellcheck on run scripts) and
  # zizmor (workflow security: injection, credentials, permissions, pinning).
  lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  # The release and CI scripts' own tests, and the version check every
  # release relies on: every file that carries the app version agrees.
  scripts:
    name: Release and CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Release script tests
        run: node --test scripts/release/test/*.test.mjs

      - name: ONNX Runtime script tests
        working-directory: scripts/ci
        run: python -m unittest -v test_ort_archive

      - name: The app version agrees in every file
        run: node scripts/release/versions.mjs check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Check + Clippy
    runs-on: windows-latest
    timeout-minutes: 30  # slowest 16 minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # --locked: a Cargo.lock that does not match the manifests fails here.
      - name: Cargo check
        run: cargo check --workspace --locked

      # Blocking at the strongest level the workspace passes today. The harness and
      # audit modules additionally deny every warning via #![cfg_attr(clippy, deny(warnings))].
      - name: Clippy
        run: cargo clippy --workspace -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      # ort-sys found the archive the step above provided and downloaded
      # nothing itself (else scripts/ci/ort_archive.py resolved another one).
      - name: ONNX Runtime came from the cache
        shell: bash
        run: python -I scripts/ci/ort_archive.py verify

  # The workspace's tests but the app's, which run in parallel in App tests
  # (with the doc tests), and the agent runtime test. Master pushes of
  # 2026-11-14 and 15 took 23 to 54 minutes here with everything in one job
  # (the test step 38 minutes at most, the agent runtime test 6, the doc tests
  # 5, the cache save 2): too close to the limit (#162). Without the app's
  # tests, the doc tests and the agent runtime test, run 43740319109 took 34.
  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 60  # slowest 54 minutes before the app's tests and doc tests moved out
    env:
      # Line tables only (file:line in backtraces): smaller debug builds and
      # caches. Dev and test profiles only; the release profile is untouched.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # The command runner's tests (harness/run_command) launch this probe
      # through Code mode's process limits; they fail when it is not built.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      # Every test target of every workspace crate but the app (App tests):
      # library and binary unit tests, each tests/*.rs integration test
      # (log_privacy.rs runs in its own binary, so its capturing subscriber is
      # global before anything logs), and the examples are built. A crate or
      # test file added later is included without editing this job.
      # Model-backed tests stay ignored here: SHODH_TEST_MODELS is not set in CI.
      - name: Tests (workspace but the app, all targets)
        run: cargo test --workspace --exclude shodh-rag-app --all-targets

      # Against the real agent runtime, on Windows, where a command line is
      # limited to 32,767 characters: a system prompt longer than that must
      # reach omp whole through its file (it failed with os error 206 while
      # it was passed on the command line). The test downloads the pinned omp
      # release as setup does, checked against the pinned SHA-256. It runs
      # here, where shodh-rag's test build already exists: in App tests it
      # built shodh-rag's tests again and took 21 minutes, against 6 here
      # (run 43740319109).
      - name: Long system prompt against the agent runtime
        run: cargo test --package shodh-rag --lib -- --ignored --exact harness::omp_live_tests::a_system_prompt_longer_than_a_command_line_reaches_omp_whole

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # The app's tests and the workspace's doc tests, in parallel with Tests,
  # which runs every other crate's.
  test-app:
    name: App tests and doc tests
    runs-on: windows-latest
    # Run 43740319109, with no cache for this new job yet: the app's tests
    # took 30 minutes, their own build included; the doc tests were 5 inside
    # Tests.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      - name: App tests (all targets)
        run: cargo test --package shodh-rag-app --all-targets

      - name: Doc tests (workspace)
        run: cargo test --workspace --doc

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # macOS reads scans with PP-OCRv6 only (Windows OCR is not built there), so
  # the parser and the OCR engine have macOS-only paths. This builds shodh-rag
  # on macOS and runs its OCR unit tests: one crate, debug, cached; the app and
  # the other crates are built on Windows only.
  macos:
    name: macOS build + OCR tests (shodh-rag)
    runs-on: macos-latest
    timeout-minutes: 35  # slowest 21 minutes
    env:
      # The workflow's -crt-static is for the Windows MSVC builds.
      RUSTFLAGS: ""
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # LanceDB's protobuf definitions are compiled at build time.
      - name: Install Protobuf compiler
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: OCR tests (shodh-rag)
        run: cargo test --package shodh-rag --lib ocr

      # What runs the models on a Mac: the performance-core count (sysctl),
      # the provider selection and the Core ML provider in the linked ONNX
      # Runtime; the same test binary as the OCR tests.
      - name: Compute tests (shodh-rag)
        run: cargo test --package shodh-rag --lib 'compute::'

      # Code mode's command runner on macOS (process group, CPU limit, memory
      # watchdog, the sweep of every process a command started), through the
      # probe; the same test binary as the OCR tests.
      - name: Build the sandbox probe
        run: cargo build --package sandbox-probe

      - name: Command runner tests (shodh-rag)
        run: cargo test --package shodh-rag --lib run_command

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # A library written by 0.0.10 opens in this build with its documents,
  # chunks, searches and memories (crates/shodh-rag/src/upgrade_tests.rs). The
  # upgrade is one-way (lancedb 0.26 to 0.41 rewrites the table files; the
  # chunker raise reads files again), so it is checked against a library
  # 0.0.10 itself wrote: the v0.0.10 tag is checked out beside this tree,
  # crates/shodh-rag/upgrade/v0_0_10/ is copied into it as an example and run
  # with that tree's own lockfile (lancedb 0.26, Lance 2.0, Tantivy 0.22),
  # and the test opens what it wrote. Nothing in this tree builds the writer
  # (Cargo never looks in upgrade/), so 0.0.10's dependencies stay out of
  # Cargo.lock. Windows, where the other Rust tests run; the Changes job
  # decides it like the evals (it builds shodh-rag only).
  #
  # The same test build then measures the recall of the chunk table's
  # approximate vector search past 20,000 rows against an exact scan
  # (crates/shodh-rag/src/storage/ann_recall_tests.rs), kept out of Tests for
  # its time. Lance's index code is optimised for both test runs here
  # (--config): unoptimised, building the index over 24,000 vectors takes
  # minutes. Both runs pass the same flags, so they share one build.
  upgrade:
    name: Library store (0.0.10 upgrade, ANN recall)
    needs: changes
    if: needs.changes.outputs.upgrade == 'true'
    runs-on: windows-latest
    # No run history yet: two debug builds of shodh-rag (0.0.10's example and
    # this tree's library tests), each about as long as the Tests job's build
    # of it on a cold cache.
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # 0.0.10 as released: its own workspace, lockfile and toolchain file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v0.0.10
          path: upgrade-from/v0.0.10
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml (0.0.10's is the same)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: |
            . -> target
            upgrade-from/v0.0.10 -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      # 0.0.10 links the same ort-sys (2.0.0-rc.13, the same features), so the
      # archive this provides serves both builds, and the check at the end
      # fails if either downloaded its own.
      - uses: ./.github/actions/onnxruntime

      # The fixture folder is the same for the writer and the test: the
      # library's sources are absolute paths under it.
      - name: Write a library with 0.0.10
        shell: bash
        env:
          SHODH_UPGRADE_FIXTURE: ${{ runner.temp }}/upgrade-0.0.10
        run: |
          set -euo pipefail
          example=upgrade-from/v0.0.10/crates/shodh-rag/examples/write_upgrade_library
          mkdir -p "$example"
          cp crates/shodh-rag/upgrade/v0_0_10/write_library.rs "$example/main.rs"
          cp crates/shodh-rag/upgrade/v0_0_10/library.rs "$example/library.rs"
          cd upgrade-from/v0.0.10 || exit 1
          cargo run --locked --package shodh-rag --example write_upgrade_library -- "$SHODH_UPGRADE_FIXTURE"

      - name: This build opens it
        env:
          SHODH_UPGRADE_FIXTURE: ${{ runner.temp }}/upgrade-0.0.10
        run: >
          cargo test --locked
          --config profile.dev.package.lance-index.opt-level=3
          --config profile.dev.package.lance-linalg.opt-level=3
          --package shodh-rag --lib -- --ignored --exact
          rag_engine::upgrade_tests::a_library_written_by_0_0_10_keeps_its_documents_searches_and_memories

      - name: ANN recall past the vector index threshold
        run: >
          cargo test --locked
          --config profile.dev.package.lance-index.opt-level=3
          --config profile.dev.package.lance-linalg.opt-level=3
          --package shodh-rag --lib -- --ignored --exact --nocapture
          storage::ann_recall_tests::ann_search_past_the_index_threshold_recalls_the_exact_neighbours

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

  # Retrieval quality on the committed synthetic corpus (no LLM): a fresh
  # index, every question searched, gated against the committed baseline.
  # Retrieval is deterministic, so any drop fails; latency is reported only.
  # The default search model (fp16) is gated on every runner against
  # baseline.json. The opt-in faster model (int8) is gated against
  # baseline-int8.json too, but only on runners whose int8 kernels are exact
  # (VNNI); elsewhere that step warns on the run and in its summary that it
  # was skipped and why. Apple silicon has its own job (eval-retrieval-int8).
  # The scanned corpus (image-only pages) is gated the same way, read with the
  # PP-OCRv6 model installed with the search models; it fails when the OCR
  # model is missing rather than measuring another engine.
  eval-retrieval:
    name: Retrieval eval
    needs: changes
    if: needs.changes.outputs.eval-retrieval == 'true'
    runs-on: windows-latest
    # Slowest 48 minutes for the fp16 evals (three corpora, AMD Zen 3 runners,
    # PR #125). The int8 evals on VNNI runners measured 40 minutes on their own
    # (run 41818552734), so a VNNI runner runs both in about 88 minutes; the
    # limit leaves a quarter on top of that.
    timeout-minutes: 110
    env:
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # Same cache as the footprint job: the pinned search and OCR models,
      # keyed by the file that pins them.
      # Only master saves the models (a pull request would add a copy that no
      # other ref can read).
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      # The tests that need the real E5 model: the cutoff at which an answer counts as
      # using a memory, measured on the labelled fixture
      # (crates/shodh-rag/src/user_memory/fixtures/memory_use.json), the embedder
      # itself (batching, int8's batch independence, the CPU path and its calibration,
      # GPU agreement where a GPU runs), and a small library switched fp16 -> int8 ->
      # fp16 with searches checked throughout. SHODH_TEST_MODELS turns the
      # model-backed tests on at compile time; the name filters run these only.
      # One at a time: each loads the model (a gigabyte or more in memory).
      - name: Model tests (E5)
        env:
          SHODH_TEST_MODELS: ${{ runner.temp }}/shodh-models
        run: >
          cargo test --package shodh-rag --lib --
          the_use_cutoff_separates_used_from_unused_memories_with_e5
          embeddings::e5::
          the_real_model_switches_fp16_to_int8_and_back_and_search_stays_right
          --nocapture
          --test-threads=1

      - name: Retrieval eval
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/synthetic/corpus
          --dataset crates/shodh-eval/data/synthetic/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out

      - name: Compare with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/synthetic/baseline.json
          --report eval-out/retrieval-report.json

      - name: Scanned retrieval eval (PP-OCRv6)
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/scanned/corpus
          --dataset crates/shodh-eval/data/scanned/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --ocr ppocr
          --out eval-out-scanned

      - name: Compare scanned with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/scanned/baseline.json
          --report eval-out-scanned/retrieval-report.json

      - name: Paper retrieval eval
        run: >
          cargo run --package shodh-eval -- retrieval
          --corpus crates/shodh-eval/data/papers/corpus
          --dataset crates/shodh-eval/data/papers/dataset.json
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out-papers

      - name: Compare papers with baseline
        run: >
          cargo run --package shodh-eval -- compare
          --baseline crates/shodh-eval/data/papers/baseline.json
          --report eval-out-papers/retrieval-report.json

      # The opt-in faster model, gated against its own baselines, on runners
      # where it runs exactly (the app offers it nowhere else).
      - name: Opt-in int8 retrieval evals (exact int8 kernels only)
        shell: pwsh
        run: |
          $kernels = cargo run -q --package shodh-eval -- int8-kernels
          if ($LASTEXITCODE -ne 0) { throw 'shodh-eval int8-kernels failed' }
          if ($kernels -ne 'exact') {
            # Loud: a skipped gate is shown on the run, not only in the log.
            $why = "The x86 int8 gate (baseline-int8.json) was skipped: this runner's int8 kernels are '$kernels', not VNNI; the app does not offer the faster model on such processors."
            Write-Host "::warning title=int8 gate skipped::$why"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### int8 gate skipped`n`n$why"
            exit 0
          }
          foreach ($corpus in 'synthetic', 'scanned', 'papers') {
            $ocr = if ($corpus -eq 'scanned') { @('--ocr', 'ppocr') } else { @() }
            cargo run --package shodh-eval -- retrieval `
              --corpus "crates/shodh-eval/data/$corpus/corpus" `
              --dataset "crates/shodh-eval/data/$corpus/dataset.json" `
              --models "${{ runner.temp }}/shodh-models" `
              @ocr --search search_model=int8 --out "eval-out-int8-$corpus"
            if ($LASTEXITCODE -ne 0) { throw "The int8 $corpus eval failed" }
            cargo run --package shodh-eval -- compare `
              --baseline "crates/shodh-eval/data/$corpus/baseline-int8.json" `
              --report "eval-out-int8-$corpus/retrieval-report.json"
            if ($LASTEXITCODE -ne 0) { throw "int8 $corpus regressed against baseline-int8.json" }
          }

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-retrieval
          path: |
            eval-out/retrieval-report.json
            eval-out/retrieval-summary.md
            eval-out-scanned/retrieval-report.json
            eval-out-scanned/retrieval-summary.md
            eval-out-papers/retrieval-report.json
            eval-out-papers/retrieval-summary.md
            eval-out-int8-*/retrieval-report.json
            eval-out-int8-*/retrieval-summary.md
          if-no-files-found: ignore

  # Recall's scorecard: synthetic coding sessions in the formats Claude Code and
  # Codex write (crates/shodh-eval/src/recall.rs), indexed with the real models and
  # asked the frozen questions in crates/shodh-eval/data/recall/questions.json. It
  # fails below the target: the right session in the top 5 for at least 90% of the
  # questions, and the 95th percentile of search time under 2 s. Its own job: the
  # retrieval eval's runners already use most of their time limit. The same files
  # decide whether it runs as the retrieval eval's (eval_skip).
  eval-recall:
    name: Recall scorecard
    needs: changes
    if: needs.changes.outputs.eval-recall == 'true'
    runs-on: windows-latest
    # Slowest 23 minutes (PR #161: the build, indexing 29 transcripts, 56 searches and
    # the reranker-off diagnosis); the limit leaves room for a cold cache.
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Recall scorecard
        run: >
          cargo run --package shodh-eval -- recall
          --models "${{ runner.temp }}/shodh-models"
          --out eval-out-recall

      - name: Recall scorecard in the job summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path eval-out-recall/recall-summary.md) {
            Get-Content eval-out-recall/recall-summary.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-recall
          path: |
            eval-out-recall/recall-report.json
            eval-out-recall/recall-summary.md
          if-no-files-found: ignore

  # The opt-in faster model (int8) on Apple silicon, the one ARM class the app
  # offers it on: Apple's dot-product int8 kernels are exact by design, and
  # this job is what measures them. It gates the three corpora against
  # baseline-int8-arm64.json (Apple-silicon int8 rounds differently from x86
  # VNNI, so each class has its own numbers). It fails, never skips, when the
  # runner's int8 kernels are not exact: a gate that cannot run is a failure.
  # macos-26 (arm64, Apple M1 virtual), the image macos-latest names and the
  # macOS job and the release dmg build run on. GitHub retired macos-14, which
  # cancelled this job before it started on every run.
  # When GitHub retires macos-26 this job is cancelled again, and CI gate
  # fails on every pull request that needs it, every master push and every
  # release until the label moves to the next arm64 image (re-measure there
  # and compare with baseline-int8-arm64.json, as this move did). The
  # retirement is announced in actions/runner-images.
  eval-retrieval-int8:
    name: Retrieval eval (int8, Apple silicon)
    needs: changes
    if: needs.changes.outputs.eval-retrieval-int8 == 'true'
    runs-on: macos-26
    # Slowest 71 minutes on a cold cache (run 41984775872: build and probe 15,
    # model tests 8, the three int8 evals 47; run 41966083623 took 63); the
    # limit leaves a quarter on top.
    timeout-minutes: 90
    env:
      # The workflow's -crt-static is for the Windows MSVC builds.
      RUSTFLAGS: ""
      # Line tables only: smaller debug builds and caches (release is untouched).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # LanceDB's protobuf definitions are compiled at build time.
      - name: Install Protobuf compiler
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - name: The int8 kernels here are exact
        run: |
          kernels="$(cargo run -q --package shodh-eval -- int8-kernels)"
          echo "int8 kernels: $kernels ($(uname -m), $(sysctl -n machdep.cpu.brand_string))"
          if [ "$kernels" != "exact" ]; then
            echo "::error::This runner's int8 kernels are '$kernels', so the Apple-silicon int8 gate cannot run."
            exit 1
          fi

      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-macos-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Install search and OCR models
        run: cargo run --package shodh-eval -- models --models "${{ runner.temp }}/shodh-models"

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-macos-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      # The embedder on Apple silicon (int8's batch independence, the CPU path)
      # and a small library switched fp16 -> int8 -> fp16 with searches checked.
      - name: Model tests (E5)
        env:
          SHODH_TEST_MODELS: ${{ runner.temp }}/shodh-models
        run: >
          cargo test --package shodh-rag --lib --
          embeddings::e5::
          the_real_model_switches_fp16_to_int8_and_back_and_search_stays_right
          --nocapture
          --test-threads=1

      - name: int8 retrieval evals against the Apple-silicon baselines
        run: |
          for corpus in synthetic scanned papers; do
            ocr=()
            if [ "$corpus" = scanned ]; then ocr=(--ocr ppocr); fi
            cargo run --package shodh-eval -- retrieval \
              --corpus "crates/shodh-eval/data/$corpus/corpus" \
              --dataset "crates/shodh-eval/data/$corpus/dataset.json" \
              --models "${{ runner.temp }}/shodh-models" \
              "${ocr[@]}" --search search_model=int8 --out "eval-out-int8-$corpus"
            cat "eval-out-int8-$corpus/retrieval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          done
          failed=0
          for corpus in synthetic scanned papers; do
            if ! cargo run --package shodh-eval -- compare \
              --baseline "crates/shodh-eval/data/$corpus/baseline-int8-arm64.json" \
              --report "eval-out-int8-$corpus/retrieval-report.json"; then
              echo "::error::int8 $corpus regressed against baseline-int8-arm64.json"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-retrieval-int8-arm64
          path: |
            eval-out-int8-*/retrieval-report.json
            eval-out-int8-*/retrieval-summary.md
          if-no-files-found: ignore

  frontend:
    name: Frontend Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # under 1 minute
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # npm's download cache is restored here and saved by master only (as the
      # Rust caches are): setup-node's own cache would save a copy from every
      # pull request into the 10 GB cache pool, which no other ref can read.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate the npm cache
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Save the npm cache
        if: github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm test

  # Memory and startup budget of the release build, on a fresh profile with
  # the search models installed (they load only when used).
  # scripts/measure-footprint.ps1 documents what is measured. Budgets are the
  # measured release build plus at most 10%, and never above the targets
  # (350 MB, 1.5 s). The idle figure assumes WebView2 runs with --disable-gpu
  # (profile.rs); with GPU compositing it would be about 115 MB more.
  #
  # Idle memory: five runs of 60 s, the median is gated at 163 MB. 148.6 MB
  # (median of 3 runs on a developer machine; 143-149 MB on this runner).
  #
  # Time to a usable window depends on the runner: the same build measured
  # 0.52-0.64 s on one windows-latest machine and 0.87-1.07 s on another, so a
  # raw number is not gated. The build is launched interleaved with other
  # builds on the same runner (each on its own profile, order rotating every
  # pair, one warm-up pair discarded, PAIRS measured pairs). Each build's time
  # is the mean of its fastest 20% of launches: runner noise only adds time,
  # and on the noisier runners it moves the median of 9 launches by more than
  # a 10% regression (measured on this PR's runs; medians are still logged).
  # PAIRS is 45, not 15: across 64 earlier runs of this job, 15 pairs put the
  # fastest-20% estimate within about 10% of its run's true ratio only 99% of
  # the time, while the anchor ceiling sits 8.5% above the typical 0.866 s, so
  # about one run in 64 failed on noise alone (0.950 s on fcfbd33, 0.876 s on
  # its unchanged re-run). The estimate's spread falls about as pairs^-0.46,
  # so 45 pairs cuts it to about 6%, inside the margin, for about 2.5 more
  # minutes (4.4 s a pair).
  # Gated on ratios of those times:
  #   - Against the base commit's build (the merge commit's first parent), at
  #     most MAX_WINDOW_RATIO, set from master-against-itself runs.
  #   - Against a fixed anchor build (FOOTPRINT_ANCHOR_SHA, the code the 0.94 s
  #     budget was set from: 0.857 s, median of 5 runs on windows-latest):
  #     this build / anchor x 0.857 s must stay within 0.94 s. The anchor does
  #     not move with master, so a series of small regressions that each pass
  #     the ratio still reaches this ceiling.
  # The base commit's build comes from master's push run (artifact
  # footprint-exe-<sha>, uploaded right after its build), else it is built
  # here (about 35 more minutes; a pull request saves no cache). The anchor is a
  # 90-day artifact of a master run (footprint-anchor-<sha>), else the cache,
  # else built. Push runs on master upload their build, seed the anchor
  # artifact, and record their time against the anchor.
  #
  # The release build's Rust cache is shared with release.yml's Windows
  # installer build (same shared-key, flags and profile): master saves it
  # here, and installer builds on pull requests and tags restore it instead
  # of compiling every dependency from scratch.
  footprint:
    name: Footprint budget
    needs: changes
    if: needs.changes.outputs.footprint == 'true'
    runs-on: windows-latest
    # Slowest 94 minutes (the base commit's build missing). With both the base
    # commit's build and the anchor missing, three release builds of about
    # 35-40 minutes each plus 10 minutes of measuring.
    timeout-minutes: 160
    permissions:
      contents: read
      actions: read  # find and download the base commit's build
    env:
      FOOTPRINT_ANCHOR_SHA: 76bf22ff6df23370b58b6af5d0684f0529efd2ab
      FOOTPRINT_ANCHOR_SECONDS: "0.857"
      PAIRS: "45"
      MAX_WINDOW_RATIO: "1.06"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the merge commit's first parent is the base commit
          persist-credentials: false

      - name: Resolve the builds to compare
        id: builds
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $reference = git rev-parse HEAD^1
            if ($LASTEXITCODE -ne 0) { throw 'The merge commit has no first parent' }
            Write-Host "Reference: base commit $reference"
            "reference=$reference" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Anchor: $env:FOOTPRINT_ANCHOR_SHA ($env:FOOTPRINT_ANCHOR_SECONDS s when the budget was set)"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      # prefix-key and shared-key as in release.yml's Windows build (one entry).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: release-x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Pinned, checksum-verified protoc from the official release (the
      # Chocolatey feed answers 503 at times while choco exits 0).
      - name: Install Protobuf compiler
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - uses: ./.github/actions/onnxruntime

      # npm's download cache, saved by master only (as in the frontend job).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate the npm cache
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Save the npm cache
        if: github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Build release app
        run: cargo build --release -p shodh-rag-app --features tauri/custom-protocol

      # Before the base commit's or the anchor's build below, which may use
      # another ort-sys and so another archive.
      - name: ONNX Runtime came from the cache
        run: python -I scripts/ci/ort_archive.py verify

      # Copied out of target/: building the base commit or the anchor below
      # writes the same path.
      - name: Stage this build
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/footprint-bin/pr"
          Copy-Item -LiteralPath target/release/shodh-rag-app.exe -Destination $dir

      - name: Upload this build for PRs based on it
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-exe-${{ github.sha }}
          path: ${{ runner.temp }}/footprint-bin/pr/shodh-rag-app.exe
          retention-days: 30
          if-no-files-found: error

      - name: Download the base commit's build
        id: reference-artifact
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.builds.outputs.reference }}
        run: |
          $name = "footprint-exe-$env:REFERENCE"
          $runId = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $runId) {
            Write-Host "No artifact $name (master's push run has not uploaded it yet, or it expired): building it here (a pull request saves no cache: master saves caches only)."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir "$env:RUNNER_TEMP/footprint-bin/reference"
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          Write-Host "Base commit's build: artifact $name from run $runId"
          "found=true" >> $env:GITHUB_OUTPUT

      # The anchor never changes, so it is kept as a 90-day artifact of a
      # master run (the repository's maximum), found the same way as the base
      # commit's build. A cache entry is evicted with the rest of the 10 GB
      # pool. Only runs of this repository's master branch are trusted (a fork's
      # branch can be named master too), as above.
      - name: Download the anchor build
        id: anchor-artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "footprint-anchor-$env:FOOTPRINT_ANCHOR_SHA"
          $found = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts?name=$name" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "master" and .workflow_run.head_repository_id == .workflow_run.repository_id)][0] | if . then "\(.workflow_run.id) \(.created_at)" else empty end'
          if ($LASTEXITCODE -ne 0) { throw "Listing the artifact $name failed" }
          if (-not $found) {
            Write-Host "No artifact $name (not uploaded yet, or it expired): trying the cache, else building it here."
            "found=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $runId, $createdAt = $found -split ' '
          $dir = "$env:RUNNER_TEMP/footprint-bin/anchor"
          gh run download $runId --repo $env:GITHUB_REPOSITORY --name $name --dir $dir
          if ($LASTEXITCODE -ne 0) { throw "Downloading $name from run $runId failed" }
          $exe = Join-Path $dir 'shodh-rag-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "$name has no shodh-rag-app.exe" }
          $ageDays = ([DateTimeOffset]::UtcNow - [DateTimeOffset]::Parse($createdAt, [cultureinfo]::InvariantCulture)).TotalDays
          Write-Host ("Anchor build: artifact $name from run $runId, {0:N0} days old, SHA-256 {1}" -f $ageDays, (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash)
          "found=true" >> $env:GITHUB_OUTPUT
          # A master run uploads the same file again before the artifact expires.
          $stale = if ($ageDays -gt 45) { 'true' } else { 'false' }
          "stale=$stale" >> $env:GITHUB_OUTPUT

      - name: Restore the anchor build
        id: anchor-cache
        if: steps.anchor-artifact.outputs.found != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Same toolchain, flags and target directory as this build (registry
      # dependencies are reused), with each commit's own lockfile and frontend.
      - name: Build what was not stored
        id: build-missing
        shell: pwsh
        env:
          REFERENCE: ${{ steps.builds.outputs.reference }}
          REFERENCE_ARTIFACT: ${{ steps.reference-artifact.outputs.found }}
          ANCHOR_ARTIFACT: ${{ steps.anchor-artifact.outputs.found }}
          ANCHOR_CACHE: ${{ steps.anchor-cache.outputs.cache-hit }}
        run: |
          $missing = New-Object System.Collections.ArrayList
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -and $env:REFERENCE_ARTIFACT -ne 'true') {
            [void]$missing.Add(@{ Label = 'reference'; Sha = $env:REFERENCE })
          }
          if ($env:ANCHOR_ARTIFACT -ne 'true' -and $env:ANCHOR_CACHE -ne 'true') {
            [void]$missing.Add(@{ Label = 'anchor'; Sha = $env:FOOTPRINT_ANCHOR_SHA })
          }
          if ($missing.Count -eq 0) { Write-Host 'Every build to compare was downloaded or restored.'; exit 0 }
          $target = Join-Path $env:GITHUB_WORKSPACE 'target'
          foreach ($build in $missing) {
            Write-Host "No stored $($build.Label) build of $($build.Sha): building it here."
            $src = Join-Path $env:RUNNER_TEMP "footprint-src-$($build.Label)"
            git fetch --no-tags --depth=1 origin $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Fetching $($build.Sha) failed" }
            git worktree add --detach $src $build.Sha
            if ($LASTEXITCODE -ne 0) { throw "Checking out $($build.Sha) failed" }
            Push-Location (Join-Path $src 'app')
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed for $($build.Sha)" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Frontend build failed for $($build.Sha)" }
            Set-Location $src
            cargo build --release -p shodh-rag-app --features tauri/custom-protocol --target-dir $target
            if ($LASTEXITCODE -ne 0) { throw "Release build failed for $($build.Sha)" }
            Pop-Location
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "footprint-bin/$($build.Label)")
            Copy-Item -LiteralPath (Join-Path $target 'release/shodh-rag-app.exe') -Destination $dir
            git worktree remove --force $src
            "$($build.Label)=true" >> $env:GITHUB_OUTPUT
          }

      # Master only (the artifact is the durable copy; a PR's copy would only
      # fill the pool).
      - name: Cache the anchor build
        if: steps.build-missing.outputs.anchor == 'true' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/footprint-bin/anchor
          key: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}

      # Master seeds the artifact (from the build or the cache) when it is
      # missing, and renews it before it expires.
      - name: Upload the anchor build
        if: github.event_name == 'push' && (steps.anchor-artifact.outputs.found != 'true' || steps.anchor-artifact.outputs.stale == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint-anchor-${{ env.FOOTPRINT_ANCHOR_SHA }}
          path: ${{ runner.temp }}/footprint-bin/anchor/shodh-rag-app.exe
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      # The pinned search and OCR models (installed by the app itself, SHA-256
      # checked), cached by the file that pins them.
      - name: Restore search models
        id: models-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Measure footprint
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP/footprint-bin"
          $opts = @{
            Exe                 = "$bin/pr/shodh-rag-app.exe"
            ModelPath           = "$env:RUNNER_TEMP/shodh-models"
            InstallModels       = $true
            Scenario            = 'idle'
            Runs                = 5
            IdleSeconds         = 60
            BudgetIdleMB        = 163
            AnchorExe           = "$bin/anchor/shodh-rag-app.exe"
            AnchorWindowSeconds = [double]$env:FOOTPRINT_ANCHOR_SECONDS
            BudgetWindowSeconds = 0.94
            Pairs               = [int]$env:PAIRS
            WarmupPairs         = 1
            Output              = 'footprint.json'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $opts.ReferenceExe = "$bin/reference/shodh-rag-app.exe"
            $opts.MaxWindowRatio = [double]$env:MAX_WINDOW_RATIO
          }
          ./scripts/measure-footprint.ps1 @opts

      - name: Save search models
        if: github.ref == 'refs/heads/master' && steps.models-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/shodh-models
          key: search-models-${{ hashFiles('crates/shodh-rag/src/embeddings/model_store.rs') }}

      - name: Upload footprint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: footprint
          path: footprint.json
          if-no-files-found: ignore

  # Shodh for Android (mobile/): its frontend tests, a debug APK for phones
  # (arm64) and the emulator (x86_64), then the APK launched on an Android
  # emulator as a tester opens it (the_app_reaches_its_pair_screen): installed,
  # started, its pair screen reached, and still running 15 s later with no
  # crash. Ready is the app's own logcat line (link.rs), written once the
  # window has shown its first screen, the link's key was read from the
  # Android Keystore-backed storage (made on this first start) and the link's
  # iroh endpoint is bound. The Android project (gen/android) is generated
  # here by the pinned Tauri CLI from mobile/src-tauri; it is not committed.
  # The screenshot tour is its own job, below (android-tour), which CI gate
  # does not wait for; both share this job's env (its YAML anchor), so the
  # tour runs the same launch test, the same emulator and the same APK.
  android:
    name: Android build + launch
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    # This job has no run history yet. 90 minutes bounds a cold run: no Rust
    # or Gradle cache, two Android targets, the Gradle build and an emulator
    # boot of up to 10 minutes.
    timeout-minutes: 90
    env: &android_env
      # The workflow's -crt-static is for the desktop's builds; Android links
      # its C library dynamically whatever the flag says.
      RUSTFLAGS: ""
      # r27c, the NDK's long-term-support release.
      NDK_VERSION: 27.2.12479018
      # Test and dev builds are their own app (com.shodhrag.mobile.dev,
      # mobile/src-tauri/tauri.dev.conf.json), so they never replace the
      # real one (com.shodhrag.mobile) on a phone.
      ANDROID_PACKAGE: com.shodhrag.mobile.dev
      # The emulator, pinned rather than the latest the action would take
      # (it moves: 37.2.13 in the first runs where the emulator died, 37.3.9
      # by 2026-11-15). It died mid-tour on this pin too (runs 43689345770
      # and 43701191529; see android-tour). 35.4.9, build 13025442 (March
      # 2025), the long-lived 35.x line from before 37.x, well within the
      # API 34 image's minimum (29.1.11). The launch test fails unless the
      # installed emulator is this build: EMULATOR_REVISION is the Pkg.Revision of
      # build 13025442 (its boot banner in run 43683199614: "Android
      # emulator version 35.4.9.0 (build_id 13025442)").
      EMULATOR_BUILD: '13025442'
      EMULATOR_REVISION: '35.4.9'
      # The launch test of both jobs (TOUR, set by each step, says how far
      # it goes).
      LAUNCH_TEST: |
        now_ms() { date +%s%3N; }
        # PASS is which tour this is (the step sets it): "blur", the app as
        # it is, whose screenshots are the ones people see, or "noblur",
        # the same tour with every backdrop-filter off (debug.shodh.noblur,
        # tour.rs), which measures what the frosted glass costs this
        # emulator's software renderer.
        case "$PASS" in
          blur) noblur=0; screens_artifact=android-screens ;;
          noblur) noblur=1; screens_artifact=android-screens-noblur ;;
          *) echo "::error::PASS is blur or noblur, not ${PASS:-unset}"; exit 1 ;;
        esac
        # TOUR is how far this goes (the step sets it): 0, the launch
        # checks alone (Android build + launch, which CI gate requires),
        # ending at "Still running 15 s after ready" and the recording; 1,
        # the same launch, then the screenshot tour and the theme
        # following the phone (Android screenshot tour, which it does not).
        case "${TOUR:-}" in
          0) screens_artifact=android-launch-screens; evidence_artifact=android-launch-evidence; title="Android launch" ;;
          1) evidence_artifact="android-launch-evidence-$PASS"; title="Android tour" ;;
          *) echo "::error::TOUR is 0 or 1, not ${TOUR:-unset}"; exit 1 ;;
        esac
        evidence="$RUNNER_TEMP/android-launch-$PASS"
        mkdir -p "$evidence"
        echo "### $title, pass $PASS" >> "$GITHUB_STEP_SUMMARY"

        # The emulator is the pinned build (emulator-build below), not the
        # latest one the action installs first and then unzips it over.
        # The unzip writes the pinned build's source.properties, so its
        # Pkg.Revision is the installed version, and it must be the pinned
        # build's (EMULATOR_REVISION). `emulator -version` exited at once
        # with no version line on this runner (run 43683199614, whose check
        # kept only a matching line), so its whole output and exit status
        # are kept as evidence, and a build_id it prints must be the pinned one.
        emulator_revision=$(sed -n 's/^Pkg.Revision=//p' "$ANDROID_HOME/emulator/source.properties" | tr -d '\r')
        version_status=0
        version_output=$(timeout -k 5 30 "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tr -d '\r') || version_status=$?
        {
          echo "Pkg.Revision=$emulator_revision"
          echo "emulator -version (exit status $version_status):"
          printf '%s\n' "$version_output"
        } | tee "$evidence/emulator-version.txt"
        if [ "$emulator_revision" != "$EMULATOR_REVISION" ]; then
          echo "::error::The emulator is not the pinned build $EMULATOR_BUILD ($EMULATOR_REVISION): Pkg.Revision is ${emulator_revision:-missing}"
          exit 1
        fi
        version_build=$(sed -n 's/.*(build_id \([0-9][0-9]*\)).*/\1/p' <<< "$version_output" | sed -n 1p)
        if [ -n "$version_build" ] && [ "$version_build" != "$EMULATOR_BUILD" ]; then
          echo "::error::The emulator is not the pinned build $EMULATOR_BUILD: -version says build_id $version_build"
          exit 1
        fi
        echo "- emulator: Pkg.Revision $emulator_revision, build_id ${version_build:-not printed by -version (exit status $version_status)}" >> "$GITHUB_STEP_SUMMARY"

        # The emulator's process on the runner, sampled every 2 s into
        # emulator-load.txt: its CPU over each interval (utime + stime
        # from /proc, as % of one core; ps's pcpu is a lifetime average
        # and would hide a rise), its resident memory and threads, and
        # the runner's available memory and load. Each shot below writes
        # its name into the same file, so the load is read against the
        # screens, and the last sample before "gone" dates the
        # emulator's end. At most 3600 samples (2 hours), so the file is
        # bounded whatever happens. comm is "qemu-system-x86" (15
        # characters) for the windowed and the headless binary alike;
        # -f with the name would also match this script, whose text names
        # it. The fallback, the binary's expanded path, cannot: the
        # script's text has the literal "$ANDROID_HOME".
        qemu_found_by="its name"
        qemu_pid=$(pgrep -o -x 'qemu-system-x86' || true)
        if [ -z "$qemu_pid" ]; then
          qemu_found_by="its path"
          qemu_pid=$(pgrep -o -f "$ANDROID_HOME/emulator/qemu/" || true)
        fi
        echo "The emulator's process: pid ${qemu_pid:-none}, found by $qemu_found_by"
        if [ -z "$qemu_pid" ]; then
          echo "::error::No qemu-system-x86 process on the runner, so the emulator's load cannot be sampled"
          pgrep -a -f 'qemu|emulator' || true
          exit 1
        fi
        load="$evidence/emulator-load.txt"
        sample_emulator() {
          local pid=$1 clk last_ticks="" last_ms now_ms_ stat rest ticks cpu rss threads avail
          local -a f
          clk=$(getconf CLK_TCK)
          echo "# qemu pid $pid; cpu is % of one core over the interval"
          for (( i = 0; i < 3600; i++ )); do
            if ! stat=$(cat "/proc/$pid/stat" 2>/dev/null); then
              echo "$(date +%T.%3N) gone: the emulator's process (pid $pid) has ended"
              return 0
            fi
            now_ms_=$(now_ms)
            # Fields after the command's name, whose parentheses may hold
            # spaces: f[11] is utime and f[12] stime (fields 14 and 15).
            rest=${stat##*) }
            read -r -a f <<< "$rest"
            ticks=$(( f[11] + f[12] ))
            if [ -n "$last_ticks" ] && [ "$now_ms_" -gt "$last_ms" ]; then
              cpu=$(( (ticks - last_ticks) * 100000 / (clk * (now_ms_ - last_ms)) ))
            else
              cpu=-
            fi
            last_ticks=$ticks
            last_ms=$now_ms_
            rss=$(awk '/^VmRSS:/ { print int($2 / 1024) }' "/proc/$pid/status" 2>/dev/null || echo -)
            threads=$(awk '/^Threads:/ { print $2 }' "/proc/$pid/status" 2>/dev/null || echo -)
            avail=$(awk '/^MemAvailable:/ { print int($2 / 1024) }' /proc/meminfo)
            echo "$(date +%T.%3N) cpu=${cpu}% rss=${rss}MB threads=${threads} runner_available=${avail}MB load=$(cut -d ' ' -f 1 /proc/loadavg)"
            sleep 2
          done
          echo "$(date +%T.%3N) sampling stopped after 3600 samples"
        }
        sample_emulator "$qemu_pid" >> "$load" 2>&1 &
        sampler=$!

        # How the emulator's process ends, from the kernel (no emulator
        # line, crash report or out-of-memory kill has said so before):
        # fatal signals sent to any process, with their sender, and each
        # process's exit_group code, kept in the kernel's ring buffer
        # (the newest kept when it fills) and read at the end. Evidence
        # only: when the runner has no tracefs it is noted and skipped.
        tracing=/sys/kernel/tracing
        # The signals: SIGHUP, INT, QUIT, ILL, ABRT, BUS, FPE, KILL, SEGV,
        # TERM, XCPU, XFSZ and SYS.
        traced=0
        if sudo -n test -w "$tracing/trace" && sudo -n test -d "$tracing/events/syscalls/sys_enter_exit_group" && sudo -n sh -euc "
            echo 0 > $tracing/tracing_on
            echo > $tracing/trace
            echo 8192 > $tracing/buffer_size_kb
            echo 1 > $tracing/options/record-tgid
            echo 'sig == 1 || sig == 2 || sig == 3 || sig == 4 || sig == 6 || sig == 7 || sig == 8 || sig == 9 || sig == 11 || sig == 15 || sig == 24 || sig == 25 || sig == 31' > $tracing/events/signal/signal_generate/filter
            echo 1 > $tracing/events/signal/signal_generate/enable
            echo 1 > $tracing/events/syscalls/sys_enter_exit_group/enable
            echo 1 > $tracing/tracing_on
          "; then
          traced=1
        else
          echo "The runner's tracefs could not be set up: how the emulator ends is not traced" | tee "$evidence/emulator-end.txt"
        fi
        trace_end() {
          [ "$traced" -eq 1 ] || return 0
          {
            # How many exit_group calls the buffer holds at all, so an
            # empty list below means "none from the emulator", not "no
            # trace". The TERMs this script sends its log stream and
            # sampler at its end are in the signals: tracing works.
            echo "== exit_group calls in the buffer, of every process: $(sudo -n cat "$tracing/trace" | grep -c 'sys_exit_group' || true)"
            echo "== fatal signals (all processes), then exit_group calls of the emulator's process ($qemu_pid)"
            sudo -n cat "$tracing/trace" | grep -E "signal_generate|\( *$qemu_pid\)" | tail -n 400
          } > "$evidence/emulator-end.txt" 2>&1 || true
          sudo -n sh -c "echo 0 > $tracing/tracing_on; echo 0 > $tracing/events/signal/signal_generate/enable; echo 0 > $tracing/events/syscalls/sys_enter_exit_group/enable; echo 0 > $tracing/events/signal/signal_generate/filter; echo > $tracing/trace" || true
        }

        # Each shot's frames as the app's renderer counted them (dumpsys
        # gfxinfo, then reset, so each row is that screen alone): frames,
        # janky frames and the frame-time percentiles.
        frames="$evidence/gfxinfo.md"
        {
          echo "| shot | frames | janky | p50 | p90 | p95 | p99 |"
          echo "| --- | --- | --- | --- | --- | --- | --- |"
        } > "$frames"
        frame_stats() {
          local name=$1 out="$evidence/gfxinfo-$1.txt" total janky
          adb_within 30 shell dumpsys gfxinfo "$ANDROID_PACKAGE" | tr -d '\r' > "$out"
          adb_within 30 shell dumpsys gfxinfo "$ANDROID_PACKAGE" reset > /dev/null
          pick() { grep -m 1 -E "^ *$1" "$out" | sed -E "s/^ *$1:? *//" || true; }
          total=$(pick 'Total frames rendered')
          janky=$(pick 'Janky frames')
          echo "| $name | ${total:-none} | ${janky:-none} | $(pick '50th percentile') | $(pick '90th percentile') | $(pick '95th percentile') | $(pick '99th percentile') |" >> "$frames"
        }
        # The numbers in the step's summary, whether the tour ends well or not.
        summarize_load() {
          {
            # TOUR=0 takes no shots, so it has no frames to show.
            if [ "$TOUR" = 1 ]; then
              echo
              echo "Frames per shot (dumpsys gfxinfo), pass $PASS:"
              echo
              cat "$frames"
            fi
            echo
            awk -v pass="$PASS" '
              /cpu=/ {
                n++
                for (i = 2; i <= NF; i++) { split($i, kv, "="); v[kv[1]] = kv[2] }
                c = v["cpu"]; sub("%", "", c); r = v["rss"]; sub("MB", "", r)
                if (c != "-" && c + 0 > cpu) cpu = c + 0
                if (r + 0 > rss) rss = r + 0
                last = $1
              }
              /gone/ { gone = $1 }
              END {
                printf "- emulator process, pass %s: %d samples, peak CPU %d%% of one core, peak RSS %d MB, last sample %s", pass, n, cpu, rss, last
                if (gone) printf ", gone at %s", gone
                printf "\n"
              }' "$load"
          } >> "$GITHUB_STEP_SUMMARY" || true
        }
        # Every adb call is bounded. A call that outlives its limit means
        # the emulator or adb is wedged: the call fails, the step ends at
        # once (bash -e) and the evidence below is kept. With unbounded
        # adb calls, this step once hung for 70 minutes after the
        # emulator went offline, until the job's limit cancelled it and
        # no evidence was uploaded.
        # -k 5: an adb that ignores the TERM is killed 5 s later.
        adb_within() { local seconds=$1; shift; timeout -k 5 "$seconds" adb "$@"; }
        # The log streams to the runner from the start, so it is kept
        # even when the emulator dies or goes offline (a dump at the end
        # cannot be read from an offline emulator). The stream ends
        # with the emulator, or at the end of this script.
        # Room for the whole launch, and nothing from before it: the
        # ready line read below is this launch's. 10 s: each is one
        # request to logd.
        adb_within 10 logcat -G 16M
        adb_within 10 logcat -b main,system,crash -c
        adb logcat -v threadtime -b main,system,crash > "$evidence/logcat.txt" 2>&1 &
        log_stream=$!
        # On a failure, what the runner saw too: whether adb still sees
        # the emulator, whether its process lives, the runner's memory
        # and the kernel's log (an out-of-memory kill of the emulator is
        # there), and every death of the app in the streamed log.
        on_exit() {
          local status=$?
          kill "$log_stream" "$sampler" 2>/dev/null || true
          trace_end
          summarize_load
          if [ "$status" -ne 0 ]; then
            {
              echo "== adb devices"; timeout -k 5 15 adb devices -l
              echo "== emulator processes"; pgrep -a -f 'qemu-system|emulator' || echo "none"
              echo "== runner memory"; free -m
              echo "== kernel log"; timeout -k 5 15 sudo -n dmesg -T | tail -n 200
              # The emulator's own crash reports: at its start it prints
              # "Storing crashdata in: /tmp/android-runner/emu-crash-<version>.db".
              # A minidump there names the emulator thread that died.
              echo "== emulator crash reports"; ls -laR /tmp/android-runner/emu-crash-*.db || echo "none"
            } > "$evidence/host.txt" 2>&1 || true
            cp -r /tmp/android-runner/emu-crash-*.db "$evidence/" 2>/dev/null || true
            echo "::group::Evidence (all of it is in the $evidence_artifact artifact)"
            tail -n 80 "$evidence/host.txt" || true
            echo "== the app's deaths in the streamed log"
            grep -E "Killing [0-9]+:$ANDROID_PACKAGE|Process $ANDROID_PACKAGE .*has died|FATAL EXCEPTION|Fatal signal" "$evidence/logcat.txt" | tail -n 20 || true
            echo "::endgroup::"
          fi
        }
        trap on_exit EXIT

        # The phone's screen is the AVD's own (profile pixel_6 below:
        # 1080x2400 at 420 dpi), never a runtime override. With no
        # profile the panel was 320x640, and `wm size 1080x2400` on it
        # became 1080x1920 (the system caps the override at 3x the panel),
        # left the touch digitizer at 320x640, and on the second relaunch
        # under it the emulator's renderer printed "Failed to find
        # ColorBuffer" and its process was gone seconds later.
        display_size=$(adb_within 30 shell wm size | tr -d '\r')
        display_density=$(adb_within 30 shell wm density | tr -d '\r')
        if [ "$display_size" != "Physical size: 1080x2400" ] || [ "$display_density" != "Physical density: 420" ]; then
          echo "::error::The emulator's screen is not the pixel_6 profile's 1080x2400 at 420 dpi, with no override: $display_size; $display_density"
          exit 1
        fi

        start=$(now_ms)
        # 180 s: the universal debug APK installs in about 15 s here.
        adb_within 180 install -r "$APK" | tr -d '\r' | tee "$evidence/install.txt"
        installed_ms=$(( $(now_ms) - start ))
        # 30 s for each quick shell command: they take well under a second.
        component=$(adb_within 30 shell cmd package resolve-activity --brief "$ANDROID_PACKAGE" | tr -d '\r' | tail -n 1)
        case "$component" in
          "$ANDROID_PACKAGE"/*) ;;
          *) echo "::error::$ANDROID_PACKAGE has no launcher activity: $component"; exit 1 ;;
        esac

        # What the screen shows, for people to look at (not a gate): a
        # recording of the launch and screenshots in both themes.
        screens="$RUNNER_TEMP/$screens_artifact"
        mkdir -p "$screens"

        # The phone starts in light mode (read, not set): the app's own
        # start below is in the phone's theme, and the tour's last shots
        # turn the phone dark once to check the app follows it.
        night=$(adb_within 30 shell cmd uimode night | tr -d '\r')
        if [ "$night" != "Night mode: no" ]; then
          echo "::error::The emulator does not start in light mode: $night"
          exit 1
        fi
        # The launcher in light mode, with Shodh's icon (for the user's
        # review), before Shodh first runs: its home screen, then the list
        # of all apps (a swipe up). The dark ones are taken at the end,
        # after the phone turns dark. The pauses only let the launcher
        # settle for the picture, and decide no result.
        launcher_shots() {
          adb_within 30 shell input keyevent KEYCODE_HOME
          sleep 3
          adb_within 20 exec-out screencap -p > "$screens/launcher-home-$1.png"
          adb_within 30 shell input swipe 540 2000 540 500 300
          sleep 3
          adb_within 20 exec-out screencap -p > "$screens/launcher-apps-$1.png"
          adb_within 30 shell input keyevent KEYCODE_HOME
        }
        launcher_shots light

        # 45 s: the recording stops itself at 30 s, then writes its file.
        adb_within 45 shell screenrecord --time-limit 30 /sdcard/shodh-launch.mp4 &
        recorder=$!

        # The screenshot tour's watcher starts only when this is set at
        # launch (tour.rs), so a tester's debug build never runs it.
        adb_within 30 shell setprop debug.shodh.tour.on 1
        # Set in both passes (0 or 1), so neither reads a value it did not set.
        adb_within 30 shell setprop debug.shodh.noblur "$noblur"
        start=$(now_ms)
        # 120 s, the same as the ready line's wait below: am start -W
        # returns at the first frame, which comes before that line.
        adb_within 120 shell am start -W -n "$component" | tr -d '\r' | tee "$evidence/am-start.txt"
        # 120 s: the slowest first start a tester would wait through
        # without calling the app hung. On this emulator the first start
        # includes the WebView's first start with software rendering, the
        # Keystore generating the link's key and the app's first run.
        # logcat ends at the first ready (or not-ready) line.
        status=0
        adb_within 120 logcat -v brief -s Shodh:I -e 'Shodh (not )?ready' -m 1 > "$evidence/ready.txt" || status=$?
        ready_ms=$(( $(now_ms) - start ))
        if [ "$status" -eq 124 ]; then
          echo "::error::Shodh did not report ready within 120 s of its launch"
          exit 1
        elif [ "$status" -ne 0 ]; then
          echo "::error::Reading logcat failed (status $status) while waiting for ready"
          exit 1
        fi
        # logcat prints a "--------- beginning of main" header before the
        # first line it matches; the ready line is the first Shodh line.
        ready_line=$(tr -d '\r' < "$evidence/ready.txt" | grep -E 'Shodh (not )?ready' | head -n 1 || true)
        echo "$ready_line"
        if ! grep -q 'Shodh ready: the pair screen is shown' <<< "$ready_line"; then
          echo "::error::Shodh did not reach its pair screen: $ready_line"
          exit 1
        fi
        pid=$(adb_within 30 shell pidof "$ANDROID_PACKAGE" | tr -d '\r')
        if [ -z "$pid" ]; then
          echo "::error::Shodh reported ready but is not running"
          exit 1
        fi

        # system_bars_reach_the_page: the app draws edge to edge, and the
        # WebView reports no system bars to the page (env() is 0 in it), so
        # the plugin measures them and tells the page (ShodhPlugin.watchInsets).
        # Its measure, logged before the first screen, must have the
        # pixel_6's status bar and gesture bar, or every screen's bar sits
        # under the clock and the tab bar's labels under the gesture bar.
        adb_within 30 logcat -d -v brief -s Shodh:I | tr -d '\r' > "$evidence/system-bars.txt"
        bars_line=$(grep -F 'Shodh system bars:' "$evidence/system-bars.txt" | tail -n 1 || true)
        echo "${bars_line:-no system bars line}"
        bars_top=$(sed -nE 's/.*Shodh system bars: top ([0-9.]+) dp.*/\1/p' <<< "$bars_line")
        bars_bottom=$(sed -nE 's/.*Shodh system bars: .* bottom ([0-9.]+) dp.*/\1/p' <<< "$bars_line")
        if [ -z "$bars_top" ] || ! awk -v t="$bars_top" 'BEGIN { exit !(t > 0) }'; then
          echo "::error::The page was not told where the status bar is: ${bars_line:-no 'Shodh system bars' line in logcat}"
          exit 1
        fi
        if [ -z "$bars_bottom" ] || ! awk -v b="$bars_bottom" 'BEGIN { exit !(b > 0) }'; then
          echo "::error::The page was not told where the gesture bar is: ${bars_line:-no 'Shodh system bars' line in logcat}"
          exit 1
        fi

        # 15 s after ready covers the start's background work: the link's
        # first relay connection and address lookup, which run after the
        # endpoint is bound. A crash of the app ends the wait at once.
        status=0
        adb_within 15 logcat -b crash -v threadtime -e "$ANDROID_PACKAGE" -m 1 > "$evidence/crash-wait.txt" || status=$?
        if [ "$status" -ne 124 ]; then
          if [ -s "$evidence/crash-wait.txt" ]; then
            echo "::error::Shodh crashed within 15 s of being ready"
            cat "$evidence/crash-wait.txt"
          else
            echo "::error::Reading the crash log ended (status $status) before the 15 s were up"
          fi
          exit 1
        fi
        now_pid=$(adb_within 30 shell pidof "$ANDROID_PACKAGE" | tr -d '\r')
        if [ "$now_pid" != "$pid" ]; then
          echo "::error::Shodh is not the process it was at ready (pid $pid, now ${now_pid:-none})"
          exit 1
        fi
        errors=$(adb_within 30 logcat -d -s Shodh:E | tr -d '\r')
        if grep -q 'Shodh panicked' <<< "$errors"; then
          echo "::error::Shodh panicked"
          echo "$errors"
          exit 1
        fi
        echo "Still running 15 s after ready, no crash"

        # The pass is what it says: the app logs at its start that it draws
        # the tour without blur (tour.rs) in the noblur pass, and only there.
        if grep -qF 'Shodh tour: the screens are drawn without backdrop blur' "$evidence/system-bars.txt"; then
          drawn_without_blur=1
        else
          drawn_without_blur=0
        fi
        if [ "$drawn_without_blur" != "$noblur" ]; then
          echo "::error::Pass $PASS set debug.shodh.noblur to $noblur, but the app's start says otherwise (its line without blur: $drawn_without_blur)"
          exit 1
        fi

        wait "$recorder" || true
        adb_within 30 pull /sdcard/shodh-launch.mp4 "$screens/launch.mp4" || true
        launch_summary() {
          {
            echo
            echo "Launch on the emulator (API 34, x86_64, first run, pass $PASS):"
            echo
            echo "- installed in ${installed_ms} ms"
            echo "- pair screen ready ${ready_ms} ms after launch: \`${ready_line}\`"
            echo "- still running 15 s after ready (pid ${pid}), no crash in logcat"
          } >> "$GITHUB_STEP_SUMMARY"
        }
        # TOUR=0 ends here: the launch is checked. The tour is the other job's.
        if [ "$TOUR" = 0 ]; then
          echo "- the launcher in light mode and the launch's recording are in the \`${screens_artifact}\` artifact" >> "$GITHUB_STEP_SUMMARY"
          launch_summary
          exit 0
        fi

        # Every main screen in light and dark, for review, on the AVD's
        # phone-sized screen (checked above), all in the one run of the
        # app started above. Force-stopping and relaunching the app for
        # each picture killed the emulator process itself, whatever its
        # renderer (runs 43624325353, 43662536425, 43670793908). So a
        # debug build takes requests from the system property
        # debug.shodh.tour, "<number> <screen> <phone|light|dark>"
        # (src-tauri/src/tour.rs and src/lib/tour.ts; a release build has
        # neither), and opens that screen again from its start in the same
        # process, in the theme asked for: the app's own theme setting,
        # not the phone's. With no computer paired, the plain names show
        # each screen as it is while not connected; demo-* screens show a
        # scripted computer (src/lib/demo.ts, debug builds only) so the
        # connected screens can be seen. Each shot waits for the app's own
        # ready line, which names the screen and the theme shown, and the
        # app must still be the process that started (pid above). A wrong
        # theme fails the job after every picture is taken. The 3 s pause
        # only lets the data and the springs settle for the picture, and
        # decides no result.
        requests=0
        themes_wrong=()
        # name, the screen asked for ("start": the app's own start), the
        # screen the ready line names, the theme asked for, the theme the
        # ready line must name.
        shoot() {
          local name=$1 request=$2 screen=$3 theme=$4 expect=$5 status=0 line state now ready="$evidence/ready-$1-$5.txt"
          requests=$(( requests + 1 ))
          echo "$(date +%T.%3N) shot $requests: $name ($expect) asked for" >> "$load"
          adb_within 10 logcat -b main -c
          # Quoted for the phone's shell, so the three words are one value.
          adb_within 30 shell setprop debug.shodh.tour "'$requests $request $theme'"
          # 60 s: the app reads the property every 0.2 s and opens the
          # screen in a few seconds here.
          adb_within 60 logcat -v brief -s Shodh:I -e 'Shodh (not )?ready' -m 1 > "$ready" || status=$?
          line=$(tr -d '\r' < "$ready" | grep -m 1 'Shodh' || true)
          if [ "$status" -ne 0 ] || ! grep -q "Shodh ready: the $screen screen is shown" <<< "$line"; then
            if [ "$status" -eq 124 ]; then
              echo "::error::$name ($expect) did not report ready within 60 s"
            elif [ "$status" -ne 0 ]; then
              # logcat ends early when the emulator goes away.
              state=$(timeout -k 5 15 adb get-state 2>&1 | tr -d '\r' || true)
              echo "::error::$name ($expect): reading logcat ended (status $status) before the ready line; the emulator is ${state:-unknown}"
            else
              echo "::error::$name ($expect) did not reach its screen: $line"
            fi
            adb_within 20 exec-out screencap -p > "$screens/$name-$expect-not-ready.png" || true
            return 1
          fi
          # pidof fails when there is no such process: that is "none" here.
          now=$(adb_within 30 shell pidof "$ANDROID_PACKAGE" | tr -d '\r' || true)
          if [ "$now" != "$pid" ]; then
            echo "::error::$name ($expect): Shodh is not the process the tour started with (pid $pid, now ${now:-none})"
            return 1
          fi
          if ! grep -q "in the $expect theme" <<< "$line"; then
            themes_wrong+=("$name, asked for $theme, should be $expect: $line")
          fi
          sleep 3
          # 20 s: a screenshot is one PNG of the screen, under a second here.
          adb_within 20 exec-out screencap -p > "$screens/$name-$expect.png"
          frame_stats "$name-$expect"
        }
        # The launch's frames, from the app's start to here, so each shot's
        # row is that shot's alone.
        frame_stats launch
        # name, the screen asked for, the screen the ready line names
        shots=(
          "pair:start:pair"
          "home:home:home"
          "conversations:conversations:conversations"
          "library:library:library"
          "approvals:approvals:approvals"
          "menu:menu:menu"
          "settings:settings:settings"
          "tasks:tasks:tasks"
          "connected-home:demo-home:demo-home"
          "connected-answer:demo-answer:demo-answer"
          "connected-conversations:demo-conversations:demo-conversations"
          "connected-conversations-research:demo-conversations-research:demo-conversations-research"
          "connected-conversations-code:demo-conversations-code:demo-conversations-code"
          "connected-conversations-creator:demo-conversations-creator:demo-conversations-creator"
          "connected-code:demo-code:demo-code"
          "connected-library:demo-library:demo-library"
          "connected-reader:demo-reader:demo-reader"
          "connected-approvals:demo-approvals:demo-approvals"
          "connected-approval-sheet:demo-sheet:demo-sheet"
          "connected-workspaces:demo-workspaces:demo-workspaces"
          "connected-menu:demo-menu:demo-menu"
        )
        for theme in light dark; do
          for shot in "${shots[@]}"; do
            IFS=: read -r name request screen <<< "$shot"
            shoot "$name" "$request" "$screen" "$theme" "$theme"
          done
        done
        # the_app_follows_the_phones_theme: the app's default theme
        # setting (Phone) shows the phone's, light while the phone is
        # light; then the phone turns dark, once, and the home screen
        # opened again must be dark. The phone's theme is changed only
        # here, with the app running (it is not relaunched): a relaunch
        # just after `cmd uimode night yes` is where run 43662536425's
        # emulator died. If the emulator dies here, the shot's error names
        # it and the pictures before it are kept.
        shoot follows-phone home home phone light
        adb_within 30 shell cmd uimode night yes
        shoot follows-phone home home phone dark
        launcher_shots dark
        echo "- ${#shots[@]} screens, each in light and dark, and the home screen following the phone from light to dark, all in one run of the app (pid ${pid}), are in the \`${screens_artifact}\` artifact" >> "$GITHUB_STEP_SUMMARY"
        if [ "${#themes_wrong[@]}" -gt 0 ]; then
          printf '::error::A screen was not in the theme it should be: %s\n' "${themes_wrong[@]}"
          exit 1
        fi
        launch_summary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the phone app's dependencies
        working-directory: mobile
        run: npm ci

      # The invoke shim (invoke_shim_forwards_and_routes_events), asking and
      # the streamed answer, every screen's loading, empty, connected and
      # asleep states, the theme following the phone, the menu, the colour
      # tokens and their contrast, and the UI rules (12px text, 44px
      # controls, only transform and opacity animated).
      - name: Phone app tests
        working-directory: mobile
        run: npm test

      - name: Type check (phone app)
        working-directory: mobile
        run: npx tsc --noEmit

      # The scripted computer of the screenshots (src/lib/demo.ts) and the
      # screenshot tour's listener (src/lib/tour.ts, its event shodh://tour)
      # are in a debug build only: vite.config.ts sets __SHODH_DEMO__ from
      # the Tauri CLI's TAURI_ENV_DEBUG. (The tour's Rust side, tour.rs, is
      # compiled only with debug assertions.) Both builds are checked, so the
      # release check is not vacuous.
      - name: The screenshots' scripted computer and tour are not in a release build
        working-directory: mobile
        run: |
          set -euo pipefail
          TAURI_ENV_DEBUG=true npx vite build --outDir "$RUNNER_TEMP/js-debug" --logLevel warn
          TAURI_ENV_DEBUG=false npx vite build --outDir "$RUNNER_TEMP/js-release" --logLevel warn
          # The markers are scripts/release/android.mjs's: release.yml checks
          # the release APK's own frontend against the same list.
          node ../scripts/release/android.mjs debug-markers --build debug --dist "$RUNNER_TEMP/js-debug"
          node ../scripts/release/android.mjs debug-markers --build release --dist "$RUNNER_TEMP/js-release"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}
          log-accepted-android-sdk-licenses: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: mobile/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format (phone app)
        run: cargo fmt --manifest-path mobile/src-tauri/Cargo.toml --check

      - name: Generate the Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ndk" || { echo "::error::NDK $NDK_VERSION is not at $ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # Test builds are com.shodhrag.mobile.dev (tauri.dev.conf.json),
          # never the real app's identifier.
          NDK_HOME="$ndk" npx tauri android init --ci --config src-tauri/tauri.dev.conf.json
          # The elephant launcher icons (tauri icon, from the desktop's
          # logo) replace the template's.
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # Every warning fails, Clippy's included: the phone app's own code is
      # new. --locked: a Cargo.lock that does not match the manifests fails.
      - name: Clippy (phone app, Android)
        run: |
          set -euo pipefail
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android24-clang"
          cargo clippy --manifest-path mobile/src-tauri/Cargo.toml --target x86_64-linux-android --locked -- -D warnings

      - name: Build the debug APK
        working-directory: mobile
        run: |
          set -euo pipefail
          start=$(date +%s)
          npx tauri android build --debug --apk --target aarch64 --target x86_64 --config src-tauri/tauri.dev.conf.json
          seconds=$(( $(date +%s) - start ))
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          apk="$PWD/${apks[0]}"
          # Both libraries are in it: arm64 for phones, x86_64 for the emulator.
          abis=$(unzip -l "$apk" | grep -o 'lib/[^/]*/libshodh_mobile_lib\.so' | sort -u | tr '\n' ' ' || true)
          for abi in arm64-v8a x86_64; do
            if ! grep -q "lib/$abi/" <<< "$abis"; then
              echo "::error::The APK has no $abi library (it has: $abis)"
              exit 1
            fi
          done
          echo "APK=$apk" >> "$GITHUB_ENV"
          {
            echo '### Android'
            echo
            echo "- debug APK \`$(basename "$apk")\`: $(du -h "$apk" | cut -f1), built in ${seconds} s; libraries: ${abis}"
          } >> "$GITHUB_STEP_SUMMARY"

      # allow_backup_is_off and no_emoji_compat, read from the built app's
      # merged manifest and resources: the same checks as the release APK's
      # (release.yml), in one place.
      - name: The built app keeps its data on the phone and off Play Services' fonts
        uses: ./.github/actions/android-apk-manifest
        with:
          apk: ${{ env.APK }}

      # The debug build's native library has the screenshot tour and the
      # first-screen property (tour.rs, link.rs), so the release build's check
      # that it has none of them (release.yml) is not vacuous.
      - name: The debug build's native library has the tour
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/debug-lib/libshodh_mobile_lib.so"
          mkdir -p "$(dirname "$lib")"
          unzip -p "$APK" lib/arm64-v8a/libshodh_mobile_lib.so > "$lib"
          node scripts/release/android.mjs debug-markers --build debug --lib "$lib"

      # The launcher icon is an adaptive icon: the whole elephant inside the safe zone
      # (its layer scaled to 0.66, not full bleed), a white background with the phone
      # in light mode and black in dark mode, and a monochrome layer for themed icons.
      - name: The launcher icon is adaptive, inset, and follows night mode
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          icon=$("$aapt2" dump xmltree --file res/mipmap-anydpi-v26/ic_launcher.xml "$APK")
          for layer in background foreground monochrome; do
            grep -q "E: $layer" <<< "$icon" || { echo "::error::the adaptive icon has no $layer layer"; echo "$icon"; exit 1; }
          done
          foreground=$("$aapt2" dump xmltree --file res/drawable/shodh_icon_foreground.xml "$APK")
          scale=$(grep -m 1 -oE 'scaleX\(0x[0-9a-f]+\)=[0-9.]+' <<< "$foreground" | sed 's/.*=//')
          if [ -z "$scale" ] || ! awk -v s="$scale" 'BEGIN { exit !(s > 0 && s <= 0.7) }'; then
            echo "::error::the icon's elephant is not inset into the safe zone (scale ${scale:-none})"
            exit 1
          fi
          resources=$("$aapt2" dump resources "$APK")
          background=$(grep -A4 'color/shodh_icon_background' <<< "$resources")
          grep -q '(night)' <<< "$background" || { echo "::error::the icon has no night background"; echo "$background"; exit 1; }
          grep -qi '#ff000000' <<< "$background" || { echo "::error::the night background is not black"; echo "$background"; exit 1; }
          grep -qi '#ffffffff' <<< "$background" || { echo "::error::the light background is not white"; echo "$background"; exit 1; }
          echo "- launcher icon: adaptive, elephant at scale $scale, white or black background, monochrome layer" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shodh-android-debug-apk
          path: ${{ env.APK }}
          retention-days: 14
          if-no-files-found: error

      # The emulator runs with KVM: without it an x86_64 image boots in tens
      # of minutes, if at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The launch test runs inside the emulator action (the emulator stops
      # when the action ends), which runs each line of `script` on its own,
      # so the test is one bash program, in LAUNCH_TEST (the job's env,
      # shared with the tour job). Here TOUR=0: the launch checks only, up
      # to "Still running 15 s after ready, no crash" and the recording.
      #
      # The emulator process died mid-tour. The kernel traces of runs
      # 43689345770 (-gpu swiftshader_indirect) and 43701191529 (-gpu
      # guest) caught it both times: a segfault (SIGSEGV) in the emulator's
      # own RenderThread, on the pinned 35.4.9 as on 37.x. In run 43689345770 the tour with blur passed in full and the
      # same tour without backdrop-filter died at its first shot, so the
      # frosted glass is not the cause. The tour is therefore its own job
      # (android-tour, below), which does not gate.
      - name: Launch it on an emulator (the_app_reaches_its_pair_screen)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        # The backstop for anything outside the script's bounded calls (the
        # action's own boot wait and emulator shutdown): the boot's 10-minute
        # limit, the image's download and the launch, with room. Past it the
        # step fails, and the evidence is uploaded.
        timeout-minutes: 30
        env:
          PASS: blur
          TOUR: 0
        # The tour job's emulator is this one: the same mapping, by its
        # YAML anchor.
        with: &android_emulator
          api-level: 34
          # The plain Android image, without Google Play Services. On the
          # google_apis image, Play Services updates its modules after a cold
          # boot and restarts itself; Android then kills every process bound
          # to its font provider, and the WebView (Chromium's
          # AndroidFontLookupImpl, in our process) binds to it when each page
          # starts. That killed Shodh mid-tour at random (run 43659263042:
          # "depends on provider ...FontsProvider in dying proc"). It is not
          # in the app's APK (the font check above proves it), and on a phone
          # it happens only on a Play Services restart, so the tour runs where
          # that restart cannot occur.
          target: default
          arch: x86_64
          # A phone's screen from the AVD's creation: 1080x2400 at 420 dpi
          # (the launch test checks it). Without a profile the AVD's panel is
          # 320x640, and the runtime `wm size` the tour used on it is where
          # the emulator died (see the check in LAUNCH_TEST).
          profile: pixel_6
          # The emulator is pinned (EMULATOR_BUILD, the job's env), and the
          # launch test checks the running one is that build.
          emulator-build: ${{ env.EMULATOR_BUILD }}
          # The action's default, kept explicit: a cold boot of this image
          # without a snapshot takes a few minutes on these runners, and a
          # boot not done in 10 minutes is a broken image or runner.
          emulator-boot-timeout: 600
          # The action's default options, kept explicit, with its default
          # renderer (-gpu swiftshader_indirect). -gpu guest bought nothing:
          # its emulator's RenderThread segfaulted mid-tour too (run
          # 43701191529), as swiftshader_indirect's did (run 43689345770).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -euo pipefail -c "$LAUNCH_TEST"

      - name: Upload the launcher shots and launch recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-launch-screens
          path: ${{ runner.temp }}/android-launch-screens
          retention-days: 14
          if-no-files-found: warn

      # The evidence, passed or not: the emulator's log and load.
      - name: Upload the emulator's log and load
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-launch-evidence
          path: ${{ runner.temp }}/android-launch-blur
          retention-days: 14
          if-no-files-found: warn

  # The screenshot tour of the phone app: the APK the Android job built,
  # launched on an emulator of the same settings by the same launch test
  # (TOUR=1), then every main screen in light and dark and the home screen
  # following the phone from light to dark (the_app_follows_the_phones_theme),
  # with all their checks.
  #
  # Not required: CI gate does not wait for it, nor does a release
  # (NOT_REQUIRED_CHECKS, scripts/release/ci-gate.mjs). GitHub's Android
  # emulator segfaults in its own RenderThread mid-tour, whatever the app
  # does: the kernel traces of runs 43689345770 (-gpu swiftshader_indirect)
  # and 43701191529 (-gpu guest), on emulator 35.4.9 as on 37.x, while the
  # app passes every check whenever the emulator lives. The user decided on
  # 2026-11-15 that a test on a real phone covers the theme check. It has no
  # continue-on-error: when the emulator dies the job fails, red; it only
  # does not block a merge.
  #
  # No if: of its own: it needs the Android job, so it is skipped whenever
  # that job is (the same Changes output, android) or fails.
  android-tour:
    name: Android screenshot tour (not required)
    needs: android
    runs-on: ubuntu-latest
    # This job has no run history yet: the emulator's boot of up to 10
    # minutes and the tour's 30-minute step limit, with room.
    timeout-minutes: 45
    # The Android job's env, the same mapping: the emulator pins, the
    # package and LAUNCH_TEST.
    env: *android_env
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # The same platform tools (adb) as the Android job.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Download the debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shodh-android-debug-apk
          path: ${{ runner.temp }}/shodh-android-debug-apk

      - name: The one APK the Android job built
        run: |
          set -euo pipefail
          mapfile -t apks < <(find "$RUNNER_TEMP/shodh-android-debug-apk" -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one APK in the shodh-android-debug-apk artifact, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          echo "APK=${apks[0]}" >> "$GITHUB_ENV"

      # The emulator runs with KVM: without it an x86_64 image boots in tens
      # of minutes, if at all.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # LAUNCH_TEST with TOUR=1: the launch, then the tour. Each shot logs
      # its frames (dumpsys gfxinfo), and the emulator process's CPU and
      # memory are sampled every 2 s.
      - name: Launch it on an emulator and tour its screens (the_app_follows_the_phones_theme)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        # The backstop for anything outside the script's bounded calls (the
        # action's own boot wait and emulator shutdown): the boot's 10-minute
        # limit plus the launch and the tour, about 10 minutes here, with
        # room. Past it the step fails, and the evidence is uploaded.
        timeout-minutes: 30
        env:
          PASS: blur
          TOUR: 1
        # The Android job's emulator, the same mapping.
        with: *android_emulator

      - name: Upload the screenshots and launch recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-screens
          path: ${{ runner.temp }}/android-screens
          retention-days: 14
          if-no-files-found: warn

      # The evidence, passed or not: the frames per shot and the emulator's load.
      - name: Upload the emulator's log, frames and load
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-launch-evidence-blur
          path: ${{ runner.temp }}/android-launch-blur
          retention-days: 14
          if-no-files-found: warn

  # The installers (release.yml, build-only: no tag, so nothing is published
  # and the update bundles are signed with a throwaway key): the Windows NSIS
  # installer and the Apple Silicon dmg are built and checked as a release
  # checks them, and the latest published release is verified read-only.
  # release.yml declares the permissions its publishing jobs need (contents:
  # write, checks: read) and a caller must grant at least those for the call
  # to load; in this build-only call those jobs are skipped and the jobs that
  # run ask for contents: read.
  release-builds:
    name: Release builds
    needs: changes
    if: needs.changes.outputs.release-builds == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      checks: read

  # The one check that stands for every job above but the Android screenshot
  # tour (not required; it is not in needs, so the gate neither waits for it
  # nor reads its result): branch protection requires
  # it (with the fast checks). It is named CI gate, a name no workflow here
  # has used before, so no older check run on a commit can stand in for it.
  # It always runs, so it is never skipped (a skipped required check would
  # count as passed). A job counts when it passed, or when it was skipped and
  # the Changes job's output of the same name is 'false' (not needed by this
  # change). Anything else fails it: a failure, a cancellation (how a retired
  # runner label once went unnoticed), a timeout, or a skip the Changes job
  # did not ask for (Changes itself failed). The release builds count as one
  # job (a reusable workflow's result is a failure when any of its jobs
  # failed). scripts/release/test/ci-gate.test.mjs checks that needs lists
  # every other job but the NOT_REQUIRED_CHECKS (scripts/release/ci-gate.mjs),
  # and that this job never names one of those.
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, lint, scripts, fmt, check, test, test-app, macos, upgrade, eval-retrieval, eval-retrieval-int8, eval-recall, frontend, footprint, release-builds, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          rows=$(jq -r '. as $n | to_entries[] | [.key, .value.result, ($n.changes.outputs[.key] // "none")] | @tsv' <<< "$NEEDS")
          count=$(jq 'length' <<< "$NEEDS")
          if [ "$count" -lt 2 ] || [ -z "$rows" ]; then
            echo "::error::No job results to check ($count)"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r job result needed; do
            if [ "$result" = success ]; then
              echo "$job: passed"
            elif [ "$result" = skipped ] && [ "$needed" = false ]; then
              echo "$job: skipped, not needed by this change"
            else
              echo "::error::$job: $result (needed by this change: $needed)"
              failed=1
            fi
          done <<< "$rows"
          exit "$failed"
