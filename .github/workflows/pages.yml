name: Website

# The project website, site/ as it is (plain HTML and CSS, no build step),
# deployed to GitHub Pages at https://varun29ankus.github.io/shodhRAG/.
# Runs on a push to master that changes site/ or this workflow, and on Run
# workflow; never on pull requests. Deploying needs Pages enabled for the
# repository with "GitHub Actions" as its source (Settings → Pages); until
# then the deploy job fails and nothing else is affected: no CI job, CI gate
# or release reads this workflow's checks (scripts/release/ci-gate.mjs names
# the checks it reads).

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# One deployment at a time; a newer push waits for the running one instead
# of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # the checkout of site/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy the website
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write  # publish the uploaded artifact to Pages
      id-token: write  # the OIDC token deploy-pages proves this run with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
