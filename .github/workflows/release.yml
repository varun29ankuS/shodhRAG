name: Release

# Unsigned desktop installers and the signed Android app on GitHub Releases,
# published only once they are verified.
#
# Publishing runs: a tag push of v*; a call from tag-release.yml when a
# release PR merges; or Run workflow (workflow_dispatch) from master with an
# existing tag, to retry a release that failed.
#   plan            the tag's commit is on master and CI passed on it
#                   (scripts/release/ci-gate.mjs), and the tag equals the
#                   version in every file that carries it at that commit
#                   (scripts/release/versions.mjs, which also lists the files).
#   create-release  a draft release named after the tag (body from
#                   .github/release-notes.md); a re-run reuses its draft.
#   build           the Windows NSIS installer and the Apple Silicon dmg, built
#                   without the signing key (tauri build --no-bundle), then
#                   bundled and their update bundles signed in a later step
#                   (tauri bundle), the only step given the key. That step is
#                   in the same job as the build, so whatever the build left
#                   running (a build script's process, the restored caches'
#                   code) is still there when it runs: unlike android-sign,
#                   the key is not kept from build code. In the `release`
#                   environment. Uploaded as workflow artifacts; the build has
#                   no write token.
#   android         Shodh for Android (mobile/), a release build for arm64
#                   phones (one APK, the name the phone's one-tap update
#                   downloads), unsigned; no debug-only code in its frontend or
#                   native library. Not in the `release` environment: it reads
#                   no secret. Uploads the APK and records its SHA-256.
#   android-sign    signs that APK in a job that runs no build code (no cache,
#                   npm, cargo or Gradle; a sparse checkout of the release
#                   scripts; the runner's build-tools and a pinned Tauri CLI
#                   binary), since the build's daemons outlive its steps. Only
#                   a download with the recorded SHA-256 is signed, in two
#                   separate steps, each the only one to see its key: the
#                   Android key (apksigner, v2 and v3; Android updates an
#                   installed app only with the same certificate), then the
#                   release key's .sig, which the phone's one-tap update checks
#                   (crates/shodh-link/src/update.rs). Checked before upload
#                   (scripts/release/android.mjs check): the certificate, the
#                   package, versionName and versionCode, not debuggable, the
#                   ABIs and size; the manifest checks of ci.yml's android job
#                   (.github/actions/android-apk-manifest). In the `release`
#                   environment; no write token.
#   launch-macos    the dmg installed as a tester installs it (quarantined, copied
#                   out of the mounted image), its signature, architectures,
#                   minimum macOS and libraries checked, Gatekeeper's refusal
#                   recorded, then (quarantine removed, as README.md says)
#                   started on a macOS runner until the main window reports
#                   ready, the embedded-preview probe run on a separate profile
#                   (launch_probe.rs: hit test and screen pixels), kept up and quit.
#                   Publishing waits for it.
#   launch-windows  the Windows installer installed silently and started on a
#                   separate profile with the same probe (hit test, pixels, the
#                   layers hidden again). Publishing waits for it.
#   publish         (environment `release`, one at a time across releases)
#                   checks the artifacts' signatures with the release key,
#                   stages the eight release files with latest.json, and the
#                   versionless copies of the three installers
#                   (Shodh_x64-setup.exe, Shodh_aarch64.dmg, Shodh_android.apk:
#                   the releases/latest/download links README.md and site/
#                   give), uploads them to the draft, downloads the draft and
#                   verifies it (scripts/release/verify.mjs release): exactly
#                   the expected files, none empty, each copy the same file as
#                   its versioned one; latest.json parses, is this version and
#                   points each platform at this release's update bundle (the
#                   desktop's only: the phone finds its app by name); every
#                   signature, the Android app's included, verifies against the
#                   updater public key in tauri.conf.json. Then adds the SHA-256 of each file to the
#                   notes and publishes. It becomes the latest release only if
#                   it is newer than the current latest (an older release
#                   finishing last never takes "latest" back). Then the URL
#                   installed apps poll, and each versionless download link, is
#                   checked (smoke); if that fails, the
#                   release is turned back into a draft and the previous latest
#                   restored.
#
# Recovery: a failed publishing run leaves a draft (or nothing) and no
# published release. Fix the cause, then either
#   - re-run the failed run (or Run workflow with the same tag), when the fix
#     is outside the tagged commit (a flaky runner, a CDN outage); or
#   - bump the version (Prepare release) when the tagged commit itself is
#     wrong: a tag is never moved.
#
# Build-only runs (called by ci.yml without a tag: on pull requests whose
# changed files can affect the installers or the phone app, on every master
# push and in the nightly run): plan, build, android, android-sign,
# launch-macos and launch-windows, then verify checks the installers the
# builds uploaded, with update bundles signed by a throwaway key made for that
# run (pr-key), and the APK signed by a throwaway Android key android-sign
# makes for itself: pull requests never see a release key, and they sign
# through the same jobs and steps a release does. verify also stages them as
# a release and runs the publish-time checks on the result.
# published-release runs the publish and smoke checks, read-only, against the
# latest published release. No release is created or changed. ci.yml's
# Changes job decides when a pull request needs this (a deny-list: only
# documentation and the crates the app never builds are skippable), and its
# CI gate check counts the result.
#
# Signing key: the TAURI_SIGNING_PRIVATE_KEY secret (and its password)
# belong in the `release` environment (deployment policy: master and v*
# tags). Until they are moved there, publishing runs use the repository
# secrets, which tag-release.yml passes to this workflow; once moved, the
# environment's secrets take precedence and the repository copies can be
# deleted. A publishing run without the key fails before bundling.
#
# Android key: ANDROID_KEYSTORE_BASE64 (a PKCS12 keystore), its password
# ANDROID_KEYSTORE_PASSWORD (the store's and the key's) and ANDROID_KEY_ALIAS,
# secrets of the `release` environment only. android-sign's signing step
# decodes the keystore into a private folder of its own and removes it when
# the step ends, whatever its outcome; the password reaches apksigner through
# the environment, never the command line. A publishing run without them
# fails before signing.
#
# No Intel Mac build, and so no universal one: ONNX Runtime is linked
# statically from ort-sys's prebuilt libraries, and ort 2.0.0-rc.13 has none
# for x86_64-apple-darwin ("no prebuilt binaries available for target
# x86_64-apple-darwin"). Microsoft's last x86_64 macOS release (1.23.2) is
# older than the ONNX Runtime API 27 that ort requires, so an Intel build
# needs ONNX Runtime built from source.

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z), already pointing at the commit to build; empty (ci.yml) builds and verifies the installers without publishing.
        required: false
        default: ''
        type: string
    secrets:
      # Optional: once the key is a secret of the `release` environment, the
      # build reads it from there and these stay empty.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      # The Android key: secrets of the `release` environment only, which
      # android-sign reads from there. Declared so the secrets this workflow
      # reads are all listed; no caller passes them.
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (vX.Y.Z) to build and publish again, after a failed run
        required: true
        type: string

permissions:
  contents: read

# Publishing runs one at a time per tag. A build-only run (called by ci.yml)
# has a group of its own: ci.yml's concurrency already cancels a pull
# request's superseded run, and a shared group would cancel a master push's
# pending installer builds when the next push or the nightly run queued its
# own, leaving that commit without a passing CI gate.
concurrency:
  group: release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # llama.cpp (llama-cpp-sys-2) builds its HTTP client with HTTPS when CMake
  # finds OpenSSL. Shodh only loads local GGUF files and never uses llama.cpp's
  # downloader, so it is built without it: the result no longer depends on
  # which OpenSSL a runner has (OpenSSL 4 on macos-26 images from 20261012 does
  # not compile with the vendored cpp-httplib). llama-cpp-sys-2 passes CMAKE_*
  # variables to CMake, and llama.cpp's find_package(OpenSSL) is optional.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "TRUE"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # A tag pushed by hand right after its merge waits here for CI on that
    # commit (up to 200 minutes; CI's slowest job allows 160).
    timeout-minutes: 210
    permissions:
      contents: read
      checks: read  # CI's check runs on the tagged commit
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - name: Publish or build only
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::Run this workflow from master (it was started from ${GITHUB_REF})"
            exit 1
          fi
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [ -z "$tag" ]; then
            node scripts/release/versions.mjs check --github-output
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Building the installers only (no release)"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${tag} is not a release tag (vX.Y.Z)"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          # The tagged commit is master's (a tag pushed by hand can name any commit).
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${sha}" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::${tag} points at ${sha}, which is not on master (compare: ${status}); only master commits are released."
            exit 1
          fi
          # The version in every file, as committed at the tag: the files
          # versions.mjs reads (its own list, so a version location added
          # there is checked here too). One that a tag predates is left out,
          # and versions.mjs decides whether that tag may lack it.
          # A failure of the listing stops here (set -e), never an empty list.
          listing=$(node scripts/release/versions.mjs files)
          mapfile -t listed <<< "$listing"
          files=()
          for f in "${listed[@]}"; do
            if git cat-file -e "refs/tags/${tag}:${f}" 2>/dev/null; then files+=("$f"); fi
          done
          mkdir "$RUNNER_TEMP/tagged"
          git archive "refs/tags/${tag}" "${files[@]}" | tar -x -C "$RUNNER_TEMP/tagged"
          node scripts/release/versions.mjs check --tag "$tag" --root "$RUNNER_TEMP/tagged" --github-output
          node scripts/release/ci-gate.mjs --repo "$GITHUB_REPOSITORY" --sha "$sha" --timeout-minutes 200
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} from ${sha}"

  # Pull requests sign their update bundles with a key made for this run:
  # the release key never reaches pull request code. The key signs nothing
  # anyone installs (the app built here trusts only it) and expires with the
  # run's artifacts.
  pr-key:
    name: Throwaway signing key
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate it with the app's Tauri CLI
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/pr-key"
          npm run --silent tauri -- signer generate --ci -w "$RUNNER_TEMP/pr-key/updater.key"
          test -s "$RUNNER_TEMP/pr-key/updater.key" && test -s "$RUNNER_TEMP/pr-key/updater.key.pub"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create draft release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # A re-run of the same tag reuses its draft instead of adding another.
      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          sed "s/<version>/${VERSION}/g" .github/release-notes.md > "$notes"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq .draft)
            if [ "$draft" != "true" ]; then
              echo "::error::The release for ${TAG} is already published; delete it or push a new tag."
              exit 1
            fi
            echo "Reusing draft release ${id} for ${TAG}"
          else
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${SHA}" \
              -f name="${TAG}" \
              -F body=@"$notes" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
            echo "Created draft release ${id} for ${TAG}"
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [plan, pr-key, create-release]
    # pr-key runs on pull requests only, create-release on publishing runs only.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.pr-key.result == 'success' || needs.pr-key.result == 'skipped')
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    # Cold caches: master's Windows builds 51-93 minutes; master's macOS
    # builds 45-101 minutes (the macos-latest runners differ by about 2x).
    # With lancedb 0.41 (lance 14, datafusion 54) and the app library also
    # built as a staticlib and cdylib, master's Windows build was cancelled at
    # this limit (run 43432377001, 122 minutes in "Build the app") and its
    # macOS build took 124 minutes. The library is an rlib only now
    # (app/src-tauri/Cargo.toml); the build step's cargo-timings-* artifact
    # shows where the time goes.
    timeout-minutes: 130
    # The release key is read from here on publishing runs only.
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            # Same as ci.yml: the Windows MSVC builds link the CRT dynamically.
            rustflags: '-C target-feature=-crt-static'
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ matrix.bundles }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      # Each runner builds for its own architecture, so the build runs without
      # --target and writes target/release, the same directory and flags as
      # ci.yml's footprint job (Windows), whose release-build cache it shares.
      - name: The runner builds for this target
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$BUILD_TARGET" ]; then
            echo "::error::This runner builds for ${host}, not ${BUILD_TARGET}"
            exit 1
          fi

      # rust-cache's keys hash every installed toolchain, the runner image's
      # own `stable` included (1.99.1, then 1.100.0 from macos-26-arm64
      # 20261117): each image update left no entry to restore, and the
      # entries under the old keys stayed until evicted. Every rust-cache use
      # runs this first (ci.yml's footprint job shares the Windows entry).
      - uses: ./.github/actions/only-pinned-rust

      # Caches are saved by master runs only (a pull request's or a tag's
      # cache is not readable by other refs), so pull requests and releases
      # restore what master built. The Windows key is the footprint job's
      # (one entry for both). The macOS key is this job's own: master builds
      # it on every push (ci.yml calls this workflow), and without a cache
      # every macOS build compiled all dependencies cold, close to the
      # job's limit.
      # rust-cache keeps target/ files by crate name, not by version or
      # build settings: after a lockfile or profile change, master restores
      # the previous entry, and the one it saves keeps the old builds of every
      # crate next to the new ones (the Windows entry grew from 3.1 to 4.2 GB
      # with lancedb 0.41). prefix-key starts both platforms' entries over;
      # change it here and in ci.yml's footprint job together (they share
      # the Windows entry) when a change replaces most dependency builds.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2  # zizmor: ignore[cache-poisoning]
        with:
          prefix-key: v1-rust
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # With no restored entry the build compiles every dependency: 24 to 125
      # minutes of cargo on the macOS runners from 2026-11-13 to 11-22,
      # depending on the machine (the final thin-LTO link alone took 5 to
      # more than 27 minutes, printing nothing while it runs). Two such
      # builds reached the job's limit (jobs 133231378463, 136928560235).
      # The entry goes missing when its key changes or when the repository's
      # caches pass GitHub's 10 GB and the least recently used are evicted.
      # The machine is logged so a slow build can be told from a stuck one.
      - name: Report the runner and the restored Rust cache
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            echo "CPU: $(sysctl -n machdep.cpu.brand_string), $(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GB memory"
          else
            echo "CPU: $(nproc) cores"
          fi
          if [ -d target/release ]; then
            echo "Rust cache restored: $(du -sh target/release | cut -f1) in target/release"
          else
            echo "::warning::No Rust cache entry was restored for ${BUILD_TARGET}: this build compiles every dependency, up to 125 minutes of cargo on a slow macOS runner against the job's 130-minute limit. The entry was evicted (the repository's caches are over GitHub's 10 GB) or its key changed."
          fi

      # LanceDB's protobuf definitions are compiled at build time: a pinned,
      # checksum-verified protoc from the official release (the Chocolatey
      # feed answers 503/504 at times while choco exits 0).
      - name: Install Protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - name: Install Protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        id: ort
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      # npm's download cache: one entry per platform, the same key as ci.yml's
      # frontend and footprint jobs, restored here and saved by master only.
      # setup-node's own cache saved a second copy under another key, and one
      # more from every pull request, which no other ref can read.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Locate the npm cache
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Restore the npm cache
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Save the npm cache
        if: github.ref == 'refs/heads/master' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # app/src-tauri/.cargo/config.toml holds a developer machine's Windows
      # settings (target-dir C:/build/kalki-rag, MSVC /MD flags, the Visual
      # Studio CMake generator) that the Tauri CLI would pick up: it breaks
      # the macOS builds outright. These builds use the same settings as
      # ci.yml and the footprint job, which never read that file: the
      # workspace target/ directory and the job's RUSTFLAGS.
      - name: Use the CI build settings
        shell: bash
        run: rm app/src-tauri/.cargo/config.toml

      # The app links the C++ runtime dynamically (-crt-static off, as ONNX
      # Runtime's prebuilt library requires) and llama.cpp uses OpenMP, so it
      # imports MSVCP140*.dll and VCOMP140.DLL, which a clean Windows does not
      # have. They are installed next to Shodh.exe (Microsoft's
      # app-local deployment of the Visual C++ Redistributable files).
      # It also imports DirectML.dll (ONNX Runtime's DirectML provider, which
      # runs search on the graphics card). Windows has its own copy in
      # System32, often older than the one ONNX Runtime was built with, so the
      # redistributable from the archive ort-sys links is installed next to
      # Shodh.exe as well (the application folder is searched first).
      - name: Visual C++ runtime and DirectML for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_DIR: ${{ steps.ort.outputs.extract-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' -and (Test-Path "$($_.FullName)/x64") } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redist) { throw "No Visual C++ redistributable files under $vs/VC/Redist/MSVC" }
          $dirs = Get-ChildItem "$($redist.FullName)/x64" -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|OpenMP)$' }
          if (@($dirs | Where-Object Name -match 'CRT$').Count -ne 1 -or @($dirs | Where-Object Name -match 'OpenMP$').Count -ne 1) {
            throw "Expected one CRT and one OpenMP folder in $($redist.FullName)/x64, found: $($dirs.Name -join ', ')"
          }
          # Resource sources are paths relative to src-tauri (tauri-build
          # drops the drive letter of an absolute one).
          $staging = New-Item -ItemType Directory -Force -Path 'app/src-tauri/vc-runtime'
          $resources = [ordered]@{}
          foreach ($dll in $dirs | Get-ChildItem -Filter *.dll) {
            Copy-Item -LiteralPath $dll.FullName -Destination $staging
            $resources["vc-runtime/$($dll.Name)"] = $dll.Name
            Write-Host "Bundling $($dll.Name) $($dll.VersionInfo.FileVersion) from $($redist.Name)"
          }
          if (-not $env:ORT_DIR) { throw 'The ONNX Runtime step gave no archive folder' }
          $directml = Join-Path $env:ORT_DIR 'DirectML.dll'
          if (-not (Test-Path -LiteralPath $directml)) {
            throw "No DirectML.dll in the ONNX Runtime archive at '$env:ORT_DIR'"
          }
          $dmlStaging = New-Item -ItemType Directory -Force -Path 'app/src-tauri/directml'
          Copy-Item -LiteralPath $directml -Destination $dmlStaging
          $resources['directml/DirectML.dll'] = 'DirectML.dll'
          Write-Host "Bundling DirectML.dll $((Get-Item -LiteralPath $directml).VersionInfo.FileVersion) from the ONNX Runtime archive"
          @{ bundle = @{ resources = $resources } } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/vc-runtime.conf.json"

      - name: The throwaway signing key (pull requests)
        if: needs.plan.outputs.publish != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key

      # One merged --config file: the bundled runtime (Windows) and the update
      # bundles. Pull requests also replace the updater public key with the
      # throwaway key's, so what they build trusts only that key.
      - name: Build configuration
        id: conf
        shell: bash
        run: |
          set -euo pipefail
          conf="${RUNNER_TEMP}/ci.conf.json"
          pubkey=""
          if [ "$PUBLISH" != true ]; then pubkey=$(cat "${RUNNER_TEMP}/pr-key/updater.key.pub"); fi
          PUBKEY="$pubkey" VC_CONF="${RUNNER_TEMP}/vc-runtime.conf.json" node -e '
            const fs = require("fs");
            const conf = { bundle: { createUpdaterArtifacts: true } };
            if (fs.existsSync(process.env.VC_CONF)) Object.assign(conf.bundle, JSON.parse(fs.readFileSync(process.env.VC_CONF, "utf8")).bundle);
            if (process.env.PUBKEY) conf.plugins = { updater: { pubkey: process.env.PUBKEY } };
            fs.writeFileSync(process.argv[1], JSON.stringify(conf, null, 2));
          ' "$conf"
          cat "$conf"
          if command -v cygpath >/dev/null; then conf=$(cygpath -m "$conf"); fi
          echo "path=$conf" >> "$GITHUB_OUTPUT"

      # The frontend and the Rust build (dependencies' build scripts included)
      # run without the signing key. After the second `--` the arguments go
      # to cargo build: --timings writes target/cargo-timings/ (how long each
      # crate took, and how much of that was codegen), uploaded below; -v
      # logs each rustc command line and every unit cargo found fresh, so
      # the log shows how much the restored cache saved.
      - name: Build the app
        working-directory: app
        shell: bash
        env:
          CONF: ${{ steps.conf.outputs.path }}
        run: npm run tauri -- build --no-bundle --ci --config "$CONF" -- --timings -v

      # Written when cargo exits, on success or a compile error; a build
      # cancelled at the job's limit leaves none.
      - name: Upload the build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cargo-timings-${{ matrix.name }}
          path: target/cargo-timings/
          retention-days: 14
          if-no-files-found: warn

      # Only the Tauri bundler is given the key: it makes the installers and
      # signs the update bundles. Publishing runs use the release key (from
      # the `release` environment); pull requests the throwaway key. It runs
      # in the build's job, after the build's processes and the restored
      # caches' code, so this keeps the key out of the build's environment
      # but not out of the build's reach (android-sign's header says why).
      - name: Bundle and sign the update bundles
        working-directory: app
        shell: bash
        env:
          CONF: ${{ steps.conf.outputs.path }}
          RELEASE_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          RELEASE_KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RELEASE_KEY" ]; then
              echo "::error::Publishing needs the TAURI_SIGNING_PRIVATE_KEY secret (in the release environment, or passed by tag-release.yml): without it installed apps are never offered this release."
              exit 1
            fi
            export TAURI_SIGNING_PRIVATE_KEY="$RELEASE_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            export TAURI_SIGNING_PRIVATE_KEY="${RUNNER_TEMP}/pr-key/updater.key"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          npm run tauri -- bundle --ci --bundles "$BUILD_BUNDLES" --config "$CONF"

      # What the installer ships: the app binary's non-system libraries and
      # the installer's file list. Search and OCR models are downloaded at
      # first use and must not be in it.
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_DIR: ${{ steps.ort.outputs.extract-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'target/release'
          $installer = Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was built' }
          Get-ChildItem -Recurse "$release/bundle" -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName }

          $files = & 7z l -slt $installer.FullName | Select-String '^Path = ' | ForEach-Object { $_.Line.Substring(7) }
          if ($LASTEXITCODE -ne 0) { throw '7-Zip could not list the installer' }
          Write-Host "Files in $($installer.Name):"
          $files | ForEach-Object { Write-Host "  $_" }
          $models = $files | Where-Object { $_ -match '\.(onnx|gguf|safetensors)$' }
          if ($models) { throw "The installer contains model files: $($models -join ', ')" }

          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1
          # The bundled exe is named by mainBinaryName (tauri build renames
          # cargo's shodh-rag-app.exe).
          $main = (Get-Content -Raw app/src-tauri/tauri.conf.json | ConvertFrom-Json).mainBinaryName
          if (-not $main) { throw 'tauri.conf.json has no mainBinaryName' }
          if ($files -notcontains "$main.exe") { throw "The installer does not install $main.exe" }
          $report = & $dumpbin.FullName /nologo /dependents "$release/$main.exe"
          $report | Write-Host
          # Load-time imports precede the delay-load section.
          $deps = @()
          foreach ($line in $report) {
            if ($line -match 'delay load dependencies') { break }
            if ($line -match '^\s+(\S+\.dll)\s*$') { $deps += $Matches[1] }
          }
          # Libraries installed next to the app (not NSIS plug-ins).
          $installed = $files | Where-Object { $_ -notmatch '^\$PLUGINSDIR' -and $_ -notmatch '[\\/]' }
          Write-Host "Installed next to the app: $($installed -join ', ')"
          # DirectML.dll is in System32 on the runner and on recent Windows,
          # but ONNX Runtime needs the version it was built with: when the app
          # imports it, it must be installed next to the app.
          if (($deps -contains 'DirectML.dll') -and -not ($installed -contains 'DirectML.dll')) {
            throw 'The app imports DirectML.dll but the installer does not put it next to the app'
          }
          if ($installed -contains 'DirectML.dll') {
            # The bundled copy is the archive's, for this architecture.
            $bundled = Get-Item -LiteralPath 'app/src-tauri/directml/DirectML.dll'
            $archive = Get-Item -LiteralPath (Join-Path $env:ORT_DIR 'DirectML.dll')
            if ($bundled.VersionInfo.FileVersion -ne $archive.VersionInfo.FileVersion) {
              throw "DirectML.dll is $($bundled.VersionInfo.FileVersion), not the archive's $($archive.VersionInfo.FileVersion)"
            }
            $headers = & $dumpbin.FullName /nologo /headers $bundled.FullName
            if (-not ($headers -match 'machine \(x64\)')) { throw 'DirectML.dll is not an x64 library' }
            Write-Host "DirectML.dll $($bundled.VersionInfo.FileVersion), x64, installed next to the app"
          }
          # API sets resolve inside Windows. The Visual C++ runtime may sit in
          # the runner's System32 (Visual Studio is installed) but not on a
          # clean Windows, so it must be in the installer.
          $vcRuntime = '^(vcruntime|msvcp|vcomp|concrt|vccorlib)\d'
          $missing = $deps | Where-Object {
            $dll = $_
            $inInstaller = @($installed | Where-Object { $_ -ieq $dll }).Count -gt 0
            $system = ($dll -match '^(api|ext)-ms-') -or (($dll -notmatch $vcRuntime) -and (Test-Path (Join-Path "$env:WINDIR/System32" $dll)))
            -not $inInstaller -and -not $system
          }
          if ($missing) { throw "The app imports libraries that are neither part of Windows nor in the installer: $($missing -join ', ')" }

      - name: Check the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/release/bundle"
          find "$bundle" -maxdepth 2 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' -o -name '*.sig' \) -exec du -sh {} \;
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$app" ] || [ -z "$dmg" ]; then echo "::error::No .app or .dmg was built"; exit 1; fi
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          case "$BUILD_TARGET" in aarch64-*) want=arm64 ;; *) want=x86_64 ;; esac
          archs=$(lipo -archs "$exe")
          echo "Architectures: $archs"
          [ "$archs" = "$want" ] || { echo "::error::Expected $want, got $archs"; exit 1; }
          otool -L "$exe"
          foreign=$(otool -L "$exe" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
          [ -z "$foreign" ] || { echo "::error::The app links libraries macOS does not provide: $foreign"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1
          models=$(find "$app" -name '*.onnx' -o -name '*.gguf' -o -name '*.safetensors')
          [ -z "$models" ] || { echo "::error::The app contains model files: $models"; exit 1; }
          hdiutil verify "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          echo "Contents of $(basename "$dmg"):"
          ls -la "$mount"
          hdiutil detach "$mount" >/dev/null

      # The agent runtime (omp) is not in the installer: the app downloads
      # the pinned release for its platform at first use and checks its
      # SHA-256 (crates/shodh-rag/src/harness/sidecar.rs). This checks that
      # the pinned release has a binary for this target, that it matches the
      # release's checksums, and that it starts here.
      - name: Check the agent runtime download
        shell: bash
        run: |
          set -euo pipefail
          src=crates/shodh-rag/src/harness/sidecar.rs
          version=$(sed -n 's/^pub const OMP_VERSION: &str = "\(.*\)";/\1/p' "$src")
          case "$BUILD_TARGET" in
            x86_64-pc-windows-msvc) asset=omp-windows-x64.exe ;;
            aarch64-apple-darwin) asset=omp-darwin-arm64 ;;
          esac
          base="https://github.com/can1357/oh-my-pi/releases/download/v${version}"
          dir=$(mktemp -d)
          curl -fsSL --retry 3 --max-time 300 -o "$dir/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          curl -fsSL --retry 3 --max-time 300 -o "$dir/$asset" "$base/$asset"
          expected=$(awk -v a="$asset" '{ n=$2; sub(/^\*/, "", n); if (n == a) print $1 }' "$dir/SHA256SUMS.txt")
          if [ "$BUILD_TARGET" = "x86_64-pc-windows-msvc" ]; then
            pinned=$(grep -A1 '^pub const OMP_WINDOWS_X64_SHA256' "$src" | grep -o '[0-9a-f]\{64\}' || true)
            [ "$pinned" = "$expected" ] || { echo "::error::The pinned hash ($pinned) differs from the release checksums ($expected)"; exit 1; }
          fi
          actual=$( (sha256sum "$dir/$asset" 2>/dev/null || shasum -a 256 "$dir/$asset") | awk '{print $1}')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then echo "::error::$asset: SHA-256 $actual, release lists '$expected'"; exit 1; fi
          echo "$asset $version: SHA-256 $actual matches the release checksums"
          chmod +x "$dir/$asset"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign -dv "$dir/$asset" 2>&1 || true; fi
          "$dir/$asset" --version

      - name: ONNX Runtime came from the cache
        shell: bash
        run: python -I scripts/ci/ort_archive.py verify

      # The installers and the signed update bundles, for verify (pull
      # requests) or publish (publishing runs).
      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shodh-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 14
          if-no-files-found: error

  # Shodh for Android (mobile/): the release build of the phone app, one APK
  # for arm64 phones. One file because the phone's one-tap update downloads
  # exactly Shodh_<version>_android.apk and its .sig (crates/shodh-link/src/
  # update.rs), and arm64 only because every phone Shodh supports is 64-bit
  # ARM: a universal APK would add the x86_64 library (emulators only) and
  # roughly double the download. Built as ci.yml's android job builds the
  # debug APK (the same NDK, toolchain and generated project), but with the
  # real identifier, com.shodhrag.mobile (no tauri.dev.conf.json). This job
  # never has a key: it is not in the `release` environment, reads no secret,
  # and uploads the APK unsigned for android-sign.
  android:
    name: Build (android-arm64)
    needs: [plan, pr-key, create-release]
    # pr-key runs on pull requests only, create-release on publishing runs only.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.pr-key.result == 'success' || needs.pr-key.result == 'skipped')
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A cold release build of the phone app's Rust library for one target,
    # the Gradle build and the checks: 8 minutes (job 138377458438). It keeps
    # no Rust cache entry (see the cache budget at the top of ci.yml).
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      unsigned-sha256: ${{ steps.unsigned.outputs.sha256 }}
    env:
      # The workflow's builds set their own RUSTFLAGS; Android links its C
      # library dynamically whatever -crt-static says.
      RUSTFLAGS: ''
      # The same NDK as ci.yml's android job (r27c, long-term support).
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install the phone app's dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;${{ env.BUILD_TOOLS }} ndk;${{ env.NDK_VERSION }}
          log-accepted-android-sdk-licenses: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml
          targets: aarch64-linux-android

      # Gradle's own download and every dependency of the Gradle build came
      # from services.gradle.org, Maven Central, Google's Maven and the
      # plugin portal on every run of this job, and Maven Central answered
      # a shared runner with 429 Too Many Requests (runs 45339944203 and
      # 45605978063: the build failed resolving buildSrc's Kotlin plugin).
      # They are restored from the Actions cache instead, as in ci.yml's
      # android job (same paths, same key files; see its note). A release
      # build resolves more than a debug one (R8, lint), so this job has an
      # entry of its own; with none yet, or after a key change, it starts
      # from its newest entry, then from the debug build's. Only master
      # saves.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: v1-gradle-android-release-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/src-tauri/Cargo.lock', 'mobile/plugins/shodh-android/android/*.gradle*') }}
          restore-keys: |
            v1-gradle-android-release-${{ runner.os }}-
            v1-gradle-android-debug-${{ runner.os }}-

      - name: Generate the Android project
        working-directory: mobile
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ndk" || { echo "::error::NDK $NDK_VERSION is not at $ndk"; exit 1; }
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          # The real app's identifier, com.shodhrag.mobile: no
          # tauri.dev.conf.json, which only test builds use.
          NDK_HOME="$ndk" npx tauri android init --ci
          # The elephant launcher icons replace the template's, as in ci.yml.
          cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # Gradle's release build, unsigned: no keystore is configured, and this
      # job has none to configure.
      - name: Build the release APK (unsigned)
        working-directory: mobile
        run: |
          set -euo pipefail
          start=$(date +%s)
          npx tauri android build --apk --target aarch64
          seconds=$(( $(date +%s) - start ))
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          case "${apks[0]}" in
            *-release-unsigned.apk) ;;
            *) echo "::error::Expected an unsigned release APK, found ${apks[0]}"; exit 1 ;;
          esac
          out="$RUNNER_TEMP/android"
          mkdir -p "$out"
          cp "${apks[0]}" "$out/unsigned.apk"
          echo "- release APK (unsigned) \`$(basename "${apks[0]}")\`: $(du -h "$out/unsigned.apk" | cut -f1), built in ${seconds} s" >> "$GITHUB_STEP_SUMMARY"

      # Saved only after a build that passed. The Gradle daemon outlives
      # the build with its caches open; it is stopped first, so the files
      # saved are complete.
      - name: Stop Gradle before its cache is saved
        if: github.ref == 'refs/heads/master' && steps.gradle-cache.outputs.cache-hit != 'true'
        working-directory: mobile/src-tauri/gen/android
        run: ./gradlew --stop

      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/master' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      # The screenshot tour and the scripted computer of the screenshots are
      # debug builds' only. Checked on what the APK carries: the frontend
      # the release build embedded (mobile/dist, written by its
      # beforeBuildCommand, which exists only in this job) and the native
      # library inside the APK. Signing adds a signature block and leaves
      # every entry as it is, so the signed APK carries this same library.
      # ci.yml's android job checks that a debug build has them, so this
      # check is not vacuous.
      - name: No debug-only code in the release APK
        run: |
          set -euo pipefail
          lib="$RUNNER_TEMP/android/lib/libshodh_mobile_lib.so"
          mkdir -p "$(dirname "$lib")"
          unzip -p "$RUNNER_TEMP/android/unsigned.apk" lib/arm64-v8a/libshodh_mobile_lib.so > "$lib"
          node scripts/release/android.mjs debug-markers --build release --dist mobile/dist --lib "$lib"

      # Its SHA-256, as a job output: android-sign signs only a download
      # that matches it.
      - name: The unsigned APK's digest
        id: unsigned
        run: |
          set -euo pipefail
          sha256=$(sha256sum "$RUNNER_TEMP/android/unsigned.apk" | cut -d ' ' -f 1)
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "- unsigned APK SHA-256 \`${sha256}\`" >> "$GITHUB_STEP_SUMMARY"

      # Not named shodh-*: verify and publish download that pattern, and
      # this file is never released.
      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-arm64-unsigned
          path: ${{ runner.temp }}/android/unsigned.apk
          retention-days: 1
          if-no-files-found: error

  # Signs the APK the android job built, in a job of its own, because a step
  # does not end what it started: the Gradle daemon, the Kotlin compile
  # daemon and anything a build script or an npm install script left running
  # outlive the build step, as the same user, and a restored cache puts code
  # from earlier runs in that job too. A key decoded later in the same job
  # would be on disk while they still run. This job runs no build code: no
  # cache, no npm, no cargo, no Gradle; it checks out only the release
  # scripts and the manifest checks, and uses the runner's preinstalled JDK
  # and build-tools (pinned by version) and a pinned, checksum-verified
  # Tauri CLI binary. It signs only a download whose SHA-256 is the one the
  # android job recorded. Then signed in two steps, each the only one that
  # sees its key, checked, and uploaded under the name verify and publish
  # read. Build-only runs sign through the same steps with throwaway keys.
  android-sign:
    name: Sign (android-arm64)
    needs: [plan, pr-key, android]
    # pr-key runs on pull requests only.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.pr-key.result == 'success' || needs.pr-key.result == 'skipped')
      && needs.android.result == 'success' }}
    # ubuntu-24.04, not -latest: its image lists the build-tools and JDK this
    # job uses (actions/runner-images, Ubuntu2404-Readme.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The Android key and the release key are read from here on publishing
    # runs only.
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
    env:
      # Preinstalled on the image (no setup-android: nothing is downloaded).
      BUILD_TOOLS: 35.0.0
      # The Tauri CLI the phone app's package-lock.json pins, as the release
      # publishes it for Linux: what `npx tauri signer sign` ran, without
      # npm (scripts/release/test/release-jobs.test.mjs keeps the two equal).
      # SHA-256 of tauri-cli-v<version>/cargo-tauri-x86_64-unknown-linux-gnu.tgz.
      TAURI_CLI_VERSION: 2.12.4
      TAURI_CLI_SHA256: 820ae3c7580ca637cad15f65638960ee2a96e5a491e224691c86d6f25e6c9e8a
      PUBLISH: ${{ needs.plan.outputs.publish }}
      VERSION: ${{ needs.plan.outputs.version }}
      UNSIGNED_SHA256: ${{ needs.android.outputs.unsigned-sha256 }}
    steps:
      # The release scripts and the manifest checks only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            .github/actions/android-apk-manifest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - name: The runner's build-tools and JDK
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          for t in zipalign apksigner aapt2; do
            test -x "$tools/$t" || { echo "::error::$t of build-tools $BUILD_TOOLS is not at $tools on this image"; exit 1; }
          done
          java -version
          command -v keytool >/dev/null || { echo "::error::keytool is not on PATH"; exit 1; }

      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android-arm64-unsigned
          path: ${{ runner.temp }}/android/in

      # Exactly the one file the android job uploaded, with the SHA-256 it
      # recorded, and aligned (zipalign before apksigner: signing seals the
      # layout, so the APK is never realigned after it).
      - name: The download is the APK the build made
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/android/in" -type f)
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$RUNNER_TEMP/android/in/unsigned.apk" ]; then
            echo "::error::Expected only unsigned.apk in the artifact, found: ${files[*]}"
            exit 1
          fi
          if ! [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The android job recorded no SHA-256 for the unsigned APK ('${UNSIGNED_SHA256}')"
            exit 1
          fi
          echo "${UNSIGNED_SHA256}  ${files[0]}" | sha256sum --check --strict
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c 4 "${files[0]}"

      # The only step that sees the Android key. A publishing run decodes the
      # release keystore (the `release` environment's secrets) into a folder
      # only this step's user can read, and removes the folder when the step
      # ends, whatever its outcome. A build-only run makes a throwaway key
      # here instead, with a random password, and records its certificate for
      # the check below: pull requests sign through this same step and never
      # see the release key. The password reaches keytool and apksigner
      # through the environment (:env, env:), never on a command line.
      # Signature schemes v2 and v3 (minSdkVersion 24 reads v2; v1, the JAR
      # signature, is for Android 6 and older); no v4 (.idsig) file.
      - name: Sign the APK with the Android key
        env:
          KEYSTORE_BASE64: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ needs.plan.outputs.publish == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
        run: |
          set -euo pipefail
          umask 077
          keys=$(mktemp -d "$RUNNER_TEMP/android-key.XXXXXXXX")
          trap 'rm -rf "$keys"' EXIT
          keystore="$keys/shodh.p12"
          if [ "$PUBLISH" = true ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Publishing needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets of the release environment: without the release key, Android would not update an installed Shodh with this APK."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            alias="$KEY_ALIAS"
          else
            ANDROID_KEY_PASSWORD=$(openssl rand -hex 32)
            export ANDROID_KEY_PASSWORD
            alias=shodh
            keytool -genkeypair -noprompt -keystore "$keystore" -storetype PKCS12 \
              -storepass:env ANDROID_KEY_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              -alias "$alias" -keyalg RSA -keysize 3072 -validity 2 \
              -dname 'CN=Shodh throwaway key (build-only run)'
            keytool -exportcert -keystore "$keystore" -storetype PKCS12 \
              -storepass:env ANDROID_KEY_PASSWORD -alias "$alias" -file "$keys/throwaway.der"
            # A certificate's SHA-256 digest (what apksigner prints) is the
            # SHA-256 of its DER encoding.
            echo "THROWAWAY_CERT_SHA256=$(sha256sum "$keys/throwaway.der" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          fi
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$alias" \
            --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "$RUNNER_TEMP/android/signed.apk" "$RUNNER_TEMP/android/in/unsigned.apk"

      # Under its release name: the phone's one-tap update downloads
      # Shodh_<version>_android.apk (crates/shodh-link/src/update.rs apk_name).
      - name: Name it for the release
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/android/dist"
          mkdir -p "$dist"
          apk="$dist/Shodh_${VERSION}_android.apk"
          mv "$RUNNER_TEMP/android/signed.apk" "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      # The signed APK as the phone gets it. Publishing runs expect the
      # release key's certificate (android.mjs RELEASE_CERT_SHA256), build-only
      # runs this run's throwaway one.
      - name: Check the signed APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c 4 "$APK"
          if [ "$PUBLISH" = true ]; then cert=(--release-cert); else cert=(--cert-sha256 "$THROWAWAY_CERT_SHA256"); fi
          node scripts/release/android.mjs check --apk "$APK" --version "$VERSION" \
            --build-tools "$ANDROID_HOME/build-tools/$BUILD_TOOLS" "${cert[@]}"
          echo "- signed APK \`$(basename "$APK")\`: $(du -h "$APK" | cut -f1), versionCode $(node scripts/release/android.mjs version-code "$VERSION")" >> "$GITHUB_STEP_SUMMARY"

      # allow_backup_is_off and no_emoji_compat, as ci.yml's android job
      # checks the debug APK.
      - name: The built app keeps its data on the phone and off Play Services' fonts
        uses: ./.github/actions/android-apk-manifest
        with:
          apk: ${{ env.APK }}
          build-tools: ${{ env.BUILD_TOOLS }}

      # The release key's (the desktop updater's) minisign signature over the
      # signed APK, which the phone's one-tap update verifies before it hands
      # the APK to Android. Publishing runs use the release key (the `release`
      # environment, or what tag-release.yml passes), build-only runs this
      # run's throwaway key (pr-key). verify.mjs checks the .sig against the
      # matching public key.
      - name: The throwaway signing key (pull requests)
        if: needs.plan.outputs.publish != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key

      # The Tauri CLI's own signer, from its release rather than npm: the
      # archive is checked against the pinned SHA-256 before it is opened.
      - name: The Tauri CLI (pinned binary)
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/tauri-cli.XXXXXXXX")
          archive="$dir/cargo-tauri.tgz"
          curl -fsSL --retry 3 --max-time 120 -o "$archive" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          echo "${TAURI_CLI_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$dir" cargo-tauri
          "$dir/cargo-tauri" --version
          echo "TAURI_CLI=$dir/cargo-tauri" >> "$GITHUB_ENV"

      # The only step that sees the release key.
      - name: Sign it for the one-tap update
        env:
          RELEASE_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          RELEASE_KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RELEASE_KEY" ]; then
              echo "::error::Publishing needs the TAURI_SIGNING_PRIVATE_KEY secret (in the release environment, or passed by tag-release.yml): without it no phone accepts this APK as an update."
              exit 1
            fi
            TAURI_SIGNING_PRIVATE_KEY="$RELEASE_KEY"
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            TAURI_SIGNING_PRIVATE_KEY=$(cat "$RUNNER_TEMP/pr-key/updater.key")
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          export TAURI_SIGNING_PRIVATE_KEY
          # A key without a password says so, or the CLI asks for one.
          password=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            password=(--password "")
          else
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          "$TAURI_CLI" signer sign ${password[@]+"${password[@]}"} "$APK"
          test -s "$APK.sig" || { echo "::error::tauri signer wrote no $(basename "$APK").sig"; exit 1; }

      # For verify (build-only runs) or publish: the APK and its .sig, under
      # their release names.
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shodh-android-arm64
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sig
          retention-days: 14
          if-no-files-found: error

  # The macOS app installed and started the way a tester gets it: the dmg the
  # build uploaded (the file users download), quarantined as a browser marks a
  # download, copied out of the mounted image into an Applications folder,
  # checked for what makes macOS refuse an app or crash it at launch, and
  # opened: Gatekeeper refuses it (an app without a Developer ID signature
  # and notarization is refused until it has both; the refusal is recorded
  # in the job summary). Then, as README.md tells testers, the quarantine is
  # removed and the app started through Launch Services with an empty home
  # folder of its own (a first run that cannot touch the runner's data),
  # held until the main window reports its first load (startup_ready,
  # app/src-tauri/src/startup.rs), kept running a while, and quit with the
  # system's Quit command.
  launch-macos:
    name: Launch test (macOS)
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success' }}
    # The build's image. Install, checks, launch and quit take a few minutes;
    # 20 bounds a hung step instead of the default 6 hours.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shodh-macos-aarch64
          path: ${{ runner.temp }}/dist

      # What a browser writes on a download (Safari's agent name), on the dmg:
      # mounting a quarantined image quarantines what is copied out of it.
      - name: Install it like a tester
        run: |
          set -euo pipefail
          shopt -s nullglob
          quarantine_value() { printf '0083;%x;Safari;%s' "$(date +%s)" "$(uuidgen)"; }
          # The artifact keeps the bundle folder layout (dmg/, macos/).
          dmgs=()
          while IFS= read -r -d '' f; do dmgs+=("$f"); done < <(find "$RUNNER_TEMP/dist" -name '*.dmg' -type f -print0)
          if [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::Expected one dmg in the artifact, found ${#dmgs[@]}"; exit 1; fi
          dmg="${dmgs[0]}"
          xattr -w com.apple.quarantine "$(quarantine_value)" "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          apps=("$mount"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then echo "::error::Expected one app in $(basename "$dmg"), found ${#apps[@]}"; exit 1; fi
          install_dir="$RUNNER_TEMP/Applications"
          mkdir -p "$install_dir"
          app="$install_dir/$(basename "${apps[0]}")"
          ditto "${apps[0]}" "$app"
          hdiutil detach "$mount" >/dev/null
          if quarantine=$(xattr -p com.apple.quarantine "$app" 2>/dev/null); then
            echo "Quarantined through the image, as a downloaded app is: $quarantine"
            echo "QUARANTINE_FROM=the image" >> "$GITHUB_ENV"
          else
            # A browser download of the app itself carries it on the app.
            xattr -w com.apple.quarantine "$(quarantine_value)" "$app"
            echo "The image did not pass the quarantine on; set on the app: $(xattr -p com.apple.quarantine "$app")"
            echo "QUARANTINE_FROM=set on the app (the image did not pass it on)" >> "$GITHUB_ENV"
          fi
          echo "Installed $(basename "$dmg") as $app"
          echo "APP=$app" >> "$GITHUB_ENV"

      # The usual causes of "can't be opened" and of a crash at launch, each
      # checked on the installed copy: its signature, the architecture and
      # minimum macOS of every Mach-O file in it, and where every library it
      # loads comes from.
      - name: What can be checked before it starts
        run: |
          set -euo pipefail
          plist="$APP/Contents/Info.plist"
          plutil -lint "$plist"
          exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          [ -x "$exe" ] || { echo "::error::$exe is not an executable file"; exit 1; }
          failed=0
          fail() { echo "::error::$*"; failed=1; }

          # Signature: ad hoc (no certificate, no team) over the whole bundle,
          # with its resources sealed and Info.plist bound. An executable with
          # only the linker's signature, or a broken seal, is "damaged".
          codesign --verify --deep --strict --verbose=2 "$APP"
          sig=$(codesign -dvvv "$APP" 2>&1)
          echo "$sig"
          grep -qxF "Identifier=$id" <<< "$sig" || fail "The signature's identifier is not $id"
          grep -qxF 'Signature=adhoc' <<< "$sig" || fail 'The app is not signed ad hoc'
          grep -qxF 'TeamIdentifier=not set' <<< "$sig" || fail 'The signature names a team'
          if grep -q '^Authority=' <<< "$sig"; then fail 'The signature has a certificate chain; expected ad hoc'; fi
          grep -Eq '^CodeDirectory .* flags=0x[0-9a-f]+\(([a-z-]+,)*adhoc(,[a-z-]+)*\)' <<< "$sig" || fail 'The code directory is not marked adhoc'
          if grep -q 'linker-signed' <<< "$sig"; then fail 'The app carries only the linker signature'; fi
          grep -q '^Sealed Resources version=2 ' <<< "$sig" || fail 'The resources are not sealed'
          grep -q '^Info.plist entries=' <<< "$sig" || fail 'Info.plist is not bound to the signature'

          # Minimum macOS: the runner must be able to run it, and no binary
          # may need a newer macOS than Info.plist promises (an older Mac
          # would start it and crash).
          ver_le() {
            local IFS=. i x y
            local -a a b
            read -r -a a <<< "$1"
            read -r -a b <<< "$2"
            for i in 0 1 2; do
              x=${a[i]:-0}; y=${b[i]:-0}
              if [ "$x" -lt "$y" ]; then return 0; fi
              if [ "$x" -gt "$y" ]; then return 1; fi
            done
            return 0
          }
          min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")
          os=$(sw_vers -productVersion)
          echo "LSMinimumSystemVersion $min; this runner runs macOS $os"
          ver_le "$min" "$os" || fail "LSMinimumSystemVersion $min is newer than the runner's macOS $os"

          # Every Mach-O file: built for this target only, needing no newer
          # macOS than the minimum, and loading only macOS's libraries or the
          # app's own (never a build machine's or Homebrew's).
          case "$BUILD_TARGET" in aarch64-*) want=arm64 ;; *) want=x86_64 ;; esac
          root=$(cd "$APP" && pwd -P)
          inside() { case "$(cd "$(dirname "$1")" && pwd -P)/$(basename "$1")" in "$root"/*) return 0 ;; *) return 1 ;; esac; }
          machos=()
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then machos+=("$f"); fi
          done < <(find "$APP/Contents" -type f -print0)
          echo "Mach-O files in the app: ${#machos[@]}"
          for f in "${machos[@]}"; do
            rel=${f#"$APP"/}
            archs=$(lipo -archs "$f")
            minos=$(otool -l "$f" | awk '/cmd LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit} /cmd LC_VERSION_MIN_MACOSX/ {v=1} v && $1 == "version" {print $2; exit}')
            echo "$rel: $archs, minimum macOS ${minos:-unknown}"
            [ "$archs" = "$want" ] || fail "$rel is built for '$archs', not $want"
            if [ -z "$minos" ]; then
              fail "$rel names no minimum macOS"
            elif ! ver_le "$minos" "$min"; then
              fail "$rel needs macOS $minos, newer than LSMinimumSystemVersion $min"
            fi
            dir=$(dirname "$f")
            self=$(otool -D "$f" | tail -n +2)
            rpaths=()
            while IFS= read -r r; do rpaths+=("$r"); done < <(otool -l "$f" "$exe" | awk '/cmd LC_RPATH/ {r=1} r && $1 == "path" {print $2; r=0}' | sort -u)
            while IFS= read -r dep; do
              if [ -z "$dep" ] || [ "$dep" = "$self" ]; then continue; fi
              path=""
              case "$dep" in
                /usr/lib/* | /System/Library/*) continue ;;
                @executable_path/*) path="$(dirname "$exe")/${dep#@executable_path/}" ;;
                @loader_path/*) path="$dir/${dep#@loader_path/}" ;;
                @rpath/*)
                  for r in ${rpaths[@]+"${rpaths[@]}"}; do
                    r=${r/#@executable_path/$(dirname "$exe")}
                    r=${r/#@loader_path/$dir}
                    if [ -e "$r/${dep#@rpath/}" ]; then path="$r/${dep#@rpath/}"; break; fi
                  done
                  ;;
                *) fail "$rel loads $dep, which is neither part of macOS nor in the app (a build machine or Homebrew path)"; continue ;;
              esac
              if [ -z "$path" ] || [ ! -e "$path" ]; then
                fail "$rel loads $dep, which is not in the app"
              elif ! inside "$path"; then
                fail "$rel loads $dep from $path, outside the app"
              else
                echo "  $dep -> ${path#"$APP"/}"
              fi
            done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
          done
          exit "$failed"

      # What a tester sees first: without a Developer ID signature and
      # notarization Gatekeeper refuses the downloaded app. The verdict is
      # recorded, and the refused launch is tried as a tester's double-click
      # (open), with a home folder of its own in case it is let through.
      # Expected: syspolicyd logs "rejecting" and holds the process at the
      # refusal (it never runs the app's code), and the held process is
      # stopped. Matched by name: a quarantined app opened outside
      # /Applications runs from a translocated copy at a random path.
      # Accepted (the app starts and writes its log) is reported as a notice:
      # notarization may be in place and this step needs updating. Neither
      # within 30 s fails (Gatekeeper decided 2 s after open on macOS 26).
      - name: Gatekeeper refuses the download (recorded)
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "APP_NAME=$name" >> "$GITHUB_ENV"
          status=$(spctl --status 2>&1) || true
          if verdict=$(spctl --assess --type execute -vv "$APP" 2>&1); then assessed=accepted; else assessed=rejected; fi
          printf '%s\n%s: %s\n' "$status" "$assessed" "$verdict"
          if pgrep -x "$name" >/dev/null; then echo "::error::$name is already running"; exit 1; fi

          refused_home="$RUNNER_TEMP/refused-home"
          mkdir -p "$refused_home"
          since=$(date '+%Y-%m-%d %H:%M:%S')
          start=$(now_ms)
          # In the background: open itself waits while Gatekeeper holds the
          # launch at its refusal.
          open -n --env "HOME=$refused_home" "$APP" >"$RUNNER_TEMP/refused-open.txt" 2>&1 &
          refused_open=$!
          deadline=$((start + 30000))
          outcome=""
          while [ -z "$outcome" ]; do
            rejection=$(log show --style compact --start "$since" --predicate 'process == "syspolicyd" AND eventMessage CONTAINS "rejecting"' 2>/dev/null | grep 'rejecting' || true)
            if [ -n "$rejection" ]; then outcome=refused
            elif [ -f "$refused_home/Library/Application Support/$id/logs/shodh.log" ]; then outcome=accepted
            elif [ "$(now_ms)" -gt "$deadline" ]; then
              echo "::error::Within 30 s of open Gatekeeper neither refused $name nor let it start"
              pgrep -lx "$name" || true
              exit 1
            else
              perl -e 'select(undef, undef, undef, 0.5)'
            fi
          done
          decided_ms=$(( $(now_ms) - start ))
          held=$(pgrep -x "$name" || true)
          echo "Gatekeeper: $outcome after ${decided_ms} ms; $name processes: ${held:-none}"
          echo "$rejection"
          # The held process never ran the app's code (no log was written), so
          # it is killed rather than asked to quit: it cannot answer.
          if [ -n "$held" ]; then
            # shellcheck disable=SC2086
            kill -KILL $held
            end=$(( $(now_ms) + 10000 ))
            while pgrep -x "$name" >/dev/null; do
              if [ "$(now_ms)" -gt "$end" ]; then echo "::error::The held $name process did not end"; exit 1; fi
              perl -e 'select(undef, undef, undef, 0.25)'
            done
          fi
          # open waited on the launch that is now gone; it is ended with it so
          # it never holds the next launch.
          kill "$refused_open" 2>/dev/null || true
          wait "$refused_open" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/refused-open.txt" ]; then echo "open said:"; cat "$RUNNER_TEMP/refused-open.txt"; fi
          {
            echo '### Gatekeeper (the downloaded app, quarantined)'
            echo
            echo "- \`spctl --status\`: ${status}"
            echo "- \`spctl --assess --type execute\`: **${assessed}** (\`${verdict}\`)"
            echo "- quarantine: ${QUARANTINE_FROM}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$outcome" = refused ]; then
            echo "- launch with \`open\`: **refused** ${decided_ms} ms after open, as expected until notarization (\`$(sed -n 's/.*\(rejecting.*\)/\1/p' <<< "$rejection" | head -n 1)\`); held process stopped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Gatekeeper accepted the app: notarization may now be working; update this step"
            echo "- launch with \`open\`: **accepted** (notarization may now be working; update this step)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # README.md's fix for "can't be opened" / "is damaged": remove the
      # download quarantine. The app then opens in place (no translocation).
      - name: Remove the quarantine as the README says
        run: |
          set -euo pipefail
          xattr -dr com.apple.quarantine "$APP"
          left=$(xattr -rl "$APP" | grep -c 'com.apple.quarantine' || true)
          if [ "$left" -ne 0 ]; then echo "::error::$left files still carry the quarantine"; exit 1; fi
          echo "- quarantine removed: \`xattr -dr com.apple.quarantine\` (README.md)" >> "$GITHUB_STEP_SUMMARY"

      # Ready is the log line the main window's first-load handshake writes
      # (startup.rs): the frontend has mounted the shell and loaded the index,
      # the model status, the statistics and the saved conversations, which
      # it can only do once the backend's setup has finished. The app runs
      # with HOME set to an empty folder: its data, WebKit storage and
      # preferences are a first run's, and nothing of the runner's is read.
      - name: Launch it and wait until it is ready
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          plist="$APP/Contents/Info.plist"
          exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          tester_home="$RUNNER_TEMP/tester-home"
          evidence="$RUNNER_TEMP/launch-evidence"
          mkdir -p "$tester_home" "$evidence"
          # A separate profile (SHODH_DATA_DIR), which alone may run the
          # embedded-preview probe (launch_probe.rs, the next steps).
          data_dir="$tester_home/probe-profile"
          # Past first-run setup only (ui_state_commands.rs), as a user who builds with
          # Creator is: its dialog would cover the page the probe's second part checks.
          # Everything else (WebKit, the index, the engine) still starts for the first time.
          mkdir -p "$data_dir/ui_state"
          printf '%s' '{"status":"skipped","step":"welcome"}' > "$data_dir/ui_state/first_run.json"
          log="$data_dir/logs/shodh.log"
          # Crash reports go to the logged-in user's folders whatever HOME the
          # app had: these are the ones from before the launch.
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$evidence/crash-reports-before.txt"
          {
            echo "EXE=$exe"
            echo "BUNDLE_ID=$id"
            echo "TESTER_HOME=$tester_home"
            echo "EVIDENCE=$evidence"
            echo "APP_LOG=$log"
            echo "PROBE_DATA=$data_dir"
          } >> "$GITHUB_ENV"
          if pgrep -x "$APP_NAME" >/dev/null; then echo "::error::$APP_NAME is already running"; exit 1; fi

          # open --help exits non-zero after printing its usage.
          open_help=$(open --help 2>&1 || true)
          grep -q -- '--env' <<< "$open_help" || { echo "::error::open on this runner has no --env"; echo "$open_help"; exit 1; }
          start=$(now_ms)
          open -n -W --env "HOME=$tester_home" --env "SHODH_DATA_DIR=$data_dir" --env "SHODH_LAUNCH_PROBE=embedded-preview" --stdout "$evidence/stdout.txt" --stderr "$evidence/stderr.txt" "$APP" >"$evidence/open.txt" 2>&1 &
          open_pid=$!
          echo "OPEN_PID=$open_pid" >> "$GITHUB_ENV"

          # 120 s: the slowest first start a tester would wait through without
          # calling the app hung (a fresh image's first launch includes the
          # first launch of the app, WebKit's first start and creating the
          # index). Slower fails.
          deadline=$((start + 120000))
          pid=""; process_ms=""; ready_ms=""
          while :; do
            now=$(now_ms)
            if [ -z "$pid" ]; then
              pid=$(pgrep -n -x "$APP_NAME" || true)
              if [ -n "$pid" ]; then
                process_ms=$((now - start))
                echo "Process $pid after ${process_ms} ms"
              elif ! kill -0 "$open_pid" 2>/dev/null; then
                status=0; wait "$open_pid" || status=$?
                echo "::error::open returned (status $status) and Shodh is not running: macOS refused to start it"
                cat "$evidence/open.txt"
                exit 1
              fi
            elif ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Shodh exited before its main window was ready"
              exit 1
            fi
            if [ -f "$log" ] && grep -q 'Main window ready' "$log"; then
              ready_ms=$((now - start))
              break
            fi
            if [ "$now" -gt "$deadline" ]; then
              if [ -z "$pid" ]; then echo "::error::Shodh did not start within 120 s"
              else echo "::error::Shodh started but its main window did not report ready within 120 s"; fi
              exit 1
            fi
            perl -e 'select(undef, undef, undef, 0.25)'
          done
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          ready_line=$(grep -o 'Main window ready.*' "$log" | head -n 1)
          echo "$ready_line"
          # The isolation held: the app's data folder is the separate profile's.
          if ! grep -qF "App data directory: \"$data_dir\"" "$log"; then
            echo "::error::The app did not use $data_dir as its data folder"
            grep 'App data directory' "$log" || true
            exit 1
          fi
          {
            echo '### Launch (first run, quarantine removed, through Launch Services)'
            echo
            echo "- process started: ${process_ms} ms after \`open\`"
            echo "- main window ready: ${ready_ms} ms after \`open\`"
            echo "- ${ready_line}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The embedded preview (launch_probe.rs): the app embeds a sample page (solid
      # red) with the floating chat over its corner, checks which webview is under
      # four points, logs their screen points, and waits for the screenshot. The
      # pixels: the chat over the page, the page just left of the chat's box, the
      # page alone, and the app above the page. Then the app hides both layers.
      - name: The embedded preview and the chat over it
        run: |
          set -euo pipefail
          probe_lines() { grep 'Launch probe:' "$APP_LOG" || true; }
          wait_line() {
            local pattern="$1" seconds="$2" end
            end=$(( $(date +%s) + seconds ))
            until grep -qE "$pattern" "$APP_LOG"; do
              if grep -q 'Launch probe: FAIL' "$APP_LOG"; then probe_lines; echo "::error::$(grep 'Launch probe: FAIL' "$APP_LOG" | head -n 1)"; exit 1; fi
              if [ "$(date +%s)" -gt "$end" ]; then probe_lines; echo "::error::No '$pattern' within $seconds s"; exit 1; fi
              perl -e 'select(undef, undef, undef, 0.25)'
            done
          }
          wait_line 'Launch probe: screen points' 90
          shot="$EVIDENCE/embedded-preview.bmp"
          screencapture -x -t bmp "$shot"
          touch "$PROBE_DATA/launch-probe-captured"
          # The colour at a screen point of a BMP (bottom-up rows, BGR(A)).
          le() { od -An -tu1 -j "$2" -N "$3" "$1" | awk '{for(i=NF;i>=1;i--) v=v*256+$i} END{print v}' v=0; }
          offset=$(le "$shot" 10 4); width=$(le "$shot" 18 4); height=$(le "$shot" 22 4); bpp=$(le "$shot" 28 2)
          if [ "$height" -gt 2147483647 ]; then height=$(( 4294967296 - height )); top_down=1; else top_down=0; fi
          row_bytes=$(( (width * bpp / 8 + 3) / 4 * 4 ))
          colour() {
            local x="$1" y="$2" row at
            if [ "$x" -lt 0 ] || [ "$y" -lt 0 ] || [ "$x" -ge "$width" ] || [ "$y" -ge "$height" ]; then echo off-screen; return; fi
            if [ "$top_down" = 1 ]; then row=$y; else row=$(( height - 1 - y )); fi
            at=$(( offset + row * row_bytes + x * bpp / 8 ))
            read -r b g r < <(od -An -tu1 -j "$at" -N 3 "$shot")
            if [ "$r" -gt 200 ] && [ "$g" -lt 60 ] && [ "$b" -lt 60 ]; then echo "red(rgb $r,$g,$b)"; else echo "other(rgb $r,$g,$b)"; fi
          }
          points=$(grep -o 'Launch probe: screen points.*' "$APP_LOG" | head -n 1)
          # The colour at the point the probe logged as $1.
          at_point() {
            local x y
            read -r x y < <(sed -nE "s/.*$1=\((-?[0-9]+), (-?[0-9]+)\).*/\1 \2/p" <<< "$points") || true
            if [ -z "${x:-}" ]; then echo missing; return; fi
            colour "$x" "$y"
          }
          overlap=$(at_point overlap); outside=$(at_point outside); page=$(at_point preview); main=$(at_point main)
          summary="Pixels: overlap=$overlap outside=$outside preview=$page main=$main"
          # The second part: a Creator finish with a design check, through the app's own frontend.
          # Should it fail first, the screen as it was, to see what covered the page.
          trap 'screencapture -x "$EVIDENCE/creator-finish-failed.png" || true' EXIT
          wait_line 'Launch probe: creator screen points' 120
          trap - EXIT
          shot="$EVIDENCE/creator-finish.bmp"
          screencapture -x -t bmp "$shot"
          touch "$PROBE_DATA/launch-probe-captured-creator"
          offset=$(le "$shot" 10 4); width=$(le "$shot" 18 4); height=$(le "$shot" 22 4); bpp=$(le "$shot" 28 2)
          if [ "$height" -gt 2147483647 ]; then height=$(( 4294967296 - height )); top_down=1; else top_down=0; fi
          row_bytes=$(( (width * bpp / 8 + 3) / 4 * 4 ))
          points=$(grep -o 'Launch probe: creator screen points.*' "$APP_LOG" | head -n 1)
          creator_page=$(at_point preview); creator_pane=$(at_point pane)
          creator_summary="Pixels after the Creator finish: preview=$creator_page pane=$creator_pane"
          wait_line 'Launch probe: (PASS|FAIL)' 60
          probe_lines
          echo "$summary"
          echo "$creator_summary"
          { echo '### Embedded preview'; echo; probe_lines | sed 's/^/- /'; echo "- $summary"; echo "- $creator_summary"; } >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'Launch probe: FAIL' "$APP_LOG"; then echo "::error::$(grep 'Launch probe: FAIL' "$APP_LOG" | head -n 1)"; exit 1; fi
          grep -q 'Launch probe: preview embedded label=preview-[0-9a-f]* shown=true' "$APP_LOG" || { echo "::error::The preview was not shown embedded"; exit 1; }
          grep -q 'Launch probe: preview hidden=true chat hidden=true' "$APP_LOG" || { echo "::error::The preview or the chat stayed up after the pane went"; exit 1; }
          case "$overlap $outside $page $main" in
            other*' red'*' red'*' other'*) ;;
            *) echo "::error::$summary (expected: the chat over the page, the page beside the chat and alone, the app above)"; exit 1 ;;
          esac
          grep -q 'Launch probe: creator finish shown=true docked=true' "$APP_LOG" || { echo "::error::After a Creator finish with a design check the page was not shown, or its findings covered it"; exit 1; }
          case "$creator_page $creator_pane" in
            red*' other'*) ;;
            *) echo "::error::$creator_summary (expected: the page shown, the findings beside it)"; exit 1 ;;
          esac

      # 15 s after ready covers the delayed startup work: the background
      # loads started during setup and the calendar re-index 3 s after it
      # (lib.rs). The first update check (5 minutes) is outside it.
      - name: It stays up after ready
        run: |
          set -euo pipefail
          end=$(( $(date +%s) + 15 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then echo "::error::Shodh exited within 15 s of being ready"; exit 1; fi
            perl -e 'select(undef, undef, undef, 0.5)'
          done
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$EVIDENCE/crash-reports-after.txt"
          new=$(comm -13 "$EVIDENCE/crash-reports-before.txt" "$EVIDENCE/crash-reports-after.txt" | grep -i 'shodh' || true)
          if [ -n "$new" ]; then echo "::error::A crash report for Shodh appeared: $new"; exit 1; fi
          echo "Still running 15 s after ready, no crash report"
          echo "- still running 15 s after ready, no crash report" >> "$GITHUB_STEP_SUMMARY"

      # The system's Quit command (what Cmd-Q and logging out send): the app
      # asks the window to write its saves, waits at most 3 s for it
      # (shutdown.rs SAVE_WAIT) and stops its connectors and agent runtimes,
      # each with a bounded wait; 20 s covers all of them. The log's last line
      # then says it quit, which a crash or a kill never writes.
      - name: Quit it cleanly
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          start=$(now_ms)
          osascript -e "tell application id \"$BUNDLE_ID\" to quit" &
          quit_pid=$!
          deadline=$((start + 20000))
          sent=""
          while kill -0 "$APP_PID" 2>/dev/null || kill -0 "$OPEN_PID" 2>/dev/null; do
            if [ -z "$sent" ] && ! kill -0 "$quit_pid" 2>/dev/null; then
              status=0; wait "$quit_pid" || status=$?
              if [ "$status" -ne 0 ]; then echo "::error::osascript could not send the Quit command (status $status)"; exit 1; fi
              sent=yes
            fi
            if [ "$(now_ms)" -gt "$deadline" ]; then
              echo "::error::Shodh did not exit within 20 s of the Quit command"
              kill "$quit_pid" 2>/dev/null || true
              exit 1
            fi
            perl -e 'select(undef, undef, undef, 0.25)'
          done
          exited_ms=$(( $(now_ms) - start ))
          if [ -z "$sent" ]; then
            status=0; wait "$quit_pid" || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::osascript could not send the Quit command (status $status)"; exit 1; fi
          fi
          tail -n 5 "$APP_LOG"
          last=$(tail -n 1 "$APP_LOG")
          if ! grep -qF 'Shodh quit: connectors and agent sessions stopped' <<< "$last"; then
            echo "::error::The log does not end with the quit line: $last"
            exit 1
          fi
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$EVIDENCE/crash-reports-after.txt"
          new=$(comm -13 "$EVIDENCE/crash-reports-before.txt" "$EVIDENCE/crash-reports-after.txt" | grep -i 'shodh' || true)
          if [ -n "$new" ]; then echo "::error::A crash report for Shodh appeared: $new"; exit 1; fi
          echo "Quit in ${exited_ms} ms"
          echo "- quit: exited ${exited_ms} ms after the Quit command; the log ends with the quit line" >> "$GITHUB_STEP_SUMMARY"

      # On failure: the app's log, what it printed, and any crash report for
      # it, printed here and uploaded.
      - name: The app's log and crash reports
        if: failure()
        run: |
          set -uo pipefail
          evidence="${EVIDENCE:-$RUNNER_TEMP/launch-evidence}"
          mkdir -p "$evidence"
          if [ -n "${TESTER_HOME:-}" ] && [ -d "$TESTER_HOME" ]; then
            find "$TESTER_HOME" -path '*/logs/shodh.log*' -type f -exec cp {} "$evidence/" \;
          fi
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f -iname '*shodh*' -exec cp {} "$evidence/" \;; fi
          done
          # What Gatekeeper decided about launches in this job: syspolicyd logs
          # a refusal, which the runner shows nowhere else.
          log show --last 15m --style compact --predicate 'process == "syspolicyd" OR subsystem == "com.apple.syspolicy.exec"' > "$evidence/gatekeeper.log" 2>&1 || true
          for f in "$evidence"/*; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload the app's log and crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-launch-evidence
          path: ${{ runner.temp }}/launch-evidence
          retention-days: 14
          if-no-files-found: warn

  # The Windows installer, installed silently and started on a separate profile
  # with the embedded-preview probe (launch_probe.rs), as launch-macos does:
  # which webview is under the probe's four points, then the screen's pixels at
  # them (the chat over the page, the page just left of the chat's box, the page
  # alone, the app above it), then both layers hidden again.
  launch-windows:
    name: Launch test (Windows)
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shodh-windows-x64
          path: ${{ runner.temp }}/dist

      - name: Install, launch, and check the embedded preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'launch-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          $installer = Get-ChildItem -Recurse "$env:RUNNER_TEMP/dist" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer in the artifact' }
          $dir = Join-Path $env:RUNNER_TEMP 'Shodh'
          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$dir" -PassThru -Wait
          Write-Host "Installer exited $($p.ExitCode)"
          $exe = Get-ChildItem -Recurse $dir, "$env:LOCALAPPDATA\Shodh" -Filter 'Shodh.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Shodh.exe was not installed' }
          Write-Host "Installed $($exe.FullName)"
          # A separate profile, which alone may run the probe.
          $data = Join-Path $env:RUNNER_TEMP 'probe-profile'
          New-Item -ItemType Directory -Force $data | Out-Null
          # Past first-run setup (ui_state_commands.rs), as a user who builds with Creator is:
          # its dialog would cover the page the probe's second part checks.
          New-Item -ItemType Directory -Force (Join-Path $data 'ui_state') | Out-Null
          Set-Content -Encoding ascii -Path (Join-Path $data 'ui_state\first_run.json') -Value '{"status":"skipped","step":"welcome"}'
          $log = Join-Path $data 'logs\shodh.log'
          $env:SHODH_DATA_DIR = $data
          $env:SHODH_LAUNCH_PROBE = 'embedded-preview'
          $app = Start-Process -FilePath $exe.FullName -PassThru
          function Wait-Line([string]$pattern, [int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern $pattern -Quiet))) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Launch probe: FAIL' -Quiet)) { return }
              if ($app.HasExited) { throw "Shodh exited ($($app.ExitCode)) while waiting for '$pattern'" }
              if ((Get-Date) -gt $deadline) { throw "No '$pattern' within $seconds s" }
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            Wait-Line 'Main window ready' 120
            Write-Host (Select-String -Path $log -Pattern 'Main window ready' | Select-Object -First 1).Line
            if (-not (Select-String -Path $log -SimpleMatch "App data directory: `"$data`"" -Quiet)) {
              # The app logs the path with Rust's {:?}, which doubles each backslash.
              $escaped = $data.Replace('\', '\\')
              if (-not (Select-String -Path $log -SimpleMatch "App data directory: `"$escaped`"" -Quiet)) {
                Select-String -Path $log -SimpleMatch 'App data directory' | ForEach-Object { Write-Host $_.Line }
                throw "The app did not use $data as its data folder"
              }
            }
            Wait-Line 'Launch probe: screen points' 90

            Add-Type -AssemblyName System.Drawing
            Add-Type -AssemblyName System.Windows.Forms
            $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $points = (Select-String -Path $log -Pattern 'Launch probe: screen points' | Select-Object -First 1).Line
            if ($points) {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $evidence 'embedded-preview.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            }
            New-Item -ItemType File -Force (Join-Path $data 'launch-probe-captured') | Out-Null
            $colour = {
              param($name)
              if ($points -notmatch "$name=\((-?\d+), (-?\d+)\)") { return 'missing' }
              $x = [int]$Matches[1] - $bounds.X
              $y = [int]$Matches[2] - $bounds.Y
              if ($x -lt 0 -or $y -lt 0 -or $x -ge $bounds.Width -or $y -ge $bounds.Height) { return 'off-screen' }
              $c = $bitmap.GetPixel($x, $y)
              $word = 'other'
              if ($c.R -gt 200 -and $c.G -lt 60 -and $c.B -lt 60) { $word = 'red' }
              "$word(rgb $($c.R),$($c.G),$($c.B))"
            }
            $overlap = & $colour 'overlap'
            $outside = & $colour 'outside'
            $page = & $colour 'preview'
            $main = & $colour 'main'
            $summary = "Pixels: overlap=$overlap outside=$outside preview=$page main=$main"
            # The second part: a Creator finish with a design check, through the app's own
            # frontend. The page must still show, and beside it the findings once opened.
            Wait-Line 'Launch probe: creator screen points' 120
            $points = (Select-String -Path $log -Pattern 'Launch probe: creator screen points' | Select-Object -First 1).Line
            if ($points) {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $evidence 'creator-finish.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            } else {
              # The probe failed first: the screen as it was, to see what covered the page.
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save((Join-Path $evidence 'creator-finish-failed.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            }
            New-Item -ItemType File -Force (Join-Path $data 'launch-probe-captured-creator') | Out-Null
            $creatorPage = & $colour 'preview'
            $creatorPane = & $colour 'pane'
            $creatorSummary = "Pixels after the Creator finish: preview=$creatorPage pane=$creatorPane"
            Wait-Line 'Launch probe: (PASS|FAIL)' 60
            $lines = @(Select-String -Path $log -Pattern 'Launch probe:' | ForEach-Object { $_.Line })
            $lines | ForEach-Object { Write-Host $_ }
            Write-Host $summary
            Write-Host $creatorSummary
            '### Embedded preview' | Add-Content $env:GITHUB_STEP_SUMMARY
            $lines | ForEach-Object { "- $_" } | Add-Content $env:GITHUB_STEP_SUMMARY
            "- $summary" | Add-Content $env:GITHUB_STEP_SUMMARY
            "- $creatorSummary" | Add-Content $env:GITHUB_STEP_SUMMARY
            $failed = $lines | Where-Object { $_ -match 'Launch probe: FAIL' } | Select-Object -First 1
            if ($failed) { throw $failed }
            if (-not ($lines | Where-Object { $_ -match 'Launch probe: preview embedded label=preview-[0-9a-f]+ shown=true' })) { throw 'The preview was not shown embedded' }
            if (-not ($lines | Where-Object { $_ -match 'Launch probe: hit-test overlap=dock outside=preview preview=preview main=main' })) { throw 'The hit test does not put the chat over the page and the page beside it' }
            if (-not ($lines | Where-Object { $_ -match 'Launch probe: preview hidden=true chat hidden=true' })) { throw 'The preview or the chat stayed up after the pane went' }
            if (-not ($overlap -like 'other*' -and $outside -like 'red*' -and $page -like 'red*' -and $main -like 'other*')) {
              throw "$summary (expected: the chat over the page, the page beside the chat and alone, the app above)"
            }
            if (-not ($lines | Where-Object { $_ -match 'Launch probe: creator finish shown=true docked=true' })) { throw 'After a Creator finish with a design check the page was not shown, or its findings covered it' }
            if (-not ($creatorPage -like 'red*' -and $creatorPane -like 'other*')) {
              throw "$creatorSummary (expected: the page shown, the findings beside it)"
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
            if (Test-Path $log) { Copy-Item $log $evidence }
          }

      - name: Upload the screenshot and the app's log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-launch-evidence
          path: ${{ runner.temp }}/launch-evidence
          retention-days: 14
          if-no-files-found: warn

  verify:
    name: Verify the installers
    needs: [plan, build, android-sign]
    # build runs after create-release, which is skipped on pull requests; a skipped
    # ancestor makes the implicit success() false, so the result is checked directly.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.android-sign.result == 'success'
      && needs.plan.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shodh-*
          path: ${{ runner.temp }}/installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key

      # The artifacts, then the release publish would make of them, checked
      # as publish checks it (with this run's throwaway key). shodh-* also
      # matches ci.yml's debug APK artifact in the same run: the checks take
      # each file by its exact release name, so it is never staged.
      - name: Every installer present, named for the version, and signed
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pr-key/updater.key.pub"
          node scripts/release/verify.mjs artifacts --dir "$RUNNER_TEMP/installers" --version "$VERSION" --pubkey-file "$key"
          node scripts/release/verify.mjs stage --dir "$RUNNER_TEMP/installers" --out "$RUNNER_TEMP/staged" \
            --tag "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pubkey-file "$key"
          node scripts/release/verify.mjs release --release-json "$RUNNER_TEMP/staged/release.json" --dir "$RUNNER_TEMP/staged" \
            --tag "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pubkey-file "$key"

  # The publish and smoke checks, read-only, on the latest published release:
  # what gates publishing runs on every pull request that changes it.
  published-release:
    name: Verify the published release
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - name: Download the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$RUNNER_TEMP/release.json"
          tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
          echo "Latest release: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          bash scripts/release/download-assets.sh "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets"
          # The files as they were at the tag: its version (every file
          # versions.mjs reads that the tag has, as the plan job extracts
          # them) and updater key (app/src-tauri/tauri.conf.json, one of them).
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          # A failure of the listing stops here (set -e), never an empty list.
          listing=$(node scripts/release/versions.mjs files)
          mapfile -t listed <<< "$listing"
          files=()
          for f in "${listed[@]}"; do
            if git cat-file -e "refs/tags/${tag}:${f}" 2>/dev/null; then files+=("$f"); fi
          done
          mkdir "$RUNNER_TEMP/tagged"
          git archive "refs/tags/${tag}" "${files[@]}" | tar -x -C "$RUNNER_TEMP/tagged"
          # Releases carry the Android app from the first tag whose release
          # workflow builds it (the tag has scripts/release/android.mjs): one
          # made before must not have it, one made since must.
          if git cat-file -e "refs/tags/${tag}:scripts/release/android.mjs" 2>/dev/null; then android=true; else android=false; fi
          echo "The Android app is part of ${tag}: ${android}"
          echo "android=${android}" >> "$GITHUB_OUTPUT"

      - name: Verify it as a release
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          ANDROID: ${{ steps.latest.outputs.android }}
        run: |
          set -euo pipefail
          node scripts/release/versions.mjs check --tag "$TAG" --root "$RUNNER_TEMP/tagged"
          flags=()
          if [ "$ANDROID" != true ]; then flags+=(--no-android); fi
          node scripts/release/verify.mjs release --config "$RUNNER_TEMP/tagged/app/src-tauri/tauri.conf.json" \
            --release-json "$RUNNER_TEMP/release.json" --dir "$RUNNER_TEMP/assets" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
            ${flags[@]+"${flags[@]}"}

      - name: What installed apps fetch
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify.mjs smoke --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  publish:
    name: Verify and publish
    needs: [plan, create-release, build, android-sign, launch-macos, launch-windows]
    # build needs pr-key, which is skipped on publishing runs; a skipped ancestor makes the
    # implicit success() false, so this job was skipped and the release stayed an empty
    # draft (v0.0.11, run 43993975752). Each result is checked directly, as verify does.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.publish == 'true'
      && needs.plan.result == 'success'
      && needs.create-release.result == 'success'
      && needs.build.result == 'success'
      && needs.android-sign.result == 'success'
      && needs.launch-macos.result == 'success'
      && needs.launch-windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # One publication at a time across all releases, so the latest decision
    # below sees every earlier publication. GitHub keeps one waiting job per
    # group: a third release arriving while one publishes and one waits
    # cancels the waiting one, which stays a draft; re-run that run.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write  # upload to the draft, publish it
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shodh-*
          path: ${{ runner.temp }}/installers

      # Signed with the release key (tauri.conf.json), the Android app's
      # .sig included, staged under the release names with latest.json, and
      # attached to the draft.
      - name: Attach the installers to the draft
        run: |
          set -euo pipefail
          node scripts/release/verify.mjs stage --dir "$RUNNER_TEMP/installers" --out "$RUNNER_TEMP/staged" \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -t files < <(jq -r --arg dir "$RUNNER_TEMP/staged" '.assets[].name | "\($dir)/\(.)"' "$RUNNER_TEMP/staged/release.json")
          # --clobber replaces what an earlier attempt left on the draft.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          # The draft holds exactly the staged files (an earlier attempt could
          # have left others); verify below refuses anything else.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name'

      - name: Download the draft
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          bash scripts/release/download-assets.sh "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets"

      # Every check that a user's install or update depends on. A failure
      # leaves the release a draft.
      - name: Verify the release
        run: >
          node scripts/release/verify.mjs release
          --release-json "$RUNNER_TEMP/release.json" --dir "$RUNNER_TEMP/assets"
          --tag "$TAG" --repo "$GITHUB_REPOSITORY" --checksums-out "$RUNNER_TEMP/checksums.md"

      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          # The current latest release: none yet answers 404; any other
          # failure stops here rather than guess.
          if ! previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err"); then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then previous=""; else cat "$RUNNER_TEMP/latest.err" >&2; exit 1; fi
          fi
          latest=$(node scripts/release/verify.mjs is-newer --tag "$TAG" --than "$previous")
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = true ]; then
            echo "${TAG} becomes the latest release (it was ${previous:-none})"
          else
            echo "::warning::${TAG} is published but not marked latest: ${previous} is newer and stays the latest."
          fi
          body="${RUNNER_TEMP}/body.md"
          sed "s/<version>/${VERSION}/g" .github/release-notes.md > "$body"
          printf '\n' >> "$body"
          cat "$RUNNER_TEMP/checksums.md" >> "$body"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@"$body" -F draft=false -f make_latest="$latest" --jq '"Published \(.tag_name): \(.html_url)"'

      - name: What installed apps fetch
        env:
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$LATEST" != true ]; then flags+=(--not-latest); fi
          node scripts/release/verify.mjs smoke --tag "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

      # Published but what installed apps fetch is broken: take it back.
      - name: Roll back
        if: failure() && steps.publish.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.publish.outputs.previous }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=true --jq '"\(.tag_name) is a draft again"'
          restore=""
          if [ -n "$PREVIOUS" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS}" --jq .id)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f make_latest=true --jq '"\(.tag_name) is the latest release again"'
            restore="gh api -X PATCH repos/${GITHUB_REPOSITORY}/releases/${id} -f make_latest=true"
          fi
          echo "::error::${TAG} was published but failed the checks of what installed apps fetch, so it was turned back into a draft${PREVIOUS:+ and ${PREVIOUS} is the latest again}. If this step itself failed, run: gh api -X PATCH repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID} -F draft=true${restore:+ && ${restore}}"
          exit 1
