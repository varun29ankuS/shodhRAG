name: Release

# Unsigned desktop installers on GitHub Releases, published only once they
# are verified.
#
# Publishing runs: a tag push of v*; a call from tag-release.yml when a
# release PR merges; or Run workflow (workflow_dispatch) from master with an
# existing tag, to retry a release that failed.
#   plan            the tag's commit is on master and CI passed on it
#                   (scripts/release/ci-gate.mjs), and the tag equals the
#                   version in all six files that carry it at that commit
#                   (scripts/release/versions.mjs).
#   create-release  a draft release named after the tag (body from
#                   .github/release-notes.md); a re-run reuses its draft.
#   build           the Windows NSIS installer and the Apple Silicon dmg, built
#                   without the signing key (tauri build --no-bundle), then
#                   bundled and their update bundles signed in a separate step
#                   (tauri bundle), the only step that sees the key. In the
#                   `release` environment. Uploaded as workflow artifacts; the
#                   build has no write token.
#   launch-macos    the dmg installed as a tester installs it (quarantined, copied
#                   out of the mounted image), its signature, architectures,
#                   minimum macOS and libraries checked, Gatekeeper's refusal
#                   recorded, then (quarantine removed, as README.md says)
#                   started on a macOS runner until the main window reports
#                   ready, kept up and quit. Publishing waits for it.
#   publish         (environment `release`, one at a time across releases)
#                   checks the artifacts' signatures with the release key,
#                   stages the six release files with latest.json, uploads them
#                   to the draft, downloads the draft and verifies it
#                   (scripts/release/verify.mjs release): exactly the expected
#                   files, none empty; latest.json parses, is this version and
#                   points each platform at this release's update bundle; every
#                   signature verifies against the updater public key in
#                   tauri.conf.json. Then adds the SHA-256 of each file to the
#                   notes and publishes. It becomes the latest release only if
#                   it is newer than the current latest (an older release
#                   finishing last never takes "latest" back). Then the URL
#                   installed apps poll is checked (smoke); if that fails, the
#                   release is turned back into a draft and the previous latest
#                   restored.
#
# Recovery: a failed publishing run leaves a draft (or nothing) and no
# published release. Fix the cause, then either
#   - re-run the failed run (or Run workflow with the same tag), when the fix
#     is outside the tagged commit (a flaky runner, a CDN outage); or
#   - bump the version (Prepare release) when the tagged commit itself is
#     wrong: a tag is never moved.
#
# Build-only runs (called by ci.yml without a tag: on pull requests whose
# changed files can affect the installers, on every master push and in the
# nightly run): plan, build and launch-macos, then verify checks the installers
# the builds uploaded, with update bundles signed by a throwaway key made for
# that run (pr-key): pull requests never see the release key. verify also
# stages them as a release and runs the publish-time checks on the result.
# published-release runs the publish and smoke checks, read-only, against the
# latest published release. No release is created or changed. ci.yml's
# Changes job decides when a pull request needs this (a deny-list: only
# documentation and the crates the app never builds are skippable), and its
# CI gate check counts the result.
#
# Signing key: the TAURI_SIGNING_PRIVATE_KEY secret (and its password)
# belong in the `release` environment (deployment policy: master and v*
# tags). Until they are moved there, publishing runs use the repository
# secrets, which tag-release.yml passes to this workflow; once moved, the
# environment's secrets take precedence and the repository copies can be
# deleted. A publishing run without the key fails before bundling.
#
# No Intel Mac build, and so no universal one: ONNX Runtime is linked
# statically from ort-sys's prebuilt libraries, and ort 2.0.0-rc.13 has none
# for x86_64-apple-darwin ("no prebuilt binaries available for target
# x86_64-apple-darwin"). Microsoft's last x86_64 macOS release (1.23.2) is
# older than the ONNX Runtime API 27 that ort requires, so an Intel build
# needs ONNX Runtime built from source.

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The release tag (vX.Y.Z), already pointing at the commit to build; empty (ci.yml) builds and verifies the installers without publishing.
        required: false
        default: ''
        type: string
    secrets:
      # Optional: once the key is a secret of the `release` environment, the
      # build reads it from there and these stay empty.
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (vX.Y.Z) to build and publish again, after a failed run
        required: true
        type: string

permissions:
  contents: read

# Publishing runs one at a time per tag. A build-only run (called by ci.yml)
# has a group of its own: ci.yml's concurrency already cancels a pull
# request's superseded run, and a shared group would cancel a master push's
# pending installer builds when the next push or the nightly run queued its
# own, leaving that commit without a passing CI gate.
concurrency:
  group: release-${{ inputs.tag || (github.ref_type == 'tag' && github.ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # llama.cpp (llama-cpp-sys-2) builds its HTTP client with HTTPS when CMake
  # finds OpenSSL. Shodh only loads local GGUF files and never uses llama.cpp's
  # downloader, so it is built without it: the result no longer depends on
  # which OpenSSL a runner has (OpenSSL 4 on macos-26 images from 20261012 does
  # not compile with the vendored cpp-httplib). llama-cpp-sys-2 passes CMAKE_*
  # variables to CMake, and llama.cpp's find_package(OpenSSL) is optional.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "TRUE"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    # A tag pushed by hand right after its merge waits here for CI on that
    # commit (up to 200 minutes; CI's slowest job allows 160).
    timeout-minutes: 210
    permissions:
      contents: read
      checks: read  # CI's check runs on the tagged commit
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - name: Publish or build only
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::Run this workflow from master (it was started from ${GITHUB_REF})"
            exit 1
          fi
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi
          if [ -z "$tag" ]; then
            node scripts/release/versions.mjs check --github-output
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Building the installers only (no release)"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::${tag} is not a release tag (vX.Y.Z)"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          sha=$(git rev-parse "refs/tags/${tag}^{commit}")
          # The tagged commit is master's (a tag pushed by hand can name any commit).
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${sha}" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::${tag} points at ${sha}, which is not on master (compare: ${status}); only master commits are released."
            exit 1
          fi
          # The version in every file, as committed at the tag.
          files=(app/package.json app/package-lock.json app/src-tauri/tauri.conf.json app/src-tauri/Cargo.toml crates/shodh-rag/Cargo.toml Cargo.lock)
          mkdir "$RUNNER_TEMP/tagged"
          git archive "refs/tags/${tag}" "${files[@]}" | tar -x -C "$RUNNER_TEMP/tagged"
          node scripts/release/versions.mjs check --tag "$tag" --root "$RUNNER_TEMP/tagged" --github-output
          node scripts/release/ci-gate.mjs --repo "$GITHUB_REPOSITORY" --sha "$sha" --timeout-minutes 200
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} from ${sha}"

  # Pull requests sign their update bundles with a key made for this run:
  # the release key never reaches pull request code. The key signs nothing
  # anyone installs (the app built here trusts only it) and expires with the
  # run's artifacts.
  pr-key:
    name: Throwaway signing key
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate it with the app's Tauri CLI
        working-directory: app
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          mkdir -p "$RUNNER_TEMP/pr-key"
          npm run --silent tauri -- signer generate --ci -w "$RUNNER_TEMP/pr-key/updater.key"
          test -s "$RUNNER_TEMP/pr-key/updater.key" && test -s "$RUNNER_TEMP/pr-key/updater.key.pub"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key
          retention-days: 1
          if-no-files-found: error

  create-release:
    name: Create draft release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      # A re-run of the same tag reuses its draft instead of adding another.
      - name: Create or reuse the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          sed "s/<version>/${VERSION}/g" .github/release-notes.md > "$notes"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | .id" | head -n 1)
          if [ -n "$id" ]; then
            draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${id}" --jq .draft)
            if [ "$draft" != "true" ]; then
              echo "::error::The release for ${TAG} is already published; delete it or push a new tag."
              exit 1
            fi
            echo "Reusing draft release ${id} for ${TAG}"
          else
            id=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${SHA}" \
              -f name="${TAG}" \
              -F body=@"$notes" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
            echo "Created draft release ${id} for ${TAG}"
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [plan, pr-key, create-release]
    # pr-key runs on pull requests only, create-release on publishing runs only.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.pr-key.result == 'success' || needs.pr-key.result == 'skipped')
      && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    # Slowest 88 minutes (Windows) and 86 (macOS), on cold caches.
    timeout-minutes: 130
    # The release key is read from here on publishing runs only.
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            # Same as ci.yml: the Windows MSVC builds link the CRT dynamically.
            rustflags: '-C target-feature=-crt-static'
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            rustflags: ''
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ matrix.bundles }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: 1.97.1  # keep in sync with rust-toolchain.toml

      # Each runner builds for its own architecture, so the build runs without
      # --target and writes target/release, the same directory and flags as
      # ci.yml's footprint job (Windows), whose release-build cache it shares.
      - name: The runner builds for this target
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$BUILD_TARGET" ]; then
            echo "::error::This runner builds for ${host}, not ${BUILD_TARGET}"
            exit 1
          fi

      # Caches are saved by master runs only (a pull request's or a tag's
      # cache is not readable by other refs), so a release restores what
      # master built. The Windows key is the footprint job's (one entry for
      # both). The macOS release build saves nothing: master builds it on
      # every push now (ci.yml calls this workflow), and its cache would push
      # the 10 GB pool, already full, into evicting caches on every master run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2  # zizmor: ignore[cache-poisoning]
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' && runner.os == 'Windows' }}

      # LanceDB's protobuf definitions are compiled at build time: a pinned,
      # checksum-verified protoc from the official release (the Chocolatey
      # feed answers 503/504 at times while choco exits 0).
      - name: Install Protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-protoc.ps1

      - name: Install Protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: ./.github/actions/onnxruntime
        id: ort
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0  # zizmor: ignore[cache-poisoning]
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # app/src-tauri/.cargo/config.toml holds a developer machine's Windows
      # settings (target-dir C:/build/kalki-rag, MSVC /MD flags, the Visual
      # Studio CMake generator) that the Tauri CLI would pick up: it breaks
      # the macOS builds outright. These builds use the same settings as
      # ci.yml and the footprint job, which never read that file: the
      # workspace target/ directory and the job's RUSTFLAGS.
      - name: Use the CI build settings
        shell: bash
        run: rm app/src-tauri/.cargo/config.toml

      # The app links the C++ runtime dynamically (-crt-static off, as ONNX
      # Runtime's prebuilt library requires) and llama.cpp uses OpenMP, so it
      # imports MSVCP140*.dll and VCOMP140.DLL, which a clean Windows does not
      # have. They are installed next to Shodh.exe (Microsoft's
      # app-local deployment of the Visual C++ Redistributable files).
      # It also imports DirectML.dll (ONNX Runtime's DirectML provider, which
      # runs search on the graphics card). Windows has its own copy in
      # System32, often older than the one ONNX Runtime was built with, so the
      # redistributable from the archive ort-sys links is installed next to
      # Shodh.exe as well (the application folder is searched first).
      - name: Visual C++ runtime and DirectML for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_DIR: ${{ steps.ort.outputs.extract-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' -and (Test-Path "$($_.FullName)/x64") } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redist) { throw "No Visual C++ redistributable files under $vs/VC/Redist/MSVC" }
          $dirs = Get-ChildItem "$($redist.FullName)/x64" -Directory |
            Where-Object { $_.Name -match '^Microsoft\.VC\d+\.(CRT|OpenMP)$' }
          if (@($dirs | Where-Object Name -match 'CRT$').Count -ne 1 -or @($dirs | Where-Object Name -match 'OpenMP$').Count -ne 1) {
            throw "Expected one CRT and one OpenMP folder in $($redist.FullName)/x64, found: $($dirs.Name -join ', ')"
          }
          # Resource sources are paths relative to src-tauri (tauri-build
          # drops the drive letter of an absolute one).
          $staging = New-Item -ItemType Directory -Force -Path 'app/src-tauri/vc-runtime'
          $resources = [ordered]@{}
          foreach ($dll in $dirs | Get-ChildItem -Filter *.dll) {
            Copy-Item -LiteralPath $dll.FullName -Destination $staging
            $resources["vc-runtime/$($dll.Name)"] = $dll.Name
            Write-Host "Bundling $($dll.Name) $($dll.VersionInfo.FileVersion) from $($redist.Name)"
          }
          if (-not $env:ORT_DIR) { throw 'The ONNX Runtime step gave no archive folder' }
          $directml = Join-Path $env:ORT_DIR 'DirectML.dll'
          if (-not (Test-Path -LiteralPath $directml)) {
            throw "No DirectML.dll in the ONNX Runtime archive at '$env:ORT_DIR'"
          }
          $dmlStaging = New-Item -ItemType Directory -Force -Path 'app/src-tauri/directml'
          Copy-Item -LiteralPath $directml -Destination $dmlStaging
          $resources['directml/DirectML.dll'] = 'DirectML.dll'
          Write-Host "Bundling DirectML.dll $((Get-Item -LiteralPath $directml).VersionInfo.FileVersion) from the ONNX Runtime archive"
          @{ bundle = @{ resources = $resources } } | ConvertTo-Json -Depth 4 |
            Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/vc-runtime.conf.json"

      - name: The throwaway signing key (pull requests)
        if: needs.plan.outputs.publish != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key

      # One merged --config file: the bundled runtime (Windows) and the update
      # bundles. Pull requests also replace the updater public key with the
      # throwaway key's, so what they build trusts only that key.
      - name: Build configuration
        id: conf
        shell: bash
        run: |
          set -euo pipefail
          conf="${RUNNER_TEMP}/ci.conf.json"
          pubkey=""
          if [ "$PUBLISH" != true ]; then pubkey=$(cat "${RUNNER_TEMP}/pr-key/updater.key.pub"); fi
          PUBKEY="$pubkey" VC_CONF="${RUNNER_TEMP}/vc-runtime.conf.json" node -e '
            const fs = require("fs");
            const conf = { bundle: { createUpdaterArtifacts: true } };
            if (fs.existsSync(process.env.VC_CONF)) Object.assign(conf.bundle, JSON.parse(fs.readFileSync(process.env.VC_CONF, "utf8")).bundle);
            if (process.env.PUBKEY) conf.plugins = { updater: { pubkey: process.env.PUBKEY } };
            fs.writeFileSync(process.argv[1], JSON.stringify(conf, null, 2));
          ' "$conf"
          cat "$conf"
          if command -v cygpath >/dev/null; then conf=$(cygpath -m "$conf"); fi
          echo "path=$conf" >> "$GITHUB_OUTPUT"

      # The frontend and the Rust build (dependencies' build scripts included)
      # run without the signing key.
      - name: Build the app
        working-directory: app
        shell: bash
        env:
          CONF: ${{ steps.conf.outputs.path }}
        run: npm run tauri -- build --no-bundle --ci --config "$CONF"

      # Only the Tauri bundler sees the key: it makes the installers and
      # signs the update bundles. Publishing runs use the release key (from
      # the `release` environment); pull requests the throwaway key.
      - name: Bundle and sign the update bundles
        working-directory: app
        shell: bash
        env:
          CONF: ${{ steps.conf.outputs.path }}
          RELEASE_KEY: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          RELEASE_KEY_PASSWORD: ${{ needs.plan.outputs.publish == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            if [ -z "$RELEASE_KEY" ]; then
              echo "::error::Publishing needs the TAURI_SIGNING_PRIVATE_KEY secret (in the release environment, or passed by tag-release.yml): without it installed apps are never offered this release."
              exit 1
            fi
            export TAURI_SIGNING_PRIVATE_KEY="$RELEASE_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            export TAURI_SIGNING_PRIVATE_KEY="${RUNNER_TEMP}/pr-key/updater.key"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          npm run tauri -- bundle --ci --bundles "$BUILD_BUNDLES" --config "$CONF"

      # What the installer ships: the app binary's non-system libraries and
      # the installer's file list. Search and OCR models are downloaded at
      # first use and must not be in it.
      - name: Check the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_DIR: ${{ steps.ort.outputs.extract-dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'target/release'
          $installer = Get-ChildItem "$release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was built' }
          Get-ChildItem -Recurse "$release/bundle" -File | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName }

          $files = & 7z l -slt $installer.FullName | Select-String '^Path = ' | ForEach-Object { $_.Line.Substring(7) }
          if ($LASTEXITCODE -ne 0) { throw '7-Zip could not list the installer' }
          Write-Host "Files in $($installer.Name):"
          $files | ForEach-Object { Write-Host "  $_" }
          $models = $files | Where-Object { $_ -match '\.(onnx|gguf|safetensors)$' }
          if ($models) { throw "The installer contains model files: $($models -join ', ')" }

          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -First 1
          # The bundled exe is named by mainBinaryName (tauri build renames
          # cargo's shodh-rag-app.exe).
          $main = (Get-Content -Raw app/src-tauri/tauri.conf.json | ConvertFrom-Json).mainBinaryName
          if (-not $main) { throw 'tauri.conf.json has no mainBinaryName' }
          if ($files -notcontains "$main.exe") { throw "The installer does not install $main.exe" }
          $report = & $dumpbin.FullName /nologo /dependents "$release/$main.exe"
          $report | Write-Host
          # Load-time imports precede the delay-load section.
          $deps = @()
          foreach ($line in $report) {
            if ($line -match 'delay load dependencies') { break }
            if ($line -match '^\s+(\S+\.dll)\s*$') { $deps += $Matches[1] }
          }
          # Libraries installed next to the app (not NSIS plug-ins).
          $installed = $files | Where-Object { $_ -notmatch '^\$PLUGINSDIR' -and $_ -notmatch '[\\/]' }
          Write-Host "Installed next to the app: $($installed -join ', ')"
          # DirectML.dll is in System32 on the runner and on recent Windows,
          # but ONNX Runtime needs the version it was built with: when the app
          # imports it, it must be installed next to the app.
          if (($deps -contains 'DirectML.dll') -and -not ($installed -contains 'DirectML.dll')) {
            throw 'The app imports DirectML.dll but the installer does not put it next to the app'
          }
          if ($installed -contains 'DirectML.dll') {
            # The bundled copy is the archive's, for this architecture.
            $bundled = Get-Item -LiteralPath 'app/src-tauri/directml/DirectML.dll'
            $archive = Get-Item -LiteralPath (Join-Path $env:ORT_DIR 'DirectML.dll')
            if ($bundled.VersionInfo.FileVersion -ne $archive.VersionInfo.FileVersion) {
              throw "DirectML.dll is $($bundled.VersionInfo.FileVersion), not the archive's $($archive.VersionInfo.FileVersion)"
            }
            $headers = & $dumpbin.FullName /nologo /headers $bundled.FullName
            if (-not ($headers -match 'machine \(x64\)')) { throw 'DirectML.dll is not an x64 library' }
            Write-Host "DirectML.dll $($bundled.VersionInfo.FileVersion), x64, installed next to the app"
          }
          # API sets resolve inside Windows. The Visual C++ runtime may sit in
          # the runner's System32 (Visual Studio is installed) but not on a
          # clean Windows, so it must be in the installer.
          $vcRuntime = '^(vcruntime|msvcp|vcomp|concrt|vccorlib)\d'
          $missing = $deps | Where-Object {
            $dll = $_
            $inInstaller = @($installed | Where-Object { $_ -ieq $dll }).Count -gt 0
            $system = ($dll -match '^(api|ext)-ms-') -or (($dll -notmatch $vcRuntime) -and (Test-Path (Join-Path "$env:WINDIR/System32" $dll)))
            -not $inInstaller -and -not $system
          }
          if ($missing) { throw "The app imports libraries that are neither part of Windows nor in the installer: $($missing -join ', ')" }

      - name: Check the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/release/bundle"
          find "$bundle" -maxdepth 2 \( -name '*.dmg' -o -name '*.app' -o -name '*.tar.gz' -o -name '*.sig' \) -exec du -sh {} \;
          app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$app" ] || [ -z "$dmg" ]; then echo "::error::No .app or .dmg was built"; exit 1; fi
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          case "$BUILD_TARGET" in aarch64-*) want=arm64 ;; *) want=x86_64 ;; esac
          archs=$(lipo -archs "$exe")
          echo "Architectures: $archs"
          [ "$archs" = "$want" ] || { echo "::error::Expected $want, got $archs"; exit 1; }
          otool -L "$exe"
          foreign=$(otool -L "$exe" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
          [ -z "$foreign" ] || { echo "::error::The app links libraries macOS does not provide: $foreign"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1
          models=$(find "$app" -name '*.onnx' -o -name '*.gguf' -o -name '*.safetensors')
          [ -z "$models" ] || { echo "::error::The app contains model files: $models"; exit 1; }
          hdiutil verify "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          echo "Contents of $(basename "$dmg"):"
          ls -la "$mount"
          hdiutil detach "$mount" >/dev/null

      # The agent runtime (omp) is not in the installer: the app downloads
      # the pinned release for its platform at first use and checks its
      # SHA-256 (crates/shodh-rag/src/harness/sidecar.rs). This checks that
      # the pinned release has a binary for this target, that it matches the
      # release's checksums, and that it starts here.
      - name: Check the agent runtime download
        shell: bash
        run: |
          set -euo pipefail
          src=crates/shodh-rag/src/harness/sidecar.rs
          version=$(sed -n 's/^pub const OMP_VERSION: &str = "\(.*\)";/\1/p' "$src")
          case "$BUILD_TARGET" in
            x86_64-pc-windows-msvc) asset=omp-windows-x64.exe ;;
            aarch64-apple-darwin) asset=omp-darwin-arm64 ;;
          esac
          base="https://github.com/can1357/oh-my-pi/releases/download/v${version}"
          dir=$(mktemp -d)
          curl -fsSL --retry 3 --max-time 300 -o "$dir/SHA256SUMS.txt" "$base/SHA256SUMS.txt"
          curl -fsSL --retry 3 --max-time 300 -o "$dir/$asset" "$base/$asset"
          expected=$(awk -v a="$asset" '{ n=$2; sub(/^\*/, "", n); if (n == a) print $1 }' "$dir/SHA256SUMS.txt")
          if [ "$BUILD_TARGET" = "x86_64-pc-windows-msvc" ]; then
            pinned=$(grep -A1 '^pub const OMP_WINDOWS_X64_SHA256' "$src" | grep -o '[0-9a-f]\{64\}' || true)
            [ "$pinned" = "$expected" ] || { echo "::error::The pinned hash ($pinned) differs from the release checksums ($expected)"; exit 1; }
          fi
          actual=$( (sha256sum "$dir/$asset" 2>/dev/null || shasum -a 256 "$dir/$asset") | awk '{print $1}')
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then echo "::error::$asset: SHA-256 $actual, release lists '$expected'"; exit 1; fi
          echo "$asset $version: SHA-256 $actual matches the release checksums"
          chmod +x "$dir/$asset"
          if [ "$RUNNER_OS" = "macOS" ]; then codesign -dv "$dir/$asset" 2>&1 || true; fi
          "$dir/$asset" --version

      - name: ONNX Runtime came from the cache
        shell: bash
        run: python -I scripts/ci/ort_archive.py verify

      # The installers and the signed update bundles, for verify (pull
      # requests) or publish (publishing runs).
      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shodh-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 14
          if-no-files-found: error

  # The macOS app installed and started the way a tester gets it: the dmg the
  # build uploaded (the file users download), quarantined as a browser marks a
  # download, copied out of the mounted image into an Applications folder,
  # checked for what makes macOS refuse an app or crash it at launch, and
  # opened: Gatekeeper refuses it (an app without a Developer ID signature
  # and notarization is refused until it has both; the refusal is recorded
  # in the job summary). Then, as README.md tells testers, the quarantine is
  # removed and the app started through Launch Services with an empty home
  # folder of its own (a first run that cannot touch the runner's data),
  # held until the main window reports its first load (startup_ready,
  # app/src-tauri/src/startup.rs), kept running a while, and quit with the
  # system's Quit command.
  launch-macos:
    name: Launch test (macOS)
    needs: [plan, build]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success' }}
    # The build's image. Install, checks, launch and quit take a few minutes;
    # 20 bounds a hung step instead of the default 6 hours.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BUILD_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: shodh-macos-aarch64
          path: ${{ runner.temp }}/dist

      # What a browser writes on a download (Safari's agent name), on the dmg:
      # mounting a quarantined image quarantines what is copied out of it.
      - name: Install it like a tester
        run: |
          set -euo pipefail
          shopt -s nullglob
          quarantine_value() { printf '0083;%x;Safari;%s' "$(date +%s)" "$(uuidgen)"; }
          # The artifact keeps the bundle folder layout (dmg/, macos/).
          dmgs=()
          while IFS= read -r -d '' f; do dmgs+=("$f"); done < <(find "$RUNNER_TEMP/dist" -name '*.dmg' -type f -print0)
          if [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::Expected one dmg in the artifact, found ${#dmgs[@]}"; exit 1; fi
          dmg="${dmgs[0]}"
          xattr -w com.apple.quarantine "$(quarantine_value)" "$dmg"
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          apps=("$mount"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then echo "::error::Expected one app in $(basename "$dmg"), found ${#apps[@]}"; exit 1; fi
          install_dir="$RUNNER_TEMP/Applications"
          mkdir -p "$install_dir"
          app="$install_dir/$(basename "${apps[0]}")"
          ditto "${apps[0]}" "$app"
          hdiutil detach "$mount" >/dev/null
          if quarantine=$(xattr -p com.apple.quarantine "$app" 2>/dev/null); then
            echo "Quarantined through the image, as a downloaded app is: $quarantine"
            echo "QUARANTINE_FROM=the image" >> "$GITHUB_ENV"
          else
            # A browser download of the app itself carries it on the app.
            xattr -w com.apple.quarantine "$(quarantine_value)" "$app"
            echo "The image did not pass the quarantine on; set on the app: $(xattr -p com.apple.quarantine "$app")"
            echo "QUARANTINE_FROM=set on the app (the image did not pass it on)" >> "$GITHUB_ENV"
          fi
          echo "Installed $(basename "$dmg") as $app"
          echo "APP=$app" >> "$GITHUB_ENV"

      # The usual causes of "can't be opened" and of a crash at launch, each
      # checked on the installed copy: its signature, the architecture and
      # minimum macOS of every Mach-O file in it, and where every library it
      # loads comes from.
      - name: What can be checked before it starts
        run: |
          set -euo pipefail
          plist="$APP/Contents/Info.plist"
          plutil -lint "$plist"
          exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          [ -x "$exe" ] || { echo "::error::$exe is not an executable file"; exit 1; }
          failed=0
          fail() { echo "::error::$*"; failed=1; }

          # Signature: ad hoc (no certificate, no team) over the whole bundle,
          # with its resources sealed and Info.plist bound. An executable with
          # only the linker's signature, or a broken seal, is "damaged".
          codesign --verify --deep --strict --verbose=2 "$APP"
          sig=$(codesign -dvvv "$APP" 2>&1)
          echo "$sig"
          grep -qxF "Identifier=$id" <<< "$sig" || fail "The signature's identifier is not $id"
          grep -qxF 'Signature=adhoc' <<< "$sig" || fail 'The app is not signed ad hoc'
          grep -qxF 'TeamIdentifier=not set' <<< "$sig" || fail 'The signature names a team'
          if grep -q '^Authority=' <<< "$sig"; then fail 'The signature has a certificate chain; expected ad hoc'; fi
          grep -Eq '^CodeDirectory .* flags=0x[0-9a-f]+\(([a-z-]+,)*adhoc(,[a-z-]+)*\)' <<< "$sig" || fail 'The code directory is not marked adhoc'
          if grep -q 'linker-signed' <<< "$sig"; then fail 'The app carries only the linker signature'; fi
          grep -q '^Sealed Resources version=2 ' <<< "$sig" || fail 'The resources are not sealed'
          grep -q '^Info.plist entries=' <<< "$sig" || fail 'Info.plist is not bound to the signature'

          # Minimum macOS: the runner must be able to run it, and no binary
          # may need a newer macOS than Info.plist promises (an older Mac
          # would start it and crash).
          ver_le() {
            local IFS=. i x y
            local -a a b
            read -r -a a <<< "$1"
            read -r -a b <<< "$2"
            for i in 0 1 2; do
              x=${a[i]:-0}; y=${b[i]:-0}
              if [ "$x" -lt "$y" ]; then return 0; fi
              if [ "$x" -gt "$y" ]; then return 1; fi
            done
            return 0
          }
          min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")
          os=$(sw_vers -productVersion)
          echo "LSMinimumSystemVersion $min; this runner runs macOS $os"
          ver_le "$min" "$os" || fail "LSMinimumSystemVersion $min is newer than the runner's macOS $os"

          # Every Mach-O file: built for this target only, needing no newer
          # macOS than the minimum, and loading only macOS's libraries or the
          # app's own (never a build machine's or Homebrew's).
          case "$BUILD_TARGET" in aarch64-*) want=arm64 ;; *) want=x86_64 ;; esac
          root=$(cd "$APP" && pwd -P)
          inside() { case "$(cd "$(dirname "$1")" && pwd -P)/$(basename "$1")" in "$root"/*) return 0 ;; *) return 1 ;; esac; }
          machos=()
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then machos+=("$f"); fi
          done < <(find "$APP/Contents" -type f -print0)
          echo "Mach-O files in the app: ${#machos[@]}"
          for f in "${machos[@]}"; do
            rel=${f#"$APP"/}
            archs=$(lipo -archs "$f")
            minos=$(otool -l "$f" | awk '/cmd LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit} /cmd LC_VERSION_MIN_MACOSX/ {v=1} v && $1 == "version" {print $2; exit}')
            echo "$rel: $archs, minimum macOS ${minos:-unknown}"
            [ "$archs" = "$want" ] || fail "$rel is built for '$archs', not $want"
            if [ -z "$minos" ]; then
              fail "$rel names no minimum macOS"
            elif ! ver_le "$minos" "$min"; then
              fail "$rel needs macOS $minos, newer than LSMinimumSystemVersion $min"
            fi
            dir=$(dirname "$f")
            self=$(otool -D "$f" | tail -n +2)
            rpaths=()
            while IFS= read -r r; do rpaths+=("$r"); done < <(otool -l "$f" "$exe" | awk '/cmd LC_RPATH/ {r=1} r && $1 == "path" {print $2; r=0}' | sort -u)
            while IFS= read -r dep; do
              if [ -z "$dep" ] || [ "$dep" = "$self" ]; then continue; fi
              path=""
              case "$dep" in
                /usr/lib/* | /System/Library/*) continue ;;
                @executable_path/*) path="$(dirname "$exe")/${dep#@executable_path/}" ;;
                @loader_path/*) path="$dir/${dep#@loader_path/}" ;;
                @rpath/*)
                  for r in ${rpaths[@]+"${rpaths[@]}"}; do
                    r=${r/#@executable_path/$(dirname "$exe")}
                    r=${r/#@loader_path/$dir}
                    if [ -e "$r/${dep#@rpath/}" ]; then path="$r/${dep#@rpath/}"; break; fi
                  done
                  ;;
                *) fail "$rel loads $dep, which is neither part of macOS nor in the app (a build machine or Homebrew path)"; continue ;;
              esac
              if [ -z "$path" ] || [ ! -e "$path" ]; then
                fail "$rel loads $dep, which is not in the app"
              elif ! inside "$path"; then
                fail "$rel loads $dep from $path, outside the app"
              else
                echo "  $dep -> ${path#"$APP"/}"
              fi
            done < <(otool -L "$f" | tail -n +2 | awk '{print $1}')
          done
          exit "$failed"

      # What a tester sees first: without a Developer ID signature and
      # notarization Gatekeeper refuses the downloaded app. The verdict is
      # recorded, and the refused launch is tried as a tester's double-click
      # (open), with a home folder of its own in case it is let through.
      # Expected: syspolicyd logs "rejecting" and holds the process at the
      # refusal (it never runs the app's code), and the held process is
      # stopped. Matched by name: a quarantined app opened outside
      # /Applications runs from a translocated copy at a random path.
      # Accepted (the app starts and writes its log) is reported as a notice:
      # notarization may be in place and this step needs updating. Neither
      # within 30 s fails (Gatekeeper decided 2 s after open on macOS 26).
      - name: Gatekeeper refuses the download (recorded)
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "APP_NAME=$name" >> "$GITHUB_ENV"
          status=$(spctl --status 2>&1) || true
          if verdict=$(spctl --assess --type execute -vv "$APP" 2>&1); then assessed=accepted; else assessed=rejected; fi
          printf '%s\n%s: %s\n' "$status" "$assessed" "$verdict"
          if pgrep -x "$name" >/dev/null; then echo "::error::$name is already running"; exit 1; fi

          refused_home="$RUNNER_TEMP/refused-home"
          mkdir -p "$refused_home"
          since=$(date '+%Y-%m-%d %H:%M:%S')
          start=$(now_ms)
          # In the background: open itself waits while Gatekeeper holds the
          # launch at its refusal.
          open -n --env "HOME=$refused_home" "$APP" >"$RUNNER_TEMP/refused-open.txt" 2>&1 &
          refused_open=$!
          deadline=$((start + 30000))
          outcome=""
          while [ -z "$outcome" ]; do
            rejection=$(log show --style compact --start "$since" --predicate 'process == "syspolicyd" AND eventMessage CONTAINS "rejecting"' 2>/dev/null | grep 'rejecting' || true)
            if [ -n "$rejection" ]; then outcome=refused
            elif [ -f "$refused_home/Library/Application Support/$id/logs/shodh.log" ]; then outcome=accepted
            elif [ "$(now_ms)" -gt "$deadline" ]; then
              echo "::error::Within 30 s of open Gatekeeper neither refused $name nor let it start"
              pgrep -lx "$name" || true
              exit 1
            else
              perl -e 'select(undef, undef, undef, 0.5)'
            fi
          done
          decided_ms=$(( $(now_ms) - start ))
          held=$(pgrep -x "$name" || true)
          echo "Gatekeeper: $outcome after ${decided_ms} ms; $name processes: ${held:-none}"
          echo "$rejection"
          # The held process never ran the app's code (no log was written), so
          # it is killed rather than asked to quit: it cannot answer.
          if [ -n "$held" ]; then
            # shellcheck disable=SC2086
            kill -KILL $held
            end=$(( $(now_ms) + 10000 ))
            while pgrep -x "$name" >/dev/null; do
              if [ "$(now_ms)" -gt "$end" ]; then echo "::error::The held $name process did not end"; exit 1; fi
              perl -e 'select(undef, undef, undef, 0.25)'
            done
          fi
          # open waited on the launch that is now gone; it is ended with it so
          # it never holds the next launch.
          kill "$refused_open" 2>/dev/null || true
          wait "$refused_open" 2>/dev/null || true
          if [ -s "$RUNNER_TEMP/refused-open.txt" ]; then echo "open said:"; cat "$RUNNER_TEMP/refused-open.txt"; fi
          {
            echo '### Gatekeeper (the downloaded app, quarantined)'
            echo
            echo "- \`spctl --status\`: ${status}"
            echo "- \`spctl --assess --type execute\`: **${assessed}** (\`${verdict}\`)"
            echo "- quarantine: ${QUARANTINE_FROM}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$outcome" = refused ]; then
            echo "- launch with \`open\`: **refused** ${decided_ms} ms after open, as expected until notarization (\`$(sed -n 's/.*\(rejecting.*\)/\1/p' <<< "$rejection" | head -n 1)\`); held process stopped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::Gatekeeper accepted the app: notarization may now be working; update this step"
            echo "- launch with \`open\`: **accepted** (notarization may now be working; update this step)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # README.md's fix for "can't be opened" / "is damaged": remove the
      # download quarantine. The app then opens in place (no translocation).
      - name: Remove the quarantine as the README says
        run: |
          set -euo pipefail
          xattr -dr com.apple.quarantine "$APP"
          left=$(xattr -rl "$APP" | grep -c 'com.apple.quarantine' || true)
          if [ "$left" -ne 0 ]; then echo "::error::$left files still carry the quarantine"; exit 1; fi
          echo "- quarantine removed: \`xattr -dr com.apple.quarantine\` (README.md)" >> "$GITHUB_STEP_SUMMARY"

      # Ready is the log line the main window's first-load handshake writes
      # (startup.rs): the frontend has mounted the shell and loaded the index,
      # the model status, the statistics and the saved conversations, which
      # it can only do once the backend's setup has finished. The app runs
      # with HOME set to an empty folder: its data, WebKit storage and
      # preferences are a first run's, and nothing of the runner's is read.
      - name: Launch it and wait until it is ready
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          plist="$APP/Contents/Info.plist"
          exe="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          tester_home="$RUNNER_TEMP/tester-home"
          evidence="$RUNNER_TEMP/launch-evidence"
          mkdir -p "$tester_home" "$evidence"
          data_dir="$tester_home/Library/Application Support/$id"
          log="$data_dir/logs/shodh.log"
          # Crash reports go to the logged-in user's folders whatever HOME the
          # app had: these are the ones from before the launch.
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$evidence/crash-reports-before.txt"
          {
            echo "EXE=$exe"
            echo "BUNDLE_ID=$id"
            echo "TESTER_HOME=$tester_home"
            echo "EVIDENCE=$evidence"
            echo "APP_LOG=$log"
          } >> "$GITHUB_ENV"
          if pgrep -x "$APP_NAME" >/dev/null; then echo "::error::$APP_NAME is already running"; exit 1; fi

          # open --help exits non-zero after printing its usage.
          open_help=$(open --help 2>&1 || true)
          grep -q -- '--env' <<< "$open_help" || { echo "::error::open on this runner has no --env"; echo "$open_help"; exit 1; }
          start=$(now_ms)
          open -n -W --env "HOME=$tester_home" --stdout "$evidence/stdout.txt" --stderr "$evidence/stderr.txt" "$APP" >"$evidence/open.txt" 2>&1 &
          open_pid=$!
          echo "OPEN_PID=$open_pid" >> "$GITHUB_ENV"

          # 120 s: the slowest first start a tester would wait through without
          # calling the app hung (a fresh image's first launch includes the
          # first launch of the app, WebKit's first start and creating the
          # index). Slower fails.
          deadline=$((start + 120000))
          pid=""; process_ms=""; ready_ms=""
          while :; do
            now=$(now_ms)
            if [ -z "$pid" ]; then
              pid=$(pgrep -n -x "$APP_NAME" || true)
              if [ -n "$pid" ]; then
                process_ms=$((now - start))
                echo "Process $pid after ${process_ms} ms"
              elif ! kill -0 "$open_pid" 2>/dev/null; then
                status=0; wait "$open_pid" || status=$?
                echo "::error::open returned (status $status) and Shodh is not running: macOS refused to start it"
                cat "$evidence/open.txt"
                exit 1
              fi
            elif ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Shodh exited before its main window was ready"
              exit 1
            fi
            if [ -f "$log" ] && grep -q 'Main window ready' "$log"; then
              ready_ms=$((now - start))
              break
            fi
            if [ "$now" -gt "$deadline" ]; then
              if [ -z "$pid" ]; then echo "::error::Shodh did not start within 120 s"
              else echo "::error::Shodh started but its main window did not report ready within 120 s"; fi
              exit 1
            fi
            perl -e 'select(undef, undef, undef, 0.25)'
          done
          echo "APP_PID=$pid" >> "$GITHUB_ENV"
          ready_line=$(grep -o 'Main window ready.*' "$log" | head -n 1)
          echo "$ready_line"
          # The isolation held: the app's data folder is the tester home's.
          if ! grep -qF "App data directory: \"$data_dir\"" "$log"; then
            echo "::error::The app did not use $data_dir as its data folder"
            grep 'App data directory' "$log" || true
            exit 1
          fi
          {
            echo '### Launch (first run, quarantine removed, through Launch Services)'
            echo
            echo "- process started: ${process_ms} ms after \`open\`"
            echo "- main window ready: ${ready_ms} ms after \`open\`"
            echo "- ${ready_line}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 15 s after ready covers the delayed startup work: the background
      # loads started during setup and the calendar re-index 3 s after it
      # (lib.rs). The first update check (5 minutes) is outside it.
      - name: It stays up after ready
        run: |
          set -euo pipefail
          end=$(( $(date +%s) + 15 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then echo "::error::Shodh exited within 15 s of being ready"; exit 1; fi
            perl -e 'select(undef, undef, undef, 0.5)'
          done
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$EVIDENCE/crash-reports-after.txt"
          new=$(comm -13 "$EVIDENCE/crash-reports-before.txt" "$EVIDENCE/crash-reports-after.txt" | grep -i 'shodh' || true)
          if [ -n "$new" ]; then echo "::error::A crash report for Shodh appeared: $new"; exit 1; fi
          echo "Still running 15 s after ready, no crash report"
          echo "- still running 15 s after ready, no crash report" >> "$GITHUB_STEP_SUMMARY"

      # The system's Quit command (what Cmd-Q and logging out send): the app
      # asks the window to write its saves, waits at most 3 s for it
      # (shutdown.rs SAVE_WAIT) and stops its connectors and agent runtimes,
      # each with a bounded wait; 20 s covers all of them. The log's last line
      # then says it quit, which a crash or a kill never writes.
      - name: Quit it cleanly
        run: |
          set -euo pipefail
          now_ms() { perl -MTime::HiRes=time -e 'printf "%d\n", time * 1000'; }
          start=$(now_ms)
          osascript -e "tell application id \"$BUNDLE_ID\" to quit" &
          quit_pid=$!
          deadline=$((start + 20000))
          sent=""
          while kill -0 "$APP_PID" 2>/dev/null || kill -0 "$OPEN_PID" 2>/dev/null; do
            if [ -z "$sent" ] && ! kill -0 "$quit_pid" 2>/dev/null; then
              status=0; wait "$quit_pid" || status=$?
              if [ "$status" -ne 0 ]; then echo "::error::osascript could not send the Quit command (status $status)"; exit 1; fi
              sent=yes
            fi
            if [ "$(now_ms)" -gt "$deadline" ]; then
              echo "::error::Shodh did not exit within 20 s of the Quit command"
              kill "$quit_pid" 2>/dev/null || true
              exit 1
            fi
            perl -e 'select(undef, undef, undef, 0.25)'
          done
          exited_ms=$(( $(now_ms) - start ))
          if [ -z "$sent" ]; then
            status=0; wait "$quit_pid" || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::osascript could not send the Quit command (status $status)"; exit 1; fi
          fi
          tail -n 5 "$APP_LOG"
          last=$(tail -n 1 "$APP_LOG")
          if ! grep -qF 'Shodh quit: connectors and agent sessions stopped' <<< "$last"; then
            echo "::error::The log does not end with the quit line: $last"
            exit 1
          fi
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f; fi
          done | sort > "$EVIDENCE/crash-reports-after.txt"
          new=$(comm -13 "$EVIDENCE/crash-reports-before.txt" "$EVIDENCE/crash-reports-after.txt" | grep -i 'shodh' || true)
          if [ -n "$new" ]; then echo "::error::A crash report for Shodh appeared: $new"; exit 1; fi
          echo "Quit in ${exited_ms} ms"
          echo "- quit: exited ${exited_ms} ms after the Quit command; the log ends with the quit line" >> "$GITHUB_STEP_SUMMARY"

      # On failure: the app's log, what it printed, and any crash report for
      # it, printed here and uploaded.
      - name: The app's log and crash reports
        if: failure()
        run: |
          set -uo pipefail
          evidence="${EVIDENCE:-$RUNNER_TEMP/launch-evidence}"
          mkdir -p "$evidence"
          if [ -n "${TESTER_HOME:-}" ] && [ -d "$TESTER_HOME/Library" ]; then
            find "$TESTER_HOME/Library" -path '*/logs/shodh.log*' -type f -exec cp {} "$evidence/" \;
          fi
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$d" ]; then find "$d" -type f -iname '*shodh*' -exec cp {} "$evidence/" \;; fi
          done
          # What Gatekeeper decided about launches in this job: syspolicyd logs
          # a refusal, which the runner shows nowhere else.
          log show --last 15m --style compact --predicate 'process == "syspolicyd" OR subsystem == "com.apple.syspolicy.exec"' > "$evidence/gatekeeper.log" 2>&1 || true
          for f in "$evidence"/*; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload the app's log and crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-launch-evidence
          path: ${{ runner.temp }}/launch-evidence
          retention-days: 14
          if-no-files-found: warn

  verify:
    name: Verify the installers
    needs: [plan, build]
    # build runs after create-release, which is skipped on pull requests; a skipped
    # ancestor makes the implicit success() false, so the result is checked directly.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.plan.outputs.publish != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shodh-*
          path: ${{ runner.temp }}/installers

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-updater-key
          path: ${{ runner.temp }}/pr-key

      # The artifacts, then the release publish would make of them, checked
      # as publish checks it (with this run's throwaway key).
      - name: Every installer present, named for the version, and signed
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pr-key/updater.key.pub"
          node scripts/release/verify.mjs artifacts --dir "$RUNNER_TEMP/installers" --version "$VERSION" --pubkey-file "$key"
          node scripts/release/verify.mjs stage --dir "$RUNNER_TEMP/installers" --out "$RUNNER_TEMP/staged" \
            --tag "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pubkey-file "$key"
          node scripts/release/verify.mjs release --release-json "$RUNNER_TEMP/staged/release.json" --dir "$RUNNER_TEMP/staged" \
            --tag "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pubkey-file "$key"

  # The publish and smoke checks, read-only, on the latest published release:
  # what gates publishing runs on every pull request that changes it.
  published-release:
    name: Verify the published release
    needs: plan
    if: needs.plan.outputs.publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - name: Download the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > "$RUNNER_TEMP/release.json"
          tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
          echo "Latest release: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          bash scripts/release/download-assets.sh "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets"
          # The files as they were at the tag: its version and updater key.
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          mkdir "$RUNNER_TEMP/tagged"
          git archive "refs/tags/${tag}" app/package.json app/package-lock.json app/src-tauri/tauri.conf.json \
            app/src-tauri/Cargo.toml crates/shodh-rag/Cargo.toml Cargo.lock | tar -x -C "$RUNNER_TEMP/tagged"

      - name: Verify it as a release
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release/versions.mjs check --tag "$TAG" --root "$RUNNER_TEMP/tagged"
          node scripts/release/verify.mjs release --config "$RUNNER_TEMP/tagged/app/src-tauri/tauri.conf.json" \
            --release-json "$RUNNER_TEMP/release.json" --dir "$RUNNER_TEMP/assets" --tag "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: What installed apps fetch
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify.mjs smoke --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  publish:
    name: Verify and publish
    needs: [plan, create-release, build, launch-macos]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # One publication at a time across all releases, so the latest decision
    # below sees every earlier publication. GitHub keeps one waiting job per
    # group: a third release arriving while one publishes and one waits
    # cancels the waiting one, which stays a draft; re-run that run.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write  # upload to the draft, publish it
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # runs only scripts/release (no dependencies)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: shodh-*
          path: ${{ runner.temp }}/installers

      # Signed with the release key (tauri.conf.json), staged under the
      # release names with latest.json, and attached to the draft.
      - name: Attach the installers to the draft
        run: |
          set -euo pipefail
          node scripts/release/verify.mjs stage --dir "$RUNNER_TEMP/installers" --out "$RUNNER_TEMP/staged" \
            --tag "$TAG" --repo "$GITHUB_REPOSITORY"
          mapfile -t files < <(jq -r --arg dir "$RUNNER_TEMP/staged" '.assets[].name | "\($dir)/\(.)"' "$RUNNER_TEMP/staged/release.json")
          # --clobber replaces what an earlier attempt left on the draft.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          # The draft holds exactly the staged files (an earlier attempt could
          # have left others); verify below refuses anything else.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name'

      - name: Download the draft
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          bash scripts/release/download-assets.sh "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/assets"

      # Every check that a user's install or update depends on. A failure
      # leaves the release a draft.
      - name: Verify the release
        run: >
          node scripts/release/verify.mjs release
          --release-json "$RUNNER_TEMP/release.json" --dir "$RUNNER_TEMP/assets"
          --tag "$TAG" --repo "$GITHUB_REPOSITORY" --checksums-out "$RUNNER_TEMP/checksums.md"

      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          # The current latest release: none yet answers 404; any other
          # failure stops here rather than guess.
          if ! previous=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err"); then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then previous=""; else cat "$RUNNER_TEMP/latest.err" >&2; exit 1; fi
          fi
          latest=$(node scripts/release/verify.mjs is-newer --tag "$TAG" --than "$previous")
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = true ]; then
            echo "${TAG} becomes the latest release (it was ${previous:-none})"
          else
            echo "::warning::${TAG} is published but not marked latest: ${previous} is newer and stays the latest."
          fi
          body="${RUNNER_TEMP}/body.md"
          sed "s/<version>/${VERSION}/g" .github/release-notes.md > "$body"
          printf '\n' >> "$body"
          cat "$RUNNER_TEMP/checksums.md" >> "$body"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@"$body" -F draft=false -f make_latest="$latest" --jq '"Published \(.tag_name): \(.html_url)"'

      - name: What installed apps fetch
        env:
          LATEST: ${{ steps.publish.outputs.latest }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$LATEST" != true ]; then flags+=(--not-latest); fi
          node scripts/release/verify.mjs smoke --tag "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

      # Published but what installed apps fetch is broken: take it back.
      - name: Roll back
        if: failure() && steps.publish.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.publish.outputs.previous }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=true --jq '"\(.tag_name) is a draft again"'
          restore=""
          if [ -n "$PREVIOUS" ]; then
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS}" --jq .id)
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f make_latest=true --jq '"\(.tag_name) is the latest release again"'
            restore="gh api -X PATCH repos/${GITHUB_REPOSITORY}/releases/${id} -f make_latest=true"
          fi
          echo "::error::${TAG} was published but failed the checks of what installed apps fetch, so it was turned back into a draft${PREVIOUS:+ and ${PREVIOUS} is the latest again}. If this step itself failed, run: gh api -X PATCH repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID} -F draft=true${restore:+ && ${restore}}"
          exit 1
