[workspace]
resolver = "2"
members = [
    "crates/shodh-rag",
    "crates/shodh-ontology",
    "crates/shodh-eval",
    "crates/sandbox-probe",
    "crates/shodh-link",
    "app/src-tauri",
]

# The agent runtime binary is hashed before every launch (ADR 0001). An
# unoptimized sha2 makes that take seconds in dev builds.
[profile.dev.package.sha2]
opt-level = 3

# PDF layout parsing runs during indexing; unoptimized it is ~20x slower,
# which made indexing a paper library in dev builds take minutes.
[profile.dev.package.pdf_oxide]
opt-level = 3

# The table model (docling-pdf) renders candidate pages and resamples them in
# pure Rust before inference; unoptimized that alone takes seconds per page.
[profile.dev.package.docling-pdf]
opt-level = 3

[profile.dev.package.docling-core]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.lopdf]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.weezl]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# Code mode's code map parses every source file of a project with these
# grammars; unoptimized C parsers make a dev build's map (and the indexing
# speed CI reports) many times slower than a user's.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3

[profile.dev.package.tree-sitter-typescript]
opt-level = 3

[profile.dev.package.tree-sitter-javascript]
opt-level = 3

[profile.dev.package.tree-sitter-python]
opt-level = 3

[profile.dev.package.tree-sitter-go]
opt-level = 3

# Every search and every chunk indexed is tokenized (the E5 model, and the reranker
# fitting each candidate to its window, several times per candidate); unoptimized it
# is many times slower, so the search time CI measures (Recall's scorecard) would not
# be a user's.
[profile.dev.package.tokenizers]
opt-level = 3

# llama-cpp-sys-2's build script links `msvcrtd` (the debug CRT) whenever the build
# script itself was compiled with debug assertions, even though it builds llama.cpp
# as Release /MD. In dev/test builds that pulled the debug CRT into every binary
# alongside Rust's release `msvcrt` (LNK4098). Turning debug assertions off for
# this package keeps the whole link on the release dynamic CRT.
[profile.dev.package.llama-cpp-sys-2]
debug-assertions = false

# Release builds are what users run: smaller and faster code, no symbols.
# panic stays "unwind": PDF parsing and the table model catch parser panics
# (catch_unwind) so one malformed file never takes the app down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Build time of the lance, lancedb and datafusion crates (lancedb 0.41: lance
# 14, datafusion 54) in release builds. With codegen-units = 1 each of these
# crates is one LLVM module, optimized on one core before the link and again
# as one ThinLTO job at the link; on the 3-core macOS runner the lance crates
# alone held the release build for about 40 minutes and pushed it past its
# 130-minute limit. 16 units (rustc's default) split that work across cores.
# Cargo applies codegen-units per package (an override may set anything but
# lto, panic and rpath), and lto = "thin" above still covers the whole graph:
# ThinLTO imports and inlines across these units as it does across crates,
# so the generated code changes little and behaviour not at all.
# Left at 1: the vector distance and decoding kernels (lance-linalg,
# lance-bitpacking, fsst), which brute-force search runs in its inner loop,
# and the proc-macro crates (lance-derive, datafusion-macros).
[profile.release.package.lance]
codegen-units = 16

[profile.release.package.lance-arrow]
codegen-units = 16

[profile.release.package.lance-arrow-scalar]
codegen-units = 16

[profile.release.package.lance-arrow-stats]
codegen-units = 16

[profile.release.package.lance-core]
codegen-units = 16

[profile.release.package.lance-datafusion]
codegen-units = 16

[profile.release.package.lance-datagen]
codegen-units = 16

[profile.release.package.lance-encoding]
codegen-units = 16

[profile.release.package.lance-file]
codegen-units = 16

[profile.release.package.lance-index]
codegen-units = 16

[profile.release.package.lance-index-core]
