[package]
name = "shodh-rag-app"
version = "0.1.0"
description = "Shodh-RAG Tauri App with Tree-sitter Intelligence"
authors = ["Roshera Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shodh_rag_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# Encrypt the audit database (shodh.db) with SQLCipher. Builds a vendored
# OpenSSL, which on Windows needs a native Perl (e.g. Strawberry Perl).
audit-encryption = ["shodh-rag/sqlcipher"]

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.2"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
# tauri-plugin-updater = "2.0"  # Disabled until update server is configured
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
# PNG encoding of clipboard images; decoding before OCR
image = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Document generation libraries
printpdf = "0.7"  # For PDF generation
docx-rs = "0.4"   # For Word documents
rust_xlsxwriter = "0.60"  # For Excel files

# Include our RAG system
shodh-rag = { path = "../../crates/shodh-rag" }

# File watching
notify = { version = "6.1", features = ["serde"] }

# OS credential store for provider API keys (Windows Credential Manager,
# macOS Keychain, Secret Service on Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# MCP Protocol (Model Context Protocol) for tool integrations
async-trait = "0.1"
futures = "0.3"
dashmap = "5.5"

# Windows OCR
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
] }

[dev-dependencies]
tempfile = "3"
