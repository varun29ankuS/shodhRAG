[package]
name = "shodh-rag-app"
version = "0.0.10"
description = "Shodh-RAG Tauri App with Tree-sitter Intelligence"
authors = ["Roshera Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shodh_rag_app_lib"
# rlib only: the desktop app (main.rs) is the only thing built from this
# library. Tauri's template adds "staticlib" and "cdylib" for `tauri android`
# and `tauri ios`, which nothing here builds; add them back before building
# for mobile. With them, every build also linked the whole dependency graph
# into a shared and a static library nobody used, without LTO, so in release
# builds every dependency was compiled to machine code as well as to the
# bitcode the binary's ThinLTO reads (cargo --timings on the Windows release
# build: most of each heavy crate's time in codegen, and this library's unit
# 1,044 s on the critical path before the binary's link could start).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
# Encrypt the audit database (shodh.db) with SQLCipher. Builds a vendored
# OpenSSL, which on Windows needs a native Perl (e.g. Strawberry Perl).
audit-encryption = ["shodh-rag/sqlcipher"]

[dependencies]
# image-png: the clipboard plugin decodes PNG bytes for Copy image of a snippet
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.2"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
# Native reminder notifications (desktop: title and body only, see reminders.rs)
tauri-plugin-notification = "~2.3.3"
# Optional "start with Windows" (off by default)
tauri-plugin-autostart = "~2.5.1"
# One Shodh per user: a second launch (e.g. while hidden in the tray) shows the
# running window instead of starting another process on the same data
tauri-plugin-single-instance = "=2.3.6"
# Signed in-app updates from GitHub Releases (updater.rs). 2.14 needs tauri 2.12+.
tauri-plugin-updater = "~2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1"
url = "2"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.21"
# PNG encoding of clipboard images; decoding before OCR
image = "0.25"
tracing = "0.1"
# The QR code of a Telegram link (the module grid only; the page draws it). No image
# rendering, so no default features.
qrcode = { version = "0.14", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Document generation libraries
docx-rs = "0.4"   # For Word documents
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"

# Include our RAG system
shodh-rag = { path = "../../crates/shodh-rag" }
shodh-ontology = { path = "../../crates/shodh-ontology" }

# File watching
notify = { version = "6.1", features = ["serde"] }

# OS credential store for provider API keys (Windows Credential Manager,
# macOS Keychain, Secret Service on Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# MCP servers and skills for the agent (mcp/): downloads (enola), archives
# and skill folders
async-trait = "0.1"
futures = "0.3"
dashmap = "5.5"
reqwest = "0.12"
hex = "0.4"
flate2 = "1"
tar = "0.4"
walkdir = "2"
# Exports of a creation's versions (creations/mod.rs).
zip = "9"

# Windows OCR
[target.'cfg(windows)'.dependencies]
# WebView2 PrintToPdf for PDF export (pdf_export.rs). Same versions as wry
# uses, so `PlatformWebview::controller()` returns these exact types.
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    # The user's regional format for WebView2's date fields (profile.rs).
    "Win32_Globalization",
    # The account's display name, kept out of Slack answers (connectors/slack.rs).
    "Win32_Security_Authentication_Identity",
    # A creation file's real path, links and identity, read from its open handle
    # (creations/handle.rs).
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# A creation file opened without following a final link, and its real path read
# from the open descriptor (creations/handle.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
bytes = "1"
# Time zones with daylight saving for the reminder scheduler tests
chrono-tz = "0.10"
# The mock runtime, for the app ACL test (acl_manifest.rs)
tauri = { version = "2.0", features = ["test"] }
# Paused time for the connector stop tests (connectors/mod.rs)
tokio = { version = "1", features = ["test-util"] }
# Generated PDFs for the snippet tool tests (agent_tools/papers.rs)
shodh-rag = { path = "../../crates/shodh-rag", features = ["test-fixtures"] }
