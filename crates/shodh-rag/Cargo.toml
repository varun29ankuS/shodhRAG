[package]
name = "shodh-rag"
version = "0.1.0"
edition = "2021"
description = "Lightweight RAG engine powered by LanceDB and Tantivy"
authors = ["Roshera Team"]

[dependencies]
# Vector storage + ANN
lancedb = "0.26"
arrow-array = "57"
arrow-schema = "57"
arrow = { version = "57", features = ["prettyprint"] }

# Full-text search
tantivy = "0.22"

# Embeddings (ONNX)
ort = "2.0.0-rc.13"
# default-features = false drops `esaxx_fast`, whose esaxx-rs build script hardcodes
# `static_crt(true)` (/MT). Every other native dep (llama.cpp, onnxruntime, onig) is
# built against the dynamic CRT (/MD), so the static esaxx object caused LNK2038
# RuntimeLibrary mismatches + LNK2005 duplicate STL symbols when linking test
# binaries. esaxx is only used by the Unigram *trainer*, which we never call; the
# pure-Rust fallback is used if it ever is. `onig` is kept: it backs SysRegex used by
# tokenizer.json pre-tokenizers/normalizers.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
tracing = "0.1"
lru = "0.12"
futures = "0.3"
futures-util = "0.3"

# LLM providers (llama.cpp GGUF, external APIs) and the search model downloader
llama-cpp-2 = "0.1"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
# Agent web tools: URL parsing, HTML to text, arXiv Atom feeds.
url = "2"
html2text = "0.14"
roxmltree = "0.20"
bytes = "1"

# Document parsing
pdf-extract = "0.7"
lopdf = "0.32"
zip = "2"
calamine = { version = "0.24", features = ["dates"] }
csv = "1"
encoding_rs = "0.8"
chardetng = "0.1"

# Agent harness: host-tool argument validation
jsonschema = { version = "0.46", default-features = false }
# Agent harness: omp sidecar (JSONL framing, pinned-binary verification)
tokio-util = { version = "0.7", features = ["codec"] }
sha2 = "0.10"
hex = "0.4"

# Typed statements (memory, records, graph) are validated against the ontology.
shodh-ontology = { path = "../shodh-ontology" }
semver = "1"

# Audit log: SQLite store. Plain bundled SQLite by default; the `sqlcipher`
# feature switches to SQLCipher with a vendored OpenSSL (needs a Windows-native
# Perl such as Strawberry Perl to build on Windows).
rusqlite = { version = "0.32", features = ["bundled"] }
# Audit log: database key generation (OS CSPRNG)
rand = "0.8"

# Utilities
regex = "1"
walkdir = "2"
dirs = "5"

[features]
default = []
# Report dead code, unused variables and imports (see lib.rs).
strict = []
# Encrypt the audit database with SQLCipher (key from the OS keychain).
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

# Windows OCR (Windows.Media.Ocr + Windows.Data.Pdf)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Data_Pdf",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "Globalization",
] }

[dev-dependencies]
tempfile = "3"
