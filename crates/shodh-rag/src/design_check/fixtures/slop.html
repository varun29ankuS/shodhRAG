<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; }
    .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .headline { background: linear-gradient(90deg, #a855f7, #3b82f6); -webkit-background-clip: text; }
    .card { border-left: 4px solid #8b5cf6; border-radius: 12px; }
    .fine { font-size: 10px; }
    .muted { color: #aaaaaa; background: #ffffff; }
    .cta:focus { outline: none; }
    .glow { box-shadow: 0 0 24px rgba(139, 92, 246, 0.7); }
  </style>
</head>
<body>
  <section class="hero">
    <h1 class="headline">Supercharge your workflow</h1>
    <h3>Not a tool. A partner.</h3>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <img src="https://placehold.co/600x400">
    <div onclick="go()" class="cta">🚀 Get started</div>
    <input type="email" placeholder="Email">
    <button><svg viewBox="0 0 24 24"><path d="M0 0h24"/></svg></button>
  </section>
</body>
</html>
