[package]
name = "shodh-mobile"
# The phone and the desktop must be the same Shodh version (the phone link
# checks it), so it is set with the app's: scripts/release/versions.mjs.
# lib.rs fails the build when it differs from shodh-link's.
version = "0.0.11"
edition = "2021"
description = "Shodh on the phone: a remote for the user's own Shodh computer, over the phone link"
publish = false

# Its own workspace and lockfile, built for Android by CI's android job and
# for iPhone by its ios job only: the desktop's jobs never build it, and a
# phone-only dependency change does not touch the desktop's Cargo.lock.
[workspace]

[lib]
name = "shodh_mobile_lib"
# cdylib: the library Android loads. staticlib: the library the iOS app's
# Xcode project links (libapp.a). rlib: what the binary target links.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
# Reads the release key from the desktop's tauri.conf.json (build.rs).
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = [] }
shodh-link = { path = "../../crates/shodh-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# What both phones use.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Scanning the pairing QR code (the official plugin); MIT OR Apache-2.0.
tauri-plugin-barcode-scanner = "=2.5.3"
# The lock's fingerprint, Face ID or Touch ID (the official plugin);
# Apache-2.0 OR MIT.
tauri-plugin-biometric = "=2.5.0"
# The phone's model name (Android's system properties, iOS's uname), and
# Android's logcat.
#
# Below 0.2.190: from that version libc has `in6_ifreq` on macOS only, and
# netdev 0.46 (through iroh 1.4.1's netwatch 0.19, which takes no newer
# netdev) reads the interfaces' IPv6 flags with it on every Apple system, so
# the phone link does not compile for iOS with a newer libc (netdev 0.48
# reads them on macOS only). The bound goes when iroh moves to a netwatch
# that takes netdev 0.48 or later.
libc = ">=0.2.174, <0.2.190"

[target.'cfg(target_os = "android")'.dependencies]
# The phone's link key and its paired computer, in SharedPreferences
# encrypted with an AES-GCM key that the Android Keystore generates and never
# exports (vault_android.rs). By the keyring-rs maintainers; MIT OR Apache-2.0.
android-native-keyring-store = "=1.0.0"
keyring-core = "1"
# Shodh's own Android glue (Kotlin where Android requires it).
tauri-plugin-shodh-android = { path = "../plugins/shodh-android" }
# Content-free notifications posted through the plugin's Notifier from any thread
# (notify.rs): the JVM and the app's context, as Tauri's runtime set them up.
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
# The phone's link key and its paired computer, as generic passwords of the
# iOS Keychain that never leave the device (vault_ios.rs). The crates rustls
# already brings for the platform's certificate checks; MIT OR Apache-2.0.
security-framework = "3"
security-framework-sys = "2"
# Keychain attributes, and NSLog's strings (log.rs). MIT OR Apache-2.0.
core-foundation = "0.10"
# Shodh's own iOS glue (Swift where iOS requires it).
tauri-plugin-shodh-ios = { path = "../plugins/shodh-ios" }

# Line tables only (file:line in panics and backtraces): a full-debuginfo
# library makes a debug APK (and a debug iOS app) several times larger.
[profile.dev]
debug = "line-tables-only"
